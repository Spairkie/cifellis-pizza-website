<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order Online | Cifelli's Pizza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Order Cifelli's Pizza online for pickup or delivery.">
<meta name="theme-color" content="#1c1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cifelli's Order">
<!--
  Analytics scaffold: same as index.html — see ROADMAP.md section 5.
  Covers the ordering flow (the part that actually matters for
  conversion), not just the homepage.
-->
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e5b5fa0da8314f4db7f0f9a39a14269e"}'></script>
<!-- End Cloudflare Web Analytics -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f4ead6'/%3E%3Cpath d='M50 22 L78 68 A32 32 0 0 1 22 68 Z' fill='%23c22a2f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1c1712; --ink-soft:#2a231d; --ink-softer:#382f27;
    --paper:#f4ead6; --paper-dim:#e9dcbf;
    --sauce:#c22a2f; --sauce-deep:#821e21;
    --gold:#dc9f34; --basil:#4c6b3a;
    --line-on-ink: rgba(244,234,214,.16);
    --line-on-paper: rgba(28,23,18,.18);
    --ok:#4c8c5a; --warn:#dc9f34; --bad:#c22a2f;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:"Rye", Georgia, serif; font-weight:400; margin:0; line-height:1.1; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-on-ink); border-radius:4px; }

  /* ---------- role picker ---------- */
  #screen-role{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; gap:28px; text-align:center;
  }
  #screen-role .badge{ width:64px; height:64px; }
  #screen-role h1{ font-size:clamp(32px,6vw,48px); }
  #screen-role .sub{ color:var(--paper-dim); font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
  .role-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; max-width:900px; width:100%; }
  .role-card{
    background:var(--ink-soft); border:1.5px solid var(--line-on-ink); border-radius:8px;
    padding:26px 20px; color:var(--paper); text-align:left; transition:border-color .15s ease, transform .15s ease;
  }
  .role-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .role-card svg{ width:30px; height:30px; color:var(--gold); margin-bottom:14px; }
  .role-card .t{ font-family:"Rye",serif; font-size:22px; }
  .role-card .d{ font-size:12.5px; color:var(--paper-dim); margin-top:6px; line-height:1.4; }

  /* ---------- app shell ---------- */
  #app-shell{ min-height:100vh; display:flex; flex-direction:column; }
  #app-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; background:var(--ink-soft); border-bottom:1px solid var(--line-on-ink);
    position:sticky; top:0; z-index:40;
  }
  #app-header .brand{ display:flex; align-items:center; gap:10px; }
  #app-header .brand svg{ width:30px; height:30px; }
  #app-header .brand .name{ font-family:"Rye",serif; font-size:18px; }
  #app-header .role-tag{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  #app-header .right{ display:flex; align-items:center; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; border-radius:999px; padding:10px 18px; font-weight:700; font-size:13.5px; }
  .btn-sauce{ background:var(--sauce); color:var(--paper); }
  .btn-sauce:hover{ background:var(--sauce-deep); }
  .btn-outline{ background:transparent; color:var(--paper); border:1.5px solid var(--line-on-ink); }
  .btn-outline:hover{ border-color:var(--paper-dim); }
  .btn-ghost{ background:transparent; color:var(--paper-dim); border:none; font-size:12.5px; text-decoration:underline; padding:6px 4px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  main{ flex:1; min-height:0; }
  .view{ height:100%; }

  /* generic pieces reused across views */
  .pill{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; padding:8px 14px;
    border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); white-space:nowrap;
  }
  .pill[aria-pressed="true"]{ background:var(--sauce); border-color:var(--sauce); color:var(--paper); }
  .status-chip{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
  .status-new{ background:rgba(220,159,52,.18); color:var(--gold); }
  .status-preparing{ background:rgba(220,159,52,.28); color:var(--gold); }
  .status-ready{ background:rgba(76,140,90,.25); color:#7fc98f; }
  .status-out_for_delivery{ background:rgba(76,108,140,.25); color:#8fb8d9; }
  .status-completed{ background:rgba(244,234,214,.12); color:var(--paper-dim); }
  .status-cancelled{ background:rgba(194,42,47,.2); color:#e59a9c; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--paper); color:var(--ink); font-weight:700; font-size:14px; padding:12px 22px;
    border-radius:999px; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); transition:opacity .2s ease, transform .2s ease; z-index:100; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= CUSTOMER / POS shared ordering layout ================= */
  .order-layout{ display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 57px); }
  .order-menu-pane{ overflow-y:auto; padding:18px 20px 40px; background:var(--ink); }
  .order-cart-pane{ background:var(--ink-soft); border-left:1px solid var(--line-on-ink); display:flex; flex-direction:column; height:100%; }
  @media (max-width:860px){
    .order-layout{ grid-template-columns:1fr; height:auto; }
    #view-customer .order-cart-pane{
      border-left:none; border-top:none; position:fixed; left:0; right:0; bottom:0; top:auto;
      max-height:82vh; border-radius:16px 16px 0 0; box-shadow:0 -16px 40px -12px rgba(0,0,0,.65);
      transform:translateY(110%); transition:transform .3s ease; z-index:55;
    }
    #view-customer .order-cart-pane.is-open{ transform:translateY(0); }
    #view-customer .cart-drag-handle{
      display:block; width:40px; height:4px; border-radius:999px; background:var(--line-on-ink);
      margin:10px auto 0;
    }
    #view-customer .cart-close-btn{ display:inline-flex; align-items:center; justify-content:center; }
    .cart-backdrop{
      display:none; position:fixed; inset:0; background:rgba(13,9,6,.55); z-index:50;
    }
    .cart-backdrop.is-open{ display:block; }
  }

  .cart-btn{
    display:none; position:relative; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:999px; background:var(--ink); border:1px solid var(--line-on-ink);
    color:var(--paper); cursor:pointer; flex:none;
  }
  .cart-btn svg{ width:19px; height:19px; }
  .cart-btn-badge{
    position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px;
    border-radius:999px; background:var(--sauce); color:var(--paper); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-family:"Work Sans",sans-serif;
  }
  @media (max-width:860px){ .cart-btn{ display:inline-flex; } }

  /* ---- account modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(13,9,6,.72); z-index:300;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--ink); border:1px solid var(--line-on-ink); border-radius:14px;
    max-width:400px; width:100%; padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.5);
    color:var(--paper); max-height:88vh; overflow-y:auto;
  }
  .modal-card h3{ font-size:20px; margin:0 0 4px; }
  .modal-card p{ font-size:13px; color:var(--paper-dim); margin:0 0 16px; }
  .modal-card .field-group input{
    width:100%; background:var(--ink-soft); border:1.5px solid var(--line-on-ink); border-radius:8px;
    color:var(--paper); padding:10px 12px; font-size:14px; font-family:inherit;
  }
  .modal-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .modal-tabs button{
    flex:1; padding:9px; border-radius:8px; border:1.5px solid var(--line-on-ink);
    background:transparent; color:var(--paper-dim); font-weight:600; font-size:13px; cursor:pointer;
  }
  .modal-tabs button[aria-pressed="true"]{ background:var(--sauce); color:var(--paper); border-color:var(--sauce); }
  .modal-close{ float:right; background:none; border:none; color:var(--paper-dim); font-size:22px; cursor:pointer; line-height:1; }

  .menu-hero{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .menu-hero-photos{ display:flex; gap:6px; flex:none; }
  .menu-hero-photos img{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex:none; border:1px solid var(--line-on-ink); }
  .menu-hero .t{ font-weight:700; font-size:14px; color:var(--paper); }
  .menu-hero .d{ font-size:12px; color:var(--paper-dim); margin-top:2px; }
  @media (max-width:420px){ .menu-hero-photos img:nth-child(3){ display:none; } }

  .cat-bar{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:14px; position:sticky; top:0; background:var(--ink); z-index:5; }

  .today-banner{
    display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, rgba(220,159,52,.16), transparent);
    border:1px solid rgba(220,159,52,.4); border-radius:8px; padding:12px 16px; margin-bottom:16px; cursor:pointer;
  }
  .today-banner .t{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); }
  .today-banner .n{ font-family:"Rye",serif; font-size:17px; color:var(--paper); }
  .today-banner .p{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); }

  .menu-section{ margin-bottom:26px; }
  .menu-section-banner{
    width:100%; height:120px; object-fit:cover; border-radius:10px;
    margin-bottom:10px; border:1px solid var(--line-on-ink); display:block;
    background:var(--ink-soft);
  }
  .menu-section h3{ font-size:19px; color:var(--paper); border-bottom:2px solid var(--line-on-ink); padding-bottom:8px; margin-bottom:10px; display:flex; align-items:baseline; gap:10px; }
  .menu-section .note{ font-family:"Work Sans"; font-size:11.5px; font-style:italic; color:var(--gold); font-weight:500; }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .item-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; text-align:left; color:var(--paper);
  }
  .item-card:hover{ border-color:var(--gold); }
  .item-card .n{ font-weight:600; font-size:13.5px; }
  .item-card .s{ font-size:11px; color:var(--paper-dim); display:block; margin-top:2px; }
  .item-card .p{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); white-space:nowrap; }
  .item-card .plus{ width:26px; height:26px; border-radius:50%; background:var(--sauce); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }

  /* pizza builder */
  .builder{ background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:18px; }
  .size-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .size-opt{ flex:1; min-width:130px; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:8px; padding:10px 12px; text-align:left; color:var(--paper); }
  .size-opt[aria-pressed="true"]{ border-color:var(--sauce); background:rgba(194,42,47,.12); }
  .size-opt .n{ font-weight:700; font-size:13px; }
  .size-opt .p{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gold); margin-top:2px; }
  .topping-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .topping-chip{ font-size:12.5px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); }
  .topping-chip[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700; }
  .builder-total{ display:flex; align-items:center; justify-content:space-between; }

  /* cart */
  .cart-head{ padding:16px 18px; border-bottom:1px solid var(--line-on-ink); }
  .cart-head h3{ font-size:18px; }
  .cart-head--customer{ display:flex; align-items:center; gap:12px; }
  .cart-head--customer h3{ flex:1; }
  .cart-hero-thumb{ width:40px; height:40px; border-radius:8px; object-fit:cover; flex:none; border:1px solid var(--line-on-ink); }
  .cart-close-btn{
    display:none; background:none; border:none; color:var(--paper-dim);
    font-size:24px; line-height:1; cursor:pointer; padding:4px 6px; flex:none;
  }
  .cart-close-btn:hover{ color:var(--paper); }
  .cart-drag-handle{ display:none; }
  .cart-items{ flex:1; overflow-y:auto; padding:10px 18px; }
  .cart-line{ display:flex; gap:8px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line-on-ink); }
  .cart-line .n{ font-weight:600; font-size:13px; flex:1; }
  .cart-line .meta{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  .cart-line .qty{ display:flex; align-items:center; gap:6px; }
  .qty-btn{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line-on-ink); background:transparent; color:var(--paper); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .cart-line .p{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; white-space:nowrap; }
  .cart-empty{ text-align:center; color:var(--paper-dim); font-size:13px; padding:30px 10px; }
  .cart-foot{ padding:14px 18px 18px; border-top:1px solid var(--line-on-ink); }
  .row-between{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin:4px 0; }
  .row-between.total{ font-size:18px; font-weight:700; font-family:"IBM Plex Mono",monospace; margin-top:8px; }

  .field-group{ margin-top:10px; }
  .field-group label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--paper-dim); margin-bottom:5px; font-family:"IBM Plex Mono",monospace; }
  .field-group input, .field-group textarea{
    width:100%; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:6px; color:var(--paper);
    padding:9px 11px; font-size:13.5px;
  }
  .field-group input:focus, .field-group textarea:focus{ outline:none; border-color:var(--gold); }
  .seg{ display:flex; border:1.5px solid var(--line-on-ink); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; background:transparent; border:none; color:var(--paper-dim); padding:9px 8px; font-size:12.5px; font-weight:600; }
  .seg button[aria-pressed="true"]{ background:var(--sauce); color:var(--paper); }

  /* order confirmation */
  .confirm-wrap{ height:calc(100vh - 57px); display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; }
  .confirm-card{ max-width:420px; }
  .confirm-ticket{ font-family:"Rye",serif; font-size:56px; color:var(--gold); }

  /* ================= KITCHEN BOARD ================= */
  #view-kitchen{ padding:16px 20px; height:calc(100vh - 57px); overflow-y:auto; }
  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start; }
  @media (max-width:1000px){ .kanban{ grid-template-columns:1fr 1fr; } }
  .kanban-col{ background:var(--ink-soft); border-radius:10px; padding:12px; min-height:120px; }
  .kanban-col h4{ font-size:13px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.1em; color:var(--paper-dim); padding:4px 6px 10px; display:flex; justify-content:space-between; }
  .ticket{
    background:var(--paper); color:var(--ink); border-radius:8px; padding:12px 13px; margin-bottom:10px;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.5); border-left:5px solid var(--ok);
  }
  .ticket.age-warn{ border-left-color:var(--warn); }
  .ticket.age-bad{ border-left-color:var(--bad); }
  .ticket .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .ticket .num{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px; }
  .ticket .type{ font-size:10px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:rgba(28,23,18,.1); }
  .ticket .age{ font-size:11px; color:var(--sauce-deep); font-weight:700; margin-top:2px; }
  .ticket ul{ list-style:none; margin:8px 0; padding:0; font-size:12.5px; }
  .ticket li{ padding:2px 0; }
  .ticket .who{ font-size:11.5px; color:rgba(28,23,18,.65); margin-top:4px; }
  .ticket .advance{ width:100%; margin-top:10px; background:var(--ink); color:var(--paper); border:none; border-radius:6px; padding:9px; font-weight:700; font-size:12px; }
  .ticket .advance:hover{ background:var(--sauce); }
  .kanban-empty{ font-size:12px; color:var(--paper-dim); padding:10px 6px; }

  /* ================= DRIVER APP ================= */
  #view-driver{ max-width:520px; margin:0 auto; padding:16px 16px 60px; }
  .driver-setup{ text-align:center; padding:60px 20px; }
  .driver-card{
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:14px;
  }
  .driver-card .top{ display:flex; justify-content:space-between; align-items:center; }
  .driver-card .addr{ font-weight:700; font-size:15px; margin-top:8px; }
  .driver-card .sub{ font-size:12.5px; color:var(--paper-dim); margin-top:2px; }
  .driver-card .due{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); font-size:16px; margin-top:10px; }
  .driver-actions{ display:flex; gap:8px; margin-top:12px; }
  .driver-actions a, .driver-actions button{ flex:1; text-align:center; text-decoration:none; }
  .section-label{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; }
  .db-banner{ position:relative; background:var(--sauce); color:var(--paper); font-size:12.5px; font-weight:700; text-align:center; padding:8px 14px; z-index:200; }
  .db-banner a{ color:var(--paper); text-decoration:underline; }
</style>
</head>
<body>

<div class="db-banner" id="db-banner" hidden></div>

<div id="app-shell">
  <div id="app-header">
    <div class="brand">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#f4ead6"/><circle cx="50" cy="50" r="48" fill="none" stroke="#c22a2f" stroke-width="6"/><path d="M50 22 L78 68 A32 32 0 0 1 22 68 Z" fill="#c22a2f"/></svg>
      <div>
        <div class="name">Cifelli's</div>
        <div class="role-tag">Order Online</div>
      </div>
    </div>
    <div class="right" id="header-right">
      <button class="btn-ghost" id="accountBtn" type="button">Sign In</button>
      <button class="cart-btn" id="cartBtn" type="button" aria-label="View your order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-btn-badge" id="cartBtnBadge" hidden>0</span>
      </button>
      <button class="btn-ghost" id="installBtn" type="button" hidden>Install this app &darr;</button>
    </div>
  </div>
  <main>

<script>
/* =========================================================================
   UTILITIES
   ========================================================================= */
function money(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function newTicket(){ return 'T' + String(Date.now()).slice(-6); }
function newId(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));
  if (mins < 1) return 'just in';
  if (mins === 1) return '1 min';
  return mins + ' min';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function computeTotals(items, tip){
  const subtotal = items.reduce((s,it)=> s + it.unitPrice*it.qty, 0);
  const tax = subtotal * TAX_RATE;
  const tipAmt = tip || 0;
  return { subtotal, tax, tip: tipAmt, total: subtotal+tax+tipAmt };
}
function lineLabel(it){
  return it.name + (it.size ? ' (' + it.size + ')' : '');
}

/* =========================================================================
   STATE
   ========================================================================= */
const App = {
  role: null,
  db: null,
  dbReady: false,
  unsub: [],
  cart: [],
  driverName: null,
};

function showDbBanner(msg){
  const banner = document.getElementById('db-banner');
  if (!banner) return;
  if (!msg){ banner.hidden = true; banner.textContent = ''; return; }
  banner.hidden = false;
  banner.innerHTML = msg;
}

async function getDb(){
  if (App.db || App.dbReady) return App.db;
  App.dbReady = true;
  try{
    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if (!url || !key){
      showDbBanner('Not connected to a database yet. See supabase/README.md to finish setup (edit order/supabase-config.js).');
      App.db = null;
      return App.db;
    }
    if (typeof window.supabase === 'undefined' || typeof window.createSupabaseDb === 'undefined'){
      showDbBanner('Database scripts failed to load. Check your internet connection and reload.');
      App.db = null;
      return App.db;
    }
    const client = window.supabase.createClient(url, key);
    App.db = window.createSupabaseDb(client);
  }catch(e){
    showDbBanner('Could not connect to the database: ' + (e && e.message ? e.message : 'unknown error'));
    App.db = null;
  }
  return App.db;
}

function ordersCol(){
  return App.db ? App.db.collection('orders') : null;
}

/* Create an order document. Returns the ticket number, or null if the
   order could not be saved (caller must check for null and not proceed
   as though the order went through). */
async function submitOrder(order){
  const ticket = newTicket();
  const body = Object.assign({
    ticket,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    status: 'new',
    driver: null,
  }, order);
  const db = await getDb();
  if (!db){
    showToast('Offline: order not saved (no database connection)');
    return null;
  }
  try{
    await db.collection('orders').add(body);
  }catch(e){
    const code = e && e.code;
    const raw = e && e.message ? e.message : 'unknown error';
    console.error('Order save failed:', e);
    if (code === '42501' || /row-level security/i.test(raw)){
      showToast('Online ordering is temporarily down (setup issue on our end). Please call (856) 435-8799 to order, sorry about that.');
    } else {
      showToast('Could not save order: ' + raw + '. Please call (856) 435-8799 to order instead.');
    }
    return null;
  }
  return ticket;
}

async function updateOrder(docId, patch){
  const db = await getDb();
  if (!db) return;
  patch = Object.assign({ updatedAt: Date.now() }, patch);
  try{ await db.collection('orders').doc(docId).update(patch); }
  catch(e){ /* last-writer-wins; ignore transient errors */ }
}
</script>
<script>
/* =========================================================================
   BOOT
   ========================================================================= */
function stopAllSubscriptions(){
  App.unsub.forEach(fn => { try{ fn(); }catch(e){} });
  App.unsub = [];
}

/* Install prompt: Chrome/Edge/Android fire beforeinstallprompt; iOS Safari
   never does (there is no programmatic install there), so the button
   simply never appears on iOS and customers use Share > Add to Home
   Screen instead. */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').hidden = true;
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = true;
});
</script>

function addLine(line){
  const key = line.name+'|'+(line.size||'')+'|'+(line.notes||'');
  const existing = orderCtx.cart.find(l => l._key===key);
  if (existing){ existing.qty += line.qty||1; }
  else { orderCtx.cart.push(Object.assign({_key:key, qty:line.qty||1}, line)); }
  renderCart(orderCtx.mode);
}
function changeQty(key, delta){
  const l = orderCtx.cart.find(x=>x._key===key);
  if (!l) return;
  l.qty += delta;
  if (l.qty<=0) orderCtx.cart = orderCtx.cart.filter(x=>x._key!==key);
  renderCart(orderCtx.mode);
}

          <div id="addrinfo-${mode}" style="font-size:11.5px; color:var(--paper-dim); margin-top:6px; min-height:14px;"></div>
        </div>
      <div class="field-group"><label>Notes (optional)</label><input id="custnotes-${mode}" placeholder="Order notes"></div>
      <div class="field-group"><label>Tender</label>
        <div class="seg" id="paymethod-${mode}">
          <button type="button" data-v="cash" aria-pressed="true">Cash</button>
          <button type="button" data-v="card">Card</button>
        </div>
      </div>
      <div class="field-group" id="cashgroup-${mode}"><label>Cash Tendered</label><input id="tendered-${mode}" type="number" step="0.01" placeholder="0.00"></div>
      <div class="row-between" style="margin-top:10px;"><span>Subtotal</span><span class="mono" id="subtotal-${mode}"></span></div>
      <div class="row-between"><span>Tax</span><span class="mono" id="tax-${mode}"></span></div>
      <div class="row-between" id="tiprow-${mode}" hidden><span>Tip</span><span class="mono" id="tipamount-${mode}"></span></div>
      <div class="row-between total"><span>Total</span><span id="total-${mode}"></span></div>
      <div class="row-between" id="changerow-${mode}" style="color:var(--gold); font-weight:700;"></div>
      <button class="btn btn-sauce" id="submit-${mode}" type="button" style="width:100%; justify-content:center; margin-top:14px; padding:14px;">Ring Up Order</button>
    </div>`;
}

function wireCategoryBar(mode){
  const bar = document.getElementById(`catbar-${mode}`);
  bar.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bar.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      const cat = btn.getAttribute('data-cat');
      document.querySelectorAll(`#menupane-${mode} .menu-section`).forEach(sec=>{
        sec.hidden = !(cat==='all' || sec.getAttribute('data-section')===cat);
      });
    });
  });
}
function wireItemButtons(mode){
  document.querySelectorAll(`#menupane-${mode} [data-add-cat]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = CATEGORIES.find(c=>c.key===btn.getAttribute('data-add-cat'));
      const it = cat.items[+btn.getAttribute('data-add-idx')];
      addLine({ name: it.name, size: it.size||'', unitPrice: it.price, qty:1, notes:'' });
      showToast(it.name+' added');
    });
  });
}
function renderSpecialtyPizzas(mode){
  const el = document.getElementById(`specialty-${mode}`);
  let html='';
  SPECIALTY_PIZZAS.forEach((p,pi)=>{
    p.sizes.forEach((s,si)=>{
      html += `<button type="button" class="item-card" data-sp="${pi}" data-ss="${si}">
        <span><span class="n">${escapeHtml(p.name)}</span><span class="s">${escapeHtml(s.label)}</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span class="p">${money(s.price)}</span><span class="plus">+</span></span>
      </button>`;
    });
  });
  el.innerHTML = html;
}
function wireSpecialtyButtons(mode){
  document.querySelectorAll(`#specialty-${mode} [data-sp]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = SPECIALTY_PIZZAS[+btn.getAttribute('data-sp')];
      const s = p.sizes[+btn.getAttribute('data-ss')];
      addLine({ name:p.name, size:s.label, unitPrice:s.price, qty:1, notes:'' });
      showToast(p.name+' added');
    });
  });
}
function renderPizzaBuilder(mode){
  const sizeRow = document.getElementById(`sizerow-${mode}`);
  sizeRow.innerHTML = PIZZA_SIZES.map(s => `<button type="button" class="size-opt" data-size="${s.key}" aria-pressed="${orderCtx.pizzaSize===s.key}"><div class="n">${s.label}</div><div class="p">${money(s.base)} + ${money(s.perTopping)}/topping</div></button>`).join('');
  sizeRow.querySelectorAll('.size-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{ orderCtx.pizzaSize = btn.getAttribute('data-size'); renderPizzaBuilder(mode); });
  });
  const topRow = document.getElementById(`toppingrow-${mode}`);
  topRow.innerHTML = TOPPINGS.map(t => `<button type="button" class="topping-chip" data-t="${escapeHtml(t)}" aria-pressed="${orderCtx.pizzaToppings.has(t)}">${escapeHtml(t)}</button>`).join('');
  topRow.querySelectorAll('.topping-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.getAttribute('data-t');
      if (orderCtx.pizzaToppings.has(t)) orderCtx.pizzaToppings.delete(t); else orderCtx.pizzaToppings.add(t);
      renderPizzaBuilder(mode);
    });
  });
  const sizeObj = PIZZA_SIZES.find(s=>s.key===orderCtx.pizzaSize);
  const total = sizeObj.base + sizeObj.perTopping*orderCtx.pizzaToppings.size;
  document.getElementById(`buildertotal-${mode}`).textContent = money(total);
  document.getElementById(`addpizza-${mode}`).onclick = () => {
    const toppingsArr = Array.from(orderCtx.pizzaToppings);
    addLine({
      name: sizeObj.label.replace(/\s*\(.+\)$/,'') + ' Pizza',
      size: sizeObj.label,
      unitPrice: total,
      qty: 1,
      notes: toppingsArr.length ? toppingsArr.join(', ') : '',
    });
    orderCtx.pizzaToppings = new Set();
    renderPizzaBuilder(mode);
    showToast('Pizza added');
  };
}

function wireSeg(segId, stateKey, onChange){
  const seg = document.getElementById(segId);
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      orderCtx[stateKey] = btn.getAttribute('data-v');
      if (onChange) onChange(orderCtx[stateKey]);
    });
  });
}

function updateChangeDue(mode, total){
  const row = document.getElementById(`changerow-${mode}`);
  if (!row) return;
  if (orderCtx.payMethod!=='cash'){ row.innerHTML=''; return; }
  const tenderedInput = document.getElementById(`tendered-${mode}`);
  const tendered = tenderedInput ? parseFloat(tenderedInput.value||'0') : 0;
  if (!tendered){ row.innerHTML = ''; return; }
  row.innerHTML = `<span>Change Due</span><span class="mono">${money(Math.max(0,tendered-total))}</span>`;
}

function renderCart(mode){
  if (!mode) return;
  const wrap = document.getElementById(`cartitems-${mode}`);
  if (!wrap) return;
  if (!orderCtx.cart.length){
    wrap.innerHTML = `<div class="cart-empty">Nothing in the order yet.<br>Tap items on the left to add them.</div>`;
  } else {
    wrap.innerHTML = orderCtx.cart.map(l => `
      <div class="cart-line">
        <div style="flex:1;">
          <div class="n">${escapeHtml(lineLabel(l))}</div>
          ${l.notes ? `<div class="meta">${escapeHtml(l.notes)}</div>` : ''}
          <div class="qty" style="margin-top:6px;">
            <button type="button" class="qty-btn" data-key="${escapeHtml(l._key)}" data-d="-1">&minus;</button>
            <span class="mono">${l.qty}</span>
            <button type="button" class="qty-btn" data-key="${escapeHtml(l._key)}" data-d="1">+</button>
          </div>
        </div>
        <div class="p">${money(l.unitPrice*l.qty)}</div>
      </div>`).join('');
    wrap.querySelectorAll('.qty-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> changeQty(btn.getAttribute('data-key'), +btn.getAttribute('data-d')));
    });
  }
  if (orderCtx.tipPct != null){
    const rawSubtotal = orderCtx.cart.reduce((s,it)=> s + it.unitPrice*it.qty, 0);
    orderCtx.tip = Math.round(rawSubtotal * orderCtx.tipPct * 100) / 100;
  }
  const totals = computeTotals(orderCtx.cart, orderCtx.tip);
  document.getElementById(`subtotal-${mode}`).textContent = money(totals.subtotal);
  document.getElementById(`tax-${mode}`).textContent = money(totals.tax);
  const tipRow = document.getElementById(`tiprow-${mode}`);
  const tipAmountEl = document.getElementById(`tipamount-${mode}`);
  if (tipRow && tipAmountEl){
    tipRow.hidden = totals.tip <= 0;
    tipAmountEl.textContent = money(totals.tip);
  }
  document.getElementById(`total-${mode}`).textContent = money(totals.total);
  if (mode==='pos') updateChangeDue(mode, totals.total);
  const submitBtn = document.getElementById(`submit-${mode}`);
  if (submitBtn) submitBtn.disabled = orderCtx.cart.length===0;
  if (mode==='customer') updateCartButtonBadge();
}

function updateCartButtonBadge(){
  const badge = document.getElementById('cartBtnBadge');
  if (!badge) return;
  const count = orderCtx.cart.reduce((n,l)=>n+l.qty, 0);
  if (count>0){ badge.hidden = false; badge.textContent = count; }
  else { badge.hidden = true; }
}

function openMobileCart(){
  const pane = document.getElementById('cartpane-customer');
  const backdrop = document.getElementById('cartBackdrop');
  if (pane) pane.classList.add('is-open');
  if (backdrop) backdrop.classList.add('is-open');
  document.body.style.overflow = 'hidden';
}

function closeMobileCart(){
  const pane = document.getElementById('cartpane-customer');
  const backdrop = document.getElementById('cartBackdrop');
  if (pane) pane.classList.remove('is-open');
  if (backdrop) backdrop.classList.remove('is-open');
  document.body.style.overflow = '';
}

function wireMobileCart(mode){
  if (mode !== 'customer') return;
  const cartBtn = document.getElementById('cartBtn');
  const closeBtn = document.getElementById(`cartclose-${mode}`);
  const backdrop = document.getElementById('cartBackdrop');
  if (cartBtn) cartBtn.onclick = openMobileCart;
  if (closeBtn) closeBtn.onclick = closeMobileCart;
  if (backdrop) backdrop.onclick = closeMobileCart;
}
</script>

<script>
/* =========================================================================
   CUSTOMER KIOSK + STAFF POS: view setup and submit
   ========================================================================= */
function renderOrderLayout(mode){
  const view = document.getElementById(mode==='customer' ? 'view-customer' : 'view-pos');
  view.innerHTML = `
    <div class="order-layout">
      <div class="order-menu-pane" id="menupane-${mode}"></div>
      <div class="order-cart-pane" id="cartpane-${mode}"></div>
    </div>`;
  document.getElementById(`menupane-${mode}`).innerHTML = buildMenuPaneHTML(mode);
  document.getElementById(`cartpane-${mode}`).innerHTML = buildCartPaneHTML(mode);
  wireCategoryBar(mode);
  wireItemButtons(mode);
  wireMobileCart(mode);
  renderSpecialtyPizzas(mode);
  wireSpecialtyButtons(mode);
  renderPizzaBuilder(mode);
  wireSeg(`ordertype-${mode}`, 'orderType', (v) => {
    const addrGroup = document.getElementById(`addrgroup-${mode}`);
    if (addrGroup) addrGroup.hidden = (v !== 'delivery');
    const tipLabel = document.getElementById(`tiplabel-${mode}`);
    if (tipLabel) tipLabel.textContent = v === 'delivery' ? 'Add a Tip for Your Driver' : 'Add a Tip for the Counter';
    if (v === 'delivery' && mode === 'customer'){
      const addrInputEl = document.getElementById(`custaddr-${mode}`);
      const saved = CustomerAccount.profile && CustomerAccount.profile.preferences && CustomerAccount.profile.preferences.savedAddress;
      if (addrInputEl && saved && !addrInputEl.value){
        addrInputEl.value = saved;
        addrInputEl.dispatchEvent(new Event('input'));
      }
    }
  });
  const addrInput = document.getElementById(`custaddr-${mode}`);
  const addrInfo = document.getElementById(`addrinfo-${mode}`);
  if (addrInput && addrInfo && typeof wireDeliveryLookup === 'function'){
    wireDeliveryLookup(addrInput, addrInfo, (result) => {
      orderCtx.deliveryInfo = result;
    });
  }
  if (mode === 'customer'){
    const tipSeg = document.getElementById(`tipseg-${mode}`);
    const tipCustom = document.getElementById(`tipcustom-${mode}`);
    if (tipSeg){
      tipSeg.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', () => {
          tipSeg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
          btn.setAttribute('aria-pressed','true');
          const v = btn.getAttribute('data-v');
          if (v === 'custom'){
            tipCustom.hidden = false;
            tipCustom.focus();
            const subtotal = computeTotals(orderCtx.cart, 0).subtotal;
            orderCtx.tip = Number(tipCustom.value) || 0;
            orderCtx.tipPct = null;
          } else {
            tipCustom.hidden = true;
            const subtotal = computeTotals(orderCtx.cart, 0).subtotal;
            orderCtx.tipPct = Number(v);
            orderCtx.tip = Math.round(subtotal * Number(v) * 100) / 100;
          }
          renderCart(mode);
        });
      });
    }
    if (tipCustom){
      tipCustom.addEventListener('input', () => {
        orderCtx.tip = Number(tipCustom.value) || 0;
        orderCtx.tipPct = null;
        renderCart(mode);
      });
    }
  }
  wireSeg(`paymethod-${mode}`, 'payMethod', () => {
    if (mode === 'pos'){
      const cashGroup = document.getElementById(`cashgroup-${mode}`);
      if (cashGroup) cashGroup.hidden = (orderCtx.payMethod !== 'cash');
      renderCart(mode);
    }
  });
  if (mode === 'pos'){
    const tenderedInput = document.getElementById(`tendered-${mode}`);
    if (tenderedInput) tenderedInput.addEventListener('input', () => renderCart(mode));
    const queueBtn = document.getElementById(`viewqueue-${mode}`);
    if (queueBtn) queueBtn.addEventListener('click', () => renderPosQueue());
  }
  const banner = document.getElementById(`todaybanner-${mode}`);
  if (banner){
    banner.addEventListener('click', () => {
      const today = SPECIALS_BY_DAY[new Date().getDay()];
      addLine({ name: today.name, size:'', unitPrice: today.price, qty:1, notes:'Daily special' });
      showToast(today.name + ' added');
    });
  }
  const submitBtn = document.getElementById(`submit-${mode}`);
  submitBtn.addEventListener('click', () => mode === 'customer' ? submitCustomerOrder() : submitPosOrder());
  renderCart(mode);
}

function initCustomerView(){
  stopAllSubscriptions();
  resetOrderCtx('customer');
  orderCtx.orderType = 'pickup';
  renderOrderLayout('customer');
}

async function submitCustomerOrder(){
  const name = document.getElementById('custname-customer').value.trim();
  const phone = document.getElementById('custphone-customer').value.trim();
  const smsOptInEl = document.getElementById('smsoptin-customer');
  const phoneOptIn = smsOptInEl ? smsOptInEl.checked : false;
  const addrField = document.getElementById('custaddr-customer');
  const addr = addrField ? addrField.value.trim() : '';
  const notes = document.getElementById('custnotes-customer').value.trim();
  if (!orderCtx.cart.length){ showToast('Your order is empty'); return; }
  if (!name || !phone){ showToast('Please add your name and phone number'); return; }
  if (orderCtx.orderType === 'delivery' && !addr){ showToast('Please add a delivery address'); return; }
  const totals = computeTotals(orderCtx.cart, orderCtx.tip);
  const submitBtn = document.getElementById('submit-customer');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Placing order...';
  const di = orderCtx.deliveryInfo;
  const orderPayload = {
    source: 'customer',
    customerName: name,
    phone,
    address: orderCtx.orderType === 'delivery' ? addr : '',
    notes,
    orderType: orderCtx.orderType,
    payMethod: orderCtx.payMethod,
    items: orderCtx.cart.map(l => ({ name:l.name, size:l.size||'', unitPrice:l.unitPrice, qty:l.qty, notes:l.notes||'' })),
    subtotal: totals.subtotal, tax: totals.tax, tip: totals.tip, total: totals.total,
    deliveryMiles: (orderCtx.orderType === 'delivery' && di && di.miles != null) ? di.miles : null,
    deliveryEtaMins: (orderCtx.orderType === 'delivery' && di && di.minutes != null) ? di.minutes : null,
    phoneOptIn,
  };
  const ticket = await submitOrder(orderPayload);
  if (!ticket){
    submitBtn.disabled = false;
    submitBtn.textContent = 'Place Order';
    return;
  }
  showOrderConfirmation(ticket, orderPayload);
}

function buildReceiptHTML(ticket, order){
  const itemRows = (order.items || []).map(it => `
    <tr>
      <td>${it.qty}&times; ${escapeHtml(it.name)}${it.size ? ' (' + escapeHtml(it.size) + ')' : ''}${it.notes ? `<div class="note">${escapeHtml(it.notes)}</div>` : ''}</td>
      <td class="amt">${money(it.unitPrice * it.qty)}</td>
    </tr>`).join('');
  const deliveryLine = (order.orderType === 'delivery' && order.deliveryMiles != null)
    ? `<div class="meta">~${order.deliveryMiles} mi &middot; about ${order.deliveryEtaMins} min drive</div>` : '';
  return `<!doctype html>
<html><head><meta charset="utf-8"><title>Receipt ${escapeHtml(ticket)}</title>
<style>
  * { box-sizing:border-box; }
  body{ font-family:"Courier New", monospace; max-width:340px; margin:24px auto; color:#111; font-size:13px; }
  h1{ font-size:16px; text-align:center; margin:0 0 2px; }
  .center{ text-align:center; }
  .meta{ font-size:11.5px; color:#555; }
  hr{ border:none; border-top:1px dashed #999; margin:10px 0; }
  table{ width:100%; border-collapse:collapse; }
  td{ padding:3px 0; vertical-align:top; }
  td.amt{ text-align:right; white-space:nowrap; }
  .note{ font-size:11px; color:#555; }
  .totals td{ padding:2px 0; }
  .grand td{ font-weight:bold; font-size:14px; padding-top:6px; border-top:1px solid #111; }
  .foot{ text-align:center; margin-top:16px; font-size:11.5px; color:#555; }
  .printbtn{ display:block; width:100%; margin:18px 0 0; padding:10px; font-size:14px; cursor:pointer; }
  @media print{ .printbtn{ display:none; } body{ margin:0 auto; } }
</style></head>
<body>
  <h1>Cifelli's Pizza</h1>
  <div class="center meta">700 Chews Landing Rd, Lindenwold, NJ 08021<br>(856) 435-8799</div>
  <hr>
  <div><strong>Ticket:</strong> ${escapeHtml(ticket)}</div>
  <div class="meta">${new Date(order.createdAt || Date.now()).toLocaleString()}</div>
  <div class="meta">${escapeHtml(order.orderType || '')}${order.orderType === 'delivery' ? ' &middot; ' + escapeHtml(order.address || '') : ''}</div>
  ${deliveryLine}
  <div class="meta">${escapeHtml(order.customerName || '')}${order.phone ? ' &middot; ' + escapeHtml(order.phone) : ''}</div>
  <hr>
  <table>${itemRows}</table>
  <hr>
  <table class="totals">
    <tr><td>Subtotal</td><td class="amt">${money(order.subtotal)}</td></tr>
    <tr><td>Tax</td><td class="amt">${money(order.tax)}</td></tr>
    ${order.tip ? `<tr><td>Tip</td><td class="amt">${money(order.tip)}</td></tr>` : ''}
    <tr class="grand"><td>Total</td><td class="amt">${money(order.total)}</td></tr>
  </table>
  ${order.notes ? `<hr><div class="meta">Notes: ${escapeHtml(order.notes)}</div>` : ''}
  <div class="foot">Thank you for your order!<br>Pay in person at pickup or delivery.</div>
  <button class="printbtn" onclick="window.print()">Print / Save as PDF</button>
</body></html>`;
}

function openReceipt(ticket, order){
  const win = window.open('', '_blank', 'width=420,height=640');
  if (!win){ showToast('Please allow pop-ups to view the receipt'); return; }
  win.document.write(buildReceiptHTML(ticket, order));
  win.document.close();
}

function showOrderConfirmation(ticket, order){
  const view = document.getElementById('view-customer');
  const itemsHtml = (order.items || []).map(it => `
    <div class="row-between" style="font-size:13.5px;">
      <span>${it.qty}&times; ${escapeHtml(it.name)}${it.size ? ` (${escapeHtml(it.size)})` : ''}</span>
      <span class="mono">${money(it.unitPrice * it.qty)}</span>
    </div>`).join('');
  const deliveryHtml = (order.orderType === 'delivery')
    ? `<div style="margin-top:14px; padding:12px; background:var(--ink-soft); border-radius:8px; font-size:13px;">
         <div style="color:var(--paper-dim); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:4px;">Delivering to</div>
         <div>${escapeHtml(order.address || '')}</div>
         ${order.deliveryMiles != null ? `<div style="color:var(--paper-dim); margin-top:4px;">~${order.deliveryMiles} mi &middot; about ${order.deliveryEtaMins} min drive once it's out</div>` : ''}
       </div>`
    : '';
  view.innerHTML = `
    <div class="confirm-wrap">
      <div class="confirm-card">
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold);">Order Placed</div>
        <div class="confirm-ticket">${escapeHtml(ticket)}</div>
        <div style="font-size:15px; color:var(--paper-dim); margin-top:6px;">Total due: <span class="mono" style="color:var(--paper); font-weight:700;">${money(order.total)}</span></div>
        ${deliveryHtml}
        <div style="text-align:left; margin-top:18px; border-top:1px solid var(--line-on-ink); padding-top:14px;">
          ${itemsHtml}
          <div class="row-between" style="margin-top:10px; font-size:13px; color:var(--paper-dim);"><span>Subtotal</span><span class="mono">${money(order.subtotal)}</span></div>
          <div class="row-between" style="font-size:13px; color:var(--paper-dim);"><span>Tax</span><span class="mono">${money(order.tax)}</span></div>
          ${order.tip ? `<div class="row-between" style="font-size:13px; color:var(--paper-dim);"><span>Tip</span><span class="mono">${money(order.tip)}</span></div>` : ''}
          <div class="row-between total" style="margin-top:6px;"><span>Total</span><span>${money(order.total)}</span></div>
        </div>
        <div style="font-size:13px; color:var(--paper-dim); margin-top:16px; line-height:1.5;">Thank you. Your ticket number is on the screen above. Pay in person when your order is ready or delivered.${order.orderType === 'delivery' ? ` Once it arrives, you can <a href="rate.html?ticket=${encodeURIComponent(ticket)}&phone=${encodeURIComponent(order.phone||'')}" style="color:var(--gold);">rate your driver here</a>.` : ''}</div>
        <button class="btn btn-outline" style="margin-top:18px; width:100%; justify-content:center;" id="receiptBtn" type="button">View / Print Receipt</button>
        <button class="btn btn-sauce" style="margin-top:10px; width:100%; justify-content:center;" id="newOrderBtn" type="button">Start a New Order</button>
      </div>
    </div>`;
  document.getElementById('newOrderBtn').addEventListener('click', initCustomerView);
  document.getElementById('receiptBtn').addEventListener('click', () => openReceipt(ticket, order));
}

</script>

<script>
/* =========================================================================
   CUSTOMER ACCOUNTS (optional — ordering never requires one)
   ========================================================================= */
const CustomerAccount = { user: null, profile: null };

function closeAccountModal(){
  const el = document.getElementById('accountModalBackdrop');
  if (el) el.remove();
}

function showAccountModal(){
  closeAccountModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'accountModalBackdrop';
  backdrop.innerHTML = `
    <div class="modal-card">
      <button class="modal-close" id="accountModalClose" aria-label="Close">&times;</button>
      <h3>Your Account</h3>
      <p>Optional — you can always order without one. Creating an account saves your order history and details for next time.</p>
      <div class="modal-tabs">
        <button type="button" data-tab="signin" aria-pressed="true">Sign In</button>
        <button type="button" data-tab="signup" aria-pressed="false">Create Account</button>
      </div>
      <div id="accountTabBody"></div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeAccountModal(); });
  document.getElementById('accountModalClose').addEventListener('click', closeAccountModal);
  const tabs = backdrop.querySelectorAll('.modal-tabs button');
  tabs.forEach(btn => btn.addEventListener('click', () => {
    tabs.forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    renderAccountTab(btn.getAttribute('data-tab'));
  }));
  renderAccountTab('signin');
}

function renderAccountTab(tab){
  const body = document.getElementById('accountTabBody');
  if (!body) return;
  if (tab === 'signup'){
    body.innerHTML = `
      <div class="field-group"><label>Name</label><input id="acc-name" placeholder="Your name"></div>
      <div class="field-group"><label>Phone</label><input id="acc-phone" placeholder="(856) 555-0100"></div>
      <div class="field-group"><label>Email</label><input id="acc-email" type="email" placeholder="you@example.com"></div>
      <div class="field-group"><label>Password</label><input id="acc-password" type="password" placeholder="At least 6 characters"></div>
      <button class="btn btn-sauce" id="acc-submit" style="width:100%; justify-content:center; margin-top:6px;" type="button">Create Account</button>
      <div style="font-size:11.5px; color:var(--paper-dim); margin-top:10px; line-height:1.5;">Any past orders placed with this phone number will show up in your order history automatically.</div>`;
    document.getElementById('acc-submit').addEventListener('click', async () => {
      const name = document.getElementById('acc-name').value.trim();
      const phone = document.getElementById('acc-phone').value.trim();
      const email = document.getElementById('acc-email').value.trim();
      const password = document.getElementById('acc-password').value;
      if (!name || !phone || !email || password.length < 6){
        showToast('Please fill in every field (password needs 6+ characters)');
        return;
      }
      const db = await getDb();
      if (!db || !db.auth){ showToast('Accounts are not connected right now'); return; }
      const { data, error } = await db.auth.signUp({
        email, password,
        options: { emailRedirectTo: location.href.split('?')[0].split('#')[0] },
      });
      if (error){ showToast(error.message); return; }
      if (data && data.session){
        // Confirmations are off on this project (or already confirmed) —
        // there's a session immediately, so the profile write below can
        // run right now.
        if (data.user){
          try{ await db.collection('customers').doc(data.user.id).set({ phone, name, email }); }
          catch(e){ console.error('Could not save profile:', e); }
        }
        showToast('Account created — you\'re signed in');
        closeAccountModal();
        await refreshAccountState();
      } else {
        // No session yet: this Supabase project requires email
        // confirmation, so signUp() only creates the login — it can't
        // write to the customers table yet (that needs an
        // authenticated request). Stash the profile fields and finish
        // the write automatically once the confirmation link is
        // clicked and refreshAccountState() sees a real session (see
        // its pending-profile check below).
        try{ localStorage.setItem('cifellisPendingSignup', JSON.stringify({ email, name, phone })); }catch(e){}
        const body = document.getElementById('accountTabBody');
        if (body){
          body.innerHTML = `<p style="font-size:13.5px; line-height:1.5;">Almost there — check <strong>${escapeHtml(email)}</strong> for a confirmation email, then come back and sign in.</p>`;
        }
      }
    });
  } else {
    body.innerHTML = `
      <div class="field-group"><label>Email</label><input id="acc-email" type="email" placeholder="you@example.com"></div>
      <div class="field-group"><label>Password</label><input id="acc-password" type="password" placeholder="Your password"></div>
      <button class="btn btn-sauce" id="acc-submit" style="width:100%; justify-content:center; margin-top:6px;" type="button">Sign In</button>`;
    document.getElementById('acc-submit').addEventListener('click', async () => {
      const email = document.getElementById('acc-email').value.trim();
      const password = document.getElementById('acc-password').value;
      const db = await getDb();
      if (!db || !db.auth){ showToast('Accounts are not connected right now'); return; }
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error){ showToast(error.message); return; }
      showToast('Signed in');
      closeAccountModal();
      await refreshAccountState();
    });
  }
}

async function refreshAccountState(){
  const db = await getDb();
  const btn = document.getElementById('accountBtn');
  if (!db || !db.auth){ if (btn) btn.hidden = true; return; }
  const { data } = await db.auth.getSession();
  const user = data && data.session && data.session.user;
  CustomerAccount.user = user || null;
  if (!user){
    CustomerAccount.profile = null;
    if (btn){ btn.hidden = false; btn.textContent = 'Sign In'; btn.onclick = showAccountModal; }
    return;
  }
  let profileDoc = await db.collection('customers').doc(user.id).get();
  if (!profileDoc.data()){
    // First time we've seen this account with a session: if this is
    // right after confirming a signup, the customers row never got
    // created back in the signup handler (no session existed yet at
    // that point). Create it now, using whatever we stashed at signup
    // time if it's still there and matches this account, otherwise a
    // minimal profile the customer can fill in from Account > Preferences.
    let pending = null;
    try{ pending = JSON.parse(localStorage.getItem('cifellisPendingSignup') || 'null'); }catch(e){}
    const profileData = (pending && pending.email === user.email)
      ? { phone: pending.phone || '', name: pending.name || '', email: user.email || '' }
      : { phone: '', name: '', email: user.email || '' };
    try{
      await db.collection('customers').doc(user.id).set(profileData);
      try{ localStorage.removeItem('cifellisPendingSignup'); }catch(e){}
      profileDoc = await db.collection('customers').doc(user.id).get();
    }catch(e){ console.error('Could not create profile:', e); }
  }
  CustomerAccount.profile = profileDoc.data() || null;
  if (btn){
    btn.hidden = false;
    btn.textContent = (CustomerAccount.profile && CustomerAccount.profile.name) ? CustomerAccount.profile.name.split(' ')[0] : 'Account';
    btn.onclick = showAccountPanel;
  }
  // Prefill the current order form, if it's on screen, as a convenience.
  if (CustomerAccount.profile){
    const nameEl = document.getElementById('custname-customer');
    const phoneEl = document.getElementById('custphone-customer');
    if (nameEl && !nameEl.value) nameEl.value = CustomerAccount.profile.name || '';
    if (phoneEl && !phoneEl.value) phoneEl.value = CustomerAccount.profile.phone || '';
  }
}

async function showAccountPanel(){
  const db = await getDb();
  const view = document.getElementById('view-account');
  const customerView = document.getElementById('view-customer');
  customerView.hidden = true;
  view.hidden = false;
  const prefs = (CustomerAccount.profile && CustomerAccount.profile.preferences) || {};
  view.innerHTML = `<div style="max-width:560px; margin:0 auto; padding:24px 20px;">
    <button class="btn-ghost" id="acc-back" type="button">&larr; Back to Menu</button>
    <h2 style="font-size:26px; margin:14px 0 4px;">${escapeHtml((CustomerAccount.profile && CustomerAccount.profile.name) || 'Your Account')}</h2>
    <div style="color:var(--paper-dim); font-size:13px; margin-bottom:20px;">${escapeHtml((CustomerAccount.profile && CustomerAccount.profile.phone) || '')}</div>

    <h3 style="font-size:16px; margin-bottom:10px;">Preferences</h3>
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:14px; margin-bottom:22px;">
      <div class="field-group"><label>Default Delivery Address</label><input id="pref-address" placeholder="Street, Lindenwold NJ" value="${escapeHtml(prefs.savedAddress||'')}"></div>
      <div class="field-group"><label>Allergies / Notes</label><input id="pref-notes" placeholder="e.g. no nuts, extra sauce" value="${escapeHtml(prefs.notes||'')}"></div>
      <div class="field-group" style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
        <input type="checkbox" id="pref-smsopt" style="width:auto;" ${prefs.smsOptIn ? 'checked' : ''}>
        <label for="pref-smsopt" style="margin:0; text-transform:none; font-size:13px; letter-spacing:normal;">Text me order updates by default</label>
      </div>
      <button class="btn btn-outline" id="pref-save" style="margin-top:12px;" type="button">Save Preferences</button>
    </div>

    <h3 style="font-size:16px; margin-bottom:10px;">Order History</h3>
    <div id="acc-orders">Loading...</div>
    <button class="btn-ghost" id="acc-signout" style="margin-top:24px;" type="button">Sign Out</button>
  </div>`;
  document.getElementById('acc-back').addEventListener('click', () => { view.hidden = true; customerView.hidden = false; });
  document.getElementById('acc-signout').addEventListener('click', async () => {
    if (db && db.auth) await db.auth.signOut();
    view.hidden = true;
    customerView.hidden = false;
    await refreshAccountState();
    showToast('Signed out');
  });
  document.getElementById('pref-save').addEventListener('click', async () => {
    if (!db || !CustomerAccount.user) return;
    const newPrefs = {
      savedAddress: document.getElementById('pref-address').value.trim(),
      notes: document.getElementById('pref-notes').value.trim(),
      smsOptIn: document.getElementById('pref-smsopt').checked,
    };
    await db.collection('customers').doc(CustomerAccount.user.id).update({ preferences: newPrefs });
    if (CustomerAccount.profile) CustomerAccount.profile.preferences = newPrefs;
    showToast('Preferences saved');
  });
  const ordersEl = document.getElementById('acc-orders');
  if (!db){ ordersEl.textContent = 'Not connected to the database.'; return; }
  try{
    const unsub = db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => d.data());
      ordersEl.innerHTML = docs.length ? docs.slice(0, 25).map(o => `
        <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; margin-bottom:8px;">
          <div class="row-between"><span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span><span class="mono">${money(o.total||0)}</span></div>
          <div style="font-size:12px; color:var(--paper-dim); margin-top:4px;">${new Date(o.createdAt||0).toLocaleDateString()} &middot; ${escapeHtml(o.orderType||'')} &middot; ${escapeHtml(o.status||'')}</div>
          ${(o.items||[]).length ? `<div style="font-size:11.5px; color:var(--paper-dim); margin-top:4px;">${o.items.map(it=>`${it.qty}&times; ${escapeHtml(it.name)}`).join(', ')}</div>` : ''}
          <button class="btn-ghost" style="padding:4px 0; font-size:12px;" data-reorder='${JSON.stringify(o.items||[]).replace(/'/g,'&#39;')}'>Reorder these items</button>
        </div>`).join('') : '<div class="cart-empty">No past orders on file for this account yet.</div>';
      ordersEl.querySelectorAll('[data-reorder]').forEach(btn => {
        btn.addEventListener('click', () => {
          let items = [];
          try{ items = JSON.parse(btn.getAttribute('data-reorder')); }catch(e){}
          items.forEach(it => addLine({ name:it.name, size:it.size||'', unitPrice:it.unitPrice, qty:it.qty||1, notes:it.notes||'' }));
          view.hidden = true;
          customerView.hidden = false;
          showToast(items.length + ' item(s) added to your cart');
        });
      });
    }, () => { ordersEl.textContent = 'Could not load order history.'; });
    // One-shot: this is a summary view, not a live queue — release the
    // subscription once rendered instead of leaving it running.
    setTimeout(unsub, 3000);
  }catch(e){
    ordersEl.textContent = 'Could not load order history.';
  }
}
</script>

<script>
(async function boot(){
  await getDb();
  initCustomerView();
  await refreshAccountState();
})();
</script>

<script>
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
