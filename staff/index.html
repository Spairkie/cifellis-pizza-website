<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff Hub | Cifelli's Pizza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Staff-only: POS, kitchen board and driver app for Cifelli's Pizza. Sign-in required.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Staff Hub">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f4ead6'/%3E%3Cpath d='M50 22 L78 68 A32 32 0 0 1 22 68 Z' fill='%23c22a2f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../order/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1c1712; --ink-soft:#2a231d; --ink-softer:#382f27;
    --paper:#f4ead6; --paper-dim:#e9dcbf;
    --sauce:#c22a2f; --sauce-deep:#821e21;
    --gold:#dc9f34; --basil:#4c6b3a;
    --line-on-ink: rgba(244,234,214,.16);
    --line-on-paper: rgba(28,23,18,.18);
    --ok:#4c8c5a; --warn:#dc9f34; --bad:#c22a2f;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:"Rye", Georgia, serif; font-weight:400; margin:0; line-height:1.1; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-on-ink); border-radius:4px; }

  /* ---------- role picker ---------- */
  #screen-role, #screen-login{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; gap:28px; text-align:center;
  }
  #screen-role .badge, #screen-login .badge{ width:64px; height:64px; }
  #screen-role h1, #screen-login h1{ font-size:clamp(32px,6vw,48px); }
  #screen-role .sub, #screen-login .sub{ color:var(--paper-dim); font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
  #screen-login .field-group{ text-align:left; }
  .role-sections{ display:flex; flex-direction:column; gap:26px; max-width:900px; width:100%; }
  .role-section-label{ font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--paper-dim); margin-bottom:12px; text-align:left; }
  .role-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; width:100%; }
  .role-card{
    background:var(--ink-soft); border:1.5px solid var(--line-on-ink); border-radius:8px;
    padding:26px 20px; color:var(--paper); text-align:left; transition:border-color .15s ease, transform .15s ease;
  }
  .role-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .role-card svg{ width:30px; height:30px; color:var(--gold); margin-bottom:14px; }
  .role-card .t{ font-family:"Rye",serif; font-size:22px; }
  .role-card .d{ font-size:12.5px; color:var(--paper-dim); margin-top:6px; line-height:1.4; }

  /* ---------- app shell ---------- */
  #app-shell{ min-height:100vh; display:flex; flex-direction:column; }
  #app-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; background:var(--ink-soft); border-bottom:1px solid var(--line-on-ink);
    position:sticky; top:0; z-index:40;
  }
  #app-header .brand{ display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; border-radius:8px; }
  #app-header .brand:hover{ opacity:.85; }
  #app-header .brand:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  #app-header .brand svg{ width:30px; height:30px; }
  #app-header .brand .name{ font-family:"Rye",serif; font-size:18px; }
  #app-header .role-tag{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  #app-header .right{ display:flex; align-items:center; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; border-radius:999px; padding:10px 18px; font-weight:700; font-size:13.5px; }
  .btn-sauce{ background:var(--sauce); color:var(--paper); }
  .btn-sauce:hover{ background:var(--sauce-deep); }
  .btn-outline{ background:transparent; color:var(--paper); border:1.5px solid var(--line-on-ink); }
  .btn-outline:hover{ border-color:var(--paper-dim); }
  .btn-ghost{ background:transparent; color:var(--paper-dim); border:none; font-size:12.5px; text-decoration:underline; padding:6px 4px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  main{ flex:1; min-height:0; }
  .view{ height:100%; }

  /* generic pieces reused across views */
  .pill{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; padding:8px 14px;
    border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); white-space:nowrap;
  }
  .pill[aria-pressed="true"]{ background:var(--sauce); border-color:var(--sauce); color:var(--paper); }
  .status-chip{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }

  /* ---- generic confirm modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(13,9,6,.72); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:12px;
    max-width:380px; width:100%; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .modal-card h3{ font-size:18px; margin:0 0 8px; color:var(--paper); }
  .modal-card p{ font-size:13.5px; color:var(--paper-dim); line-height:1.5; margin:0 0 14px; }
  .modal-card textarea, .modal-card input{
    width:100%; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:8px;
    color:var(--paper); padding:10px 12px; font-size:13.5px; font-family:inherit; margin-bottom:14px;
  }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .status-new{ background:rgba(220,159,52,.18); color:var(--gold); }
  .status-preparing{ background:rgba(220,159,52,.28); color:var(--gold); }
  .status-ready{ background:rgba(76,140,90,.25); color:#7fc98f; }
  .status-out_for_delivery{ background:rgba(76,108,140,.25); color:#8fb8d9; }
  .status-completed{ background:rgba(244,234,214,.12); color:var(--paper-dim); }
  .status-cancelled{ background:rgba(194,42,47,.2); color:#e59a9c; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--paper); color:var(--ink); font-weight:700; font-size:14px; padding:12px 22px;
    border-radius:999px; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); transition:opacity .2s ease, transform .2s ease; z-index:100; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= CUSTOMER / POS shared ordering layout ================= */
  .order-layout{ display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 57px); }
  .order-menu-pane{ overflow-y:auto; padding:18px 20px 40px; background:var(--ink); }
  .order-cart-pane{ background:var(--ink-soft); border-left:1px solid var(--line-on-ink); display:flex; flex-direction:column; height:100%; }
  @media (max-width:860px){
    .order-layout{ grid-template-columns:1fr; height:auto; }
    .order-cart-pane{ border-left:none; border-top:1px solid var(--line-on-ink); }
  }

  .cat-bar{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:14px; position:sticky; top:0; background:var(--ink); z-index:5; }

  .today-banner{
    display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, rgba(220,159,52,.16), transparent);
    border:1px solid rgba(220,159,52,.4); border-radius:8px; padding:12px 16px; margin-bottom:16px; cursor:pointer;
  }
  .today-banner .t{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); }
  .today-banner .n{ font-family:"Rye",serif; font-size:17px; color:var(--paper); }
  .today-banner .p{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); }

  .menu-section{ margin-bottom:26px; }
  .menu-section h3{ font-size:19px; color:var(--paper); border-bottom:2px solid var(--line-on-ink); padding-bottom:8px; margin-bottom:10px; display:flex; align-items:baseline; gap:10px; }
  .menu-section .note{ font-family:"Work Sans"; font-size:11.5px; font-style:italic; color:var(--gold); font-weight:500; }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .item-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; text-align:left; color:var(--paper);
  }
  .item-card:hover{ border-color:var(--gold); }
  .item-card .n{ font-weight:600; font-size:13.5px; }
  .item-card .s{ font-size:11px; color:var(--paper-dim); display:block; margin-top:2px; }
  .item-card .p{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); white-space:nowrap; }
  .item-card .plus{ width:26px; height:26px; border-radius:50%; background:var(--sauce); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .item-card--soldout{ opacity:.55; cursor:not-allowed; }
  .item-card--soldout:hover{ border-color:var(--line-on-ink); }
  .soldout-badge{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--paper-dim); border:1px solid var(--line-on-ink); border-radius:999px; padding:4px 10px; white-space:nowrap; }
  .regular-badge{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--gold); border-radius:999px; padding:2px 7px; white-space:nowrap; vertical-align:middle; }
  .timeline-track{ position:relative; height:14px; background:var(--ink); border:1px solid var(--line-on-ink); border-radius:999px; }
  .timeline-dot{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--ink-soft); }
  .timeline-now{ position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--paper-dim); }
  .timeline-labels{ display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--paper-dim); margin-top:8px; }
  .timeline-legend-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .kitchen-pause-badge{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:6px 14px; white-space:nowrap; border:1px solid var(--line-on-ink); background:var(--ink-soft); color:var(--paper-dim); cursor:default; }
  .kitchen-pause-badge.is-paused{ border-color:var(--bad); color:var(--bad); }
  .kitchen-pause-badge.is-clickable{ cursor:pointer; }
  .kitchen-pause-badge.is-clickable:hover{ border-color:var(--gold); color:var(--gold); }
  .header-clock{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--paper-dim); }
  .icon-btn{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:none; border:1px solid var(--line-on-ink); color:var(--paper-dim); cursor:pointer; flex:none; }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .presence-wrap{ position:relative; display:inline-flex; }
  .presence-widget{ display:flex; align-items:center; gap:0; background:none; border:none; padding:2px; cursor:pointer; }
  .presence-widget:hover .presence-avatar{ transform:translateY(-2px); }
  .presence-avatar{
    width:28px; height:28px; border-radius:50%; margin-left:-9px;
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:700; color:#fff;
    border:2px solid var(--ink-soft); box-shadow:0 1px 3px rgba(0,0,0,.4);
    transition:transform .15s ease; flex:none;
  }
  .presence-avatar:first-child{ margin-left:0; }
  .presence-avatar.is-you{ border-color:var(--gold); }
  .presence-avatar--overflow{ background:var(--ink); color:var(--paper-dim); }
  .presence-widget:hover{ border-color:var(--gold); color:var(--gold); }
  .presence-dropdown{ position:absolute; top:calc(100% + 8px); right:0; min-width:220px; background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:10px 14px; box-shadow:0 12px 28px -12px rgba(0,0,0,.6); text-align:left; z-index:20; }
  .presence-dropdown .row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12.5px; color:var(--paper); white-space:nowrap; }
  .presence-dropdown .row .who{ color:var(--paper-dim); }
  .kitchen-new-badge{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:700; line-height:1; background:var(--sauce); color:#fff; border:none; border-radius:999px; min-width:26px; height:26px; padding:0 8px; cursor:pointer; animation:kitchen-badge-pop .25s ease-out; }
  .kitchen-new-badge:hover{ filter:brightness(1.1); }
  @keyframes kitchen-badge-pop{ from{ transform:scale(0.6); opacity:0; } to{ transform:scale(1); opacity:1; } }

  /* pizza builder */
  .builder{ background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:18px; }
  .size-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .size-opt{ flex:1; min-width:130px; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:8px; padding:10px 12px; text-align:left; color:var(--paper); }
  .size-opt[aria-pressed="true"]{ border-color:var(--sauce); background:rgba(194,42,47,.12); }
  .size-opt .n{ font-weight:700; font-size:13px; }
  .size-opt .p{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gold); margin-top:2px; }
  .topping-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .topping-chip{ font-size:12.5px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); }
  .topping-chip[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700; }
  .builder-total{ display:flex; align-items:center; justify-content:space-between; }

  /* cart */
  .cart-head{ padding:16px 18px; border-bottom:1px solid var(--line-on-ink); }
  .cart-head h3{ font-size:18px; }
  .cart-items{ flex:1; overflow-y:auto; padding:10px 18px; }
  .cart-line{ display:flex; gap:8px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line-on-ink); }
  .cart-line .n{ font-weight:600; font-size:13px; flex:1; }
  .cart-line .meta{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  .cart-line .qty{ display:flex; align-items:center; gap:6px; }
  .qty-btn{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line-on-ink); background:transparent; color:var(--paper); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .cart-line .p{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; white-space:nowrap; }
  .cart-empty{ text-align:center; color:var(--paper-dim); font-size:13px; padding:30px 10px; }
  .cart-foot{ padding:14px 18px 18px; border-top:1px solid var(--line-on-ink); }
  .row-between{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin:4px 0; }
  .row-between.total{ font-size:18px; font-weight:700; font-family:"IBM Plex Mono",monospace; margin-top:8px; }

  .field-group{ margin-top:10px; }
  .field-group label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--paper-dim); margin-bottom:5px; font-family:"IBM Plex Mono",monospace; }
  .field-group input, .field-group textarea{
    width:100%; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:6px; color:var(--paper);
    padding:9px 11px; font-size:13.5px;
  }
  .field-group input:focus, .field-group textarea:focus{ outline:none; border-color:var(--gold); }
  .seg{ display:flex; border:1.5px solid var(--line-on-ink); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; background:transparent; border:none; color:var(--paper-dim); padding:9px 8px; font-size:12.5px; font-weight:600; }
  .seg button[aria-pressed="true"]{ background:var(--sauce); color:var(--paper); }

  /* order confirmation */
  .confirm-wrap{ height:calc(100vh - 57px); display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; }
  .confirm-card{ max-width:420px; }
  .confirm-ticket{ font-family:"Rye",serif; font-size:56px; color:var(--gold); }

  /* ================= KITCHEN BOARD ================= */
  #view-kitchen{ padding:16px 20px; height:calc(100vh - 57px); overflow-y:auto; }
  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start; }
  @media (max-width:1000px){ .kanban{ grid-template-columns:1fr 1fr; } }
  .kanban-col{ background:var(--ink-soft); border-radius:10px; padding:12px; min-height:120px; }
  .kanban-col h4{ font-size:13px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.1em; color:var(--paper-dim); padding:4px 6px 10px; display:flex; justify-content:space-between; }
  .ticket{
    background:var(--paper); color:var(--ink); border-radius:8px; padding:12px 13px; margin-bottom:10px;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.5); border-left:5px solid var(--ok);
  }
  .ticket.age-warn{ border-left-color:var(--warn); }
  .ticket.age-bad{ border-left-color:var(--bad); animation:ticketPulse 2s ease-in-out infinite; }
  @keyframes ticketPulse{ 0%,100%{ box-shadow:0 0 0 rgba(198,42,47,0); } 50%{ box-shadow:0 0 0 3px rgba(198,42,47,.18); } }
  .ticket .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .ticket .num{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px; }
  .ticket .type{ font-size:10px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:rgba(28,23,18,.1); }
  .ticket .type.type-delivery{ background:rgba(198,42,47,.15); color:var(--sauce-deep); }
  .ticket .type.type-pickup{ background:rgba(60,120,60,.15); color:#2d5a2d; }
  .ticket .age{ font-size:11px; color:var(--sauce-deep); font-weight:700; margin-top:2px; }
  .ticket ul{ list-style:none; margin:8px 0; padding:0; font-size:12.5px; }
  .ticket li{ padding:2px 0; }
  .ticket li b{ font-family:"IBM Plex Mono",monospace; }
  .ticket .who{ font-size:11.5px; color:rgba(28,23,18,.65); margin-top:4px; }
  .ticket .tip-note{ font-size:11px; color:var(--sauce-deep); font-weight:700; margin-top:4px; }
  .ticket .advance{ width:100%; margin-top:10px; background:var(--ink); color:var(--paper); border:none; border-radius:6px; padding:12px; font-weight:700; font-size:13px; }
  .ticket .advance:hover{ background:var(--sauce); }
  .kanban-empty{ font-size:12px; color:var(--paper-dim); padding:10px 6px; }

  /* ================= DRIVER APP ================= */
  #view-driver{ max-width:520px; margin:0 auto; padding:16px 16px 60px; }
  .driver-setup{ text-align:center; padding:60px 20px; }
  .driver-card{
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:14px;
  }
  .driver-card .top{ display:flex; justify-content:space-between; align-items:center; }
  .driver-card .addr{ font-weight:700; font-size:15px; margin-top:8px; }
  .driver-card .sub{ font-size:12.5px; color:var(--paper-dim); margin-top:2px; }
  .driver-card .due{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); font-size:16px; margin-top:10px; }
  .driver-actions{ display:flex; gap:8px; margin-top:12px; }
  .driver-actions a, .driver-actions button{ flex:1; text-align:center; text-decoration:none; }

<script>
/* TAX_RATE, PIZZA_SIZES, TOPPINGS, SPECIALTY_PIZZAS, CATEGORIES,
   SPECIALS_BY_DAY, DAY_NAMES, applyMenuConfig(), and loadMenuConfig()
   now live in ordering-core.js (loaded above), shared with
   order/index.html. */

/* Store-wide operational settings (store_settings table) -- whether the
   kiosk is currently taking online orders (shown as a status badge on
   Kitchen Board), and the working state edited from Store Settings.
   Same fallback pattern as menu_config: missing table or failed fetch
   just means "not paused, nothing overridden". */
let StoreSettingsState = {
  ordersPaused: false,
  pauseMessage: "We're not accepting online orders right now — please call the shop to place your order.",
  hoursOverrideActive: false,
  hoursOverrideNote: '',
  receiptMessage: "Thank you for your order!\nPay in person at pickup or delivery.",
  version: null,
};

function applyStoreSettings(row){
  if (!row || typeof row !== 'object') return false;
  StoreSettingsState = {
    ordersPaused: !!row.ordersPaused,
    pauseMessage: row.pauseMessage || StoreSettingsState.pauseMessage,
    hoursOverrideActive: !!row.hoursOverrideActive,
    hoursOverrideNote: row.hoursOverrideNote || '',
    receiptMessage: row.receiptMessage || StoreSettingsState.receiptMessage,
    version: row.version,
  };
  return true;
}

async function loadStoreSettings(db){
  if (!db) return false;
  try{
    const doc = await db.collection('store_settings').doc(1).get();
    return applyStoreSettings(doc.data());
  }catch(e){
    console.error('Could not load live store settings, using built-in defaults:', e);
    return false;
  }
}
</script>

<script>
/* =========================================================================
   UTILITIES
   ========================================================================= */
/* money, escapeHtml, computeTotals, and lineLabel now live in
   order/ordering-core.js (loaded above), shared with order/index.html. */
function newTicket(){ return 'T' + String(Date.now()).slice(-6); }
function newId(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function timeAgo(ts){
  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));
  if (mins < 1) return 'just in';
  if (mins === 1) return '1 min';
  return mins + ' min';
}

/* Repeat-customer flagging, shared by POS queue and Kitchen Board (both
   already fetch the full live orders table before filtering down to
   just active ones -- this reuses that same fetch rather than a
   separate query). Rebuilt on every snapshot from whichever of those
   two screens is currently open; "regular" mirrors Analytics' own bar
   of 2+ orders on file under the same phone number. */
let RegularsIndex = new Map();
let regularsIndexInFlight = false;
// Backed by regulars_summary() (supabase/schema.sql) -- a server-side
// aggregate over the FULL orders table, not whatever a live snapshot
// happened to have fetched. That used to be counted from the same
// unbounded "fetch every order" queries the POS Queue/Kitchen Board
// already run, which risked PostgREST's default row cap silently
// truncating older orders out of the count once lifetime order history
// grew past it -- undercounting exactly the customers this badge exists
// to recognize. Called from those same two live subscriptions (throttled
// with regularsIndexInFlight below so a burst of snapshot ticks doesn't
// fire a burst of redundant RPC calls); failing quietly just means the
// Regular badge doesn't show up for a tick, not that anything broke.
async function buildRegularsIndex(){
  if (regularsIndexInFlight || !App.db) return;
  regularsIndexInFlight = true;
  try{
    const rows = await App.db.rpc('regulars_summary', {});
    const map = new Map();
    (rows || []).forEach(r => { if (r.phone) map.set(r.phone, Number(r.order_count) || 0); });
    RegularsIndex = map;
  }catch(e){ /* Regular badges just skip this refresh -- not critical */ }
  regularsIndexInFlight = false;
}
function isRegular(phone){
  const p = (phone||'').trim();
  return !!p && (RegularsIndex.get(p)||0) >= 2;
}
function regularBadgeHtml(phone){
  return isRegular(phone) ? ' <span class="regular-badge" title="2+ orders on file with this phone number">Regular</span>' : '';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Generic confirm modal. opts: { title, body, confirmLabel, cancelLabel,
   danger (bool, styles confirm button red), withReason (bool, shows a
   text field and passes its value to onConfirm), onConfirm(reason) }. */
function showConfirmModal(opts){
  const existing = document.getElementById('confirmModalBackdrop');
  if (existing) existing.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'confirmModalBackdrop';
  backdrop.innerHTML = `
    <div class="modal-card">
      <h3>${escapeHtml(opts.title || 'Are you sure?')}</h3>
      ${opts.body ? `<p>${escapeHtml(opts.body)}</p>` : ''}
      ${opts.withReason ? `<textarea id="confirmModalReason" rows="2" placeholder="${escapeHtml(opts.reasonPlaceholder || 'Reason (optional)')}"></textarea>` : ''}
      <div class="modal-actions">
        <button class="btn-ghost" id="confirmModalCancel" type="button">${escapeHtml(opts.cancelLabel || 'Never mind')}</button>
        <button class="btn ${opts.danger ? 'btn-sauce' : 'btn-outline'}" id="confirmModalOk" type="button">${escapeHtml(opts.confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  document.getElementById('confirmModalCancel').addEventListener('click', close);
  document.getElementById('confirmModalOk').addEventListener('click', () => {
    const reason = opts.withReason ? document.getElementById('confirmModalReason').value.trim() : undefined;
    close();
    if (opts.onConfirm) opts.onConfirm(reason);
  });
}

/* =========================================================================
   STATE
   ========================================================================= */
const App = {
  role: null,
  db: null,
  dbReady: false,
  unsub: [],
  cart: [],
  driverName: null,
  driver: null,
  isAdmin: false,
  isDriverStaff: false, // from the staff table (isDriver flag) -- distinct from
    // App.driver, which is the drivers-table profile loaded separately by the
    // Driver App screen itself.
};

function showDbBanner(msg){
  const banner = document.getElementById('db-banner');
  if (!banner) return;
  if (!msg){ banner.hidden = true; banner.textContent = ''; return; }
  banner.hidden = false;
  banner.innerHTML = msg;
}

async function getDb(){
  if (App.db || App.dbReady) return App.db;
  App.dbReady = true;
  try{
    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if (!url || !key){
      showDbBanner('Not connected to a database yet. See ../supabase/README.md to finish setup (edit order/supabase-config.js).');
      App.db = null;
      return App.db;
    }
    if (typeof window.supabase === 'undefined' || typeof window.createSupabaseDb === 'undefined'){
      showDbBanner('Database scripts failed to load. Check your internet connection and reload.');
      App.db = null;
      return App.db;
    }
    const client = window.supabase.createClient(url, key);
    App.db = window.createSupabaseDb(client);
  }catch(e){
    showDbBanner('Could not connect to the database: ' + (e && e.message ? e.message : 'unknown error'));
    App.db = null;
  }
  return App.db;
}

function ordersCol(){
  return App.db ? App.db.collection('orders') : null;
}

/* Create an order document. Returns the ticket number, or null if the
   order could not be saved (caller must check for null and not proceed
   as though the order went through). */
async function submitOrder(order){
  const ticket = newTicket();
  const body = Object.assign({
    ticket,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    status: 'new',
    driver: null,
  }, order);
  const db = await getDb();
  if (!db){
    showToast('Offline: order not saved (no database connection)');
    return null;
  }
  try{
    await db.collection('orders').add(body);
  }catch(e){
    showToast('Could not save order: ' + (e && e.message ? e.message : 'unknown error'));
    reportAppError('pos-submit', (e && e.message) || 'unknown error'); // message only -- never customer data
    return null;
  }
  return ticket;
}

async function updateOrder(docId, patch){
  const db = await getDb();
  if (!db){ showToast('Offline: change not saved (no database connection)'); return false; }
  patch = Object.assign({ updatedAt: Date.now() }, patch);
  try{
    await db.collection('orders').doc(docId).update(patch);
    return true;
  }catch(e){
    // Not actually a "two staff clicked at once" race -- Postgres has no
    // such failure mode for a plain UPDATE, it just applies both in
    // order. Every error here is a real one (RLS denial -- more
    // reachable now that driver accounts are RLS-scoped to their own
    // deliveries -- a dropped connection, bad data) that used to fail
    // completely silently: the button click did nothing, and nothing on
    // screen said why.
    showToast('Could not save that change: ' + (e && e.message ? e.message : 'unknown error'));
    return false;
  }
}

/* Queues a print-bridge job (supabase/schema.sql's print_jobs table) --
   see print-bridge/README.md for the full picture. Cash orders also
   kick the drawer as part of the same print job (openDrawer), so a
   till-side "no sale" is the only time drawerOnly is used on its own.
   Fire-and-forget by design: this only ever queues the job, it doesn't
   wait to confirm the bridge actually printed it (that machine might be
   off, or a few seconds behind) -- Staff Hub > System Health is where
   to check the bridge itself is alive. */
async function requestPrint(order, { drawerOnly = false } = {}){
  const db = await getDb();
  if (!db){ showToast('Offline: nothing queued (no database connection)'); return; }
  const body = drawerOnly
    ? { kind: 'drawer_kick', ticket: '', requestedByEmail: App.myEmail || '' }
    : {
        kind: 'receipt',
        ticket: order.ticket || '',
        orderId: order.id || null,
        requestedByEmail: App.myEmail || '',
        payload: {
          ticket: order.ticket || '', orderType: order.orderType || '',
          customerName: order.customerName || '', phone: order.phone || '', address: order.address || '',
          items: order.items || [], subtotal: order.subtotal || 0, tax: order.tax || 0,
          tip: order.tip || 0, total: order.total || 0, notes: order.notes || '',
          openDrawer: order.payMethod === 'cash',
        },
      };
  try{
    await db.collection('print_jobs').add(body);
    showToast(drawerOnly ? 'Drawer open queued' : `Receipt for ${order.ticket || 'this order'} sent to the printer`);
  }catch(e){
    showToast('Could not queue that: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

/* POS > "Reprint an Order" -- finds any order (active or long since
   completed) by exact ticket number and offers a Print button, using
   the same requestPrint() the live queue's own Print buttons use. Not
   a live subscription -- a one-shot lookup is all a manual ticket
   search needs. */
async function reprintLookup(){
  const input = document.getElementById('reprint-ticket-input');
  const result = document.getElementById('reprint-result');
  const ticket = (input.value || '').trim().toUpperCase();
  if (!ticket){ result.innerHTML = ''; return; }
  result.innerHTML = '<div style="font-size:12.5px; color:var(--paper-dim);">Searching...</div>';
  const db = App.db || await getDb();
  if (!db){ result.innerHTML = '<div style="font-size:12.5px; color:var(--bad);">Not connected to the database.</div>'; return; }
  try{
    const snap = await db.collection('orders').where('ticket', '==', ticket).get();
    const doc = (snap.docs || [])[0];
    const order = doc ? Object.assign({ id: doc.id }, doc.data()) : null;
    if (!order){
      result.innerHTML = `<div style="font-size:12.5px; color:var(--bad);">No order found with ticket ${escapeHtml(ticket)}.</div>`;
      return;
    }
    result.innerHTML = `
      <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="mono" style="font-weight:700;">${escapeHtml(order.ticket||'')}</span>
        <span class="status-chip status-${order.status}">${escapeHtml(statusName(order.status))}</span>
        <span style="flex:1; min-width:100px; font-size:13px;">${escapeHtml(order.customerName||'')}</span>
        <span class="mono" style="font-weight:600;">${money(order.total||0)}</span>
        <span style="font-size:11px; color:var(--paper-dim);">${order.createdAt ? new Date(order.createdAt).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : ''}</span>
        <button class="btn btn-outline" id="reprint-print-btn" type="button" style="padding:6px 12px; font-size:12px;">Print</button>
      </div>`;
    document.getElementById('reprint-print-btn').addEventListener('click', () => requestPrint(order));
  }catch(e){
    result.innerHTML = `<div style="font-size:12.5px; color:var(--bad);">Search failed: ${escapeHtml((e && e.message) || 'unknown error')}</div>`;
  }
}
</script>

<script>
/* =========================================================================
   AUTH GATE + BOOT + ROLE SWITCHING
   ========================================================================= */
const ROLE_LABELS = { pos:'Staff POS', kitchen:'Kitchen Board', driver:'Driver App', analytics:'Analytics', driverroster:'Driver Roster', menu:'Menu Editor', storesettings:'Store Settings', till:'Till', bugreports:'Bug Reports', promocodes:'Promo Codes', drivermap:'Driver Map', systemhealth:'System Health', catering:'Catering Inquiries' };

function stopAllSubscriptions(){
  App.unsub.forEach(fn => { try{ fn(); }catch(e){} });
  App.unsub = [];
}

/* Which role screens a signed-in staff member can reach, from the two
   flags already on their staff row (no new schema needed). Kept
   deliberately simple for a shop this size:
     - isAdmin sees everything, always.
     - isDriver-only staff (a delivery driver who isn't also an admin)
       only sees Driver App -- no register, no kitchen board, no
       customer/analytics data they don't need for the job. This is
       also what was producing "No driver profile found" confusion
       for admin accounts that aren't drivers: Driver App used to be
       shown to every signed-in staff member regardless of whether
       they had a linked drivers row at all.
     - Everyone else (regular counter/kitchen staff -- neither admin
       nor driver) gets POS, Kitchen, and Analytics, not Driver App,
       Driver Roster, or Menu Editor.
   Enforced here for the UI (so people aren't shown screens that will
   just error or confuse them); the actual security boundary is still
   the RLS policies in schema.sql, same as before -- hiding a button
   was never what protected the data. */
function computeRolePermissions(){
  const isAdmin = App.isAdmin;
  const isDriver = App.isDriverStaff;
  return {
    pos: isAdmin || !isDriver,
    kitchen: isAdmin || !isDriver,
    analytics: isAdmin || !isDriver,
    driver: isAdmin || isDriver,
    driverroster: isAdmin,
    menu: isAdmin,
    storesettings: isAdmin,
    till: isAdmin || !isDriver,
    bugreports: isAdmin,
    promocodes: isAdmin,
    systemhealth: isAdmin,
    catering: isAdmin,
    drivermap: isAdmin || !isDriver,
  };
}

function applyRoleVisibility(){
  const perms = computeRolePermissions();
  document.querySelectorAll('.role-card[data-role]').forEach(card => {
    card.hidden = !perms[card.getAttribute('data-role')];
  });
  // A section heading with nothing visible under it (e.g. "Management"
  // for a driver-only account) would just look broken -- hide the whole
  // section, not only its cards.
  document.querySelectorAll('.role-section').forEach(section => {
    section.hidden = section.querySelectorAll('.role-card:not([hidden])').length === 0;
  });
}

/* Active-user indicator: "who else is signed into the Staff Hub right
   now". Backed by a real table (staff_presence) with the same
   is_staff()-gated RLS as everything else, not a Realtime Presence
   channel -- see the note in supabase/schema.sql for why (the customer
   kiosk shares the same public anon key, and presence/broadcast
   channels aren't RLS-gated the way table reads are). */
let presenceHeartbeatTimer = null;
let presenceListTimer = null;
const PRESENCE_ONLINE_WINDOW_MS = 45000; // 2-3x the heartbeat interval below

async function touchPresence(){
  const db = App.db || await getDb();
  if (!db || !App.myEmail) return;
  try{
    const { data: sessionData } = await db.auth.getSession();
    const uid = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    if (!uid) return;
    await db.collection('staff_presence').doc(uid).set({
      email: App.myEmail,
      role: App.role || null,
      lastSeenAt: Date.now(),
    });
  }catch(e){ /* purely a nice-to-have display -- fail silent */ }
}

async function deleteOwnPresence(db){
  try{
    const { data: sessionData } = await db.auth.getSession();
    const uid = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    if (uid) await db.collection('staff_presence').doc(uid).delete();
  }catch(e){ /* stale row just ages out of the online window instead */ }
}

function startPresenceHeartbeat(){
  touchPresence();
  refreshPresenceList();
  clearInterval(presenceHeartbeatTimer);
  presenceHeartbeatTimer = setInterval(touchPresence, 20000);
  clearInterval(presenceListTimer);
  presenceListTimer = setInterval(refreshPresenceList, 20000);
}

function stopPresenceHeartbeat(){
  clearInterval(presenceHeartbeatTimer);
  clearInterval(presenceListTimer);
}

// Deterministic color per person (from their email) so the same person
// gets the same avatar color every time, across sessions and devices.
function presenceAvatarColor(email){
  let hash = 0;
  for (let i = 0; i < email.length; i++){ hash = email.charCodeAt(i) + ((hash << 5) - hash); }
  return `hsl(${Math.abs(hash) % 360}, 55%, 42%)`;
}

const PRESENCE_MAX_AVATARS = 4;

async function refreshPresenceList(){
  const widget = document.getElementById('presence-widget');
  if (!App.db || !widget) return;
  try{
    const snap = await App.db.collection('staff_presence').get();
    const rows = (snap.docs || []).map(d => d.data());
    const cutoff = Date.now() - PRESENCE_ONLINE_WINDOW_MS;
    const online = rows.filter(r => (r.lastSeenAt||0) >= cutoff)
      .sort((a,b) => (a.email === App.myEmail ? -1 : b.email === App.myEmail ? 1 : 0));
    widget.hidden = false;
    // A facepile (overlapping avatar circles), the standard pattern for
    // "who's here right now" in collaborative tools -- recognizable at
    // a glance without reading text, and scales better than a growing
    // "N online" string as more staff sign in at once.
    const shown = online.slice(0, PRESENCE_MAX_AVATARS);
    const overflow = online.length - shown.length;
    widget.innerHTML = shown.map(r => {
      const initial = escapeHtml(((r.email || '?').charAt(0)).toUpperCase());
      const isYou = r.email === App.myEmail;
      return `<span class="presence-avatar${isYou ? ' is-you' : ''}" style="background:${presenceAvatarColor(r.email||'')};">${initial}</span>`;
    }).join('') + (overflow > 0 ? `<span class="presence-avatar presence-avatar--overflow">+${overflow}</span>` : '');
    const list = document.getElementById('presence-dropdown-list');
    if (list){
      list.innerHTML = online.length ? online.map(r => `
        <div class="row">
          <span>${escapeHtml((r.email||'').split('@')[0] || 'unknown')}${r.email === App.myEmail ? ' (you)' : ''}</span>
          <span class="who">${escapeHtml(ROLE_LABELS[r.role] || '—')}</span>
        </div>`).join('') : '<div class="row"><span class="who">Nobody else online</span></div>';
    }
  }catch(e){ widget.hidden = true; }
}

function wirePresenceWidget(){
  const widget = document.getElementById('presence-widget');
  const wrap = document.getElementById('presence-wrap');
  if (!widget || !wrap) return;
  widget.addEventListener('click', (e) => {
    e.stopPropagation();
    let dropdown = document.getElementById('presence-dropdown');
    if (dropdown){ dropdown.remove(); return; } // toggle closed
    // A sibling of the button, not a child of it -- appending inside the
    // clicked element itself changes its bounding box mid-click, which
    // both looks janky and confuses Playwright's actionability retries.
    dropdown = document.createElement('div');
    dropdown.id = 'presence-dropdown';
    dropdown.className = 'presence-dropdown';
    dropdown.innerHTML = '<div id="presence-dropdown-list">Loading...</div>';
    wrap.appendChild(dropdown);
    refreshPresenceList();
    const closeOnOutsideClick = () => { dropdown.remove(); document.removeEventListener('click', closeOnOutsideClick); };
    setTimeout(() => document.addEventListener('click', closeOnOutsideClick), 0);
  });
}

let headerClockTimer = null;
function startHeaderClock(){
  clearInterval(headerClockTimer);
  const tick = () => {
    const el = document.getElementById('header-clock');
    if (!el){ clearInterval(headerClockTimer); return; }
    el.textContent = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  };
  tick();
  headerClockTimer = setInterval(tick, 15000);
}

function goToRole(role){
  const perms = computeRolePermissions();
  if (!perms[role]){
    showToast("You don't have access to that screen. Ask a manager if that's wrong.");
    localStorage.removeItem('cifellis_role');
    document.getElementById('app-shell').hidden = true;
    document.getElementById('screen-role').hidden = false;
    return;
  }
  App.role = role;
  localStorage.setItem('cifellis_role', role);
  document.getElementById('screen-role').hidden = true;
  document.getElementById('app-shell').hidden = false;
  document.getElementById('role-label').textContent = ROLE_LABELS[role];
  document.querySelectorAll('.view').forEach(v => v.hidden = true);
  stopAllSubscriptions();

  const right = document.getElementById('header-right');
  right.innerHTML = '<span class="header-clock" id="header-clock"></span><span class="presence-wrap" id="presence-wrap"><button type="button" id="presence-widget" class="presence-widget" hidden></button></span><button class="icon-btn" id="report-bug-btn" type="button" title="Report a bug" aria-label="Report a bug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="6" width="8" height="12" rx="4"/><path d="M8 9H4M8 13H4M8 17H5M16 9h4M16 13h4M16 17h3M12 3v3M9 5l1.5 1M15 5l-1.5 1"/></svg></button><button class="btn-ghost" id="switch-role-btn">Switch screen</button><button class="btn-ghost" id="signout-btn">Sign Out</button>';
  document.getElementById('report-bug-btn').addEventListener('click', openBugReportModal);
  startHeaderClock();
  wirePresenceWidget();
  touchPresence(); // reflect the newly-switched-to screen right away, don't wait for the next heartbeat tick
  refreshPresenceList(); // ditto for the widget itself -- don't sit hidden until the next 20s tick
  document.getElementById('switch-role-btn').addEventListener('click', () => {
    localStorage.removeItem('cifellis_role');
    stopAllSubscriptions();
    document.getElementById('app-shell').hidden = true;
    document.getElementById('screen-role').hidden = false;
  });
  document.getElementById('signout-btn').addEventListener('click', async () => {
    const db = await getDb();
    if (db && db.auth){
      await deleteOwnPresence(db);
      await db.auth.signOut();
    }
  });

  if (role === 'pos'){ document.getElementById('view-pos').hidden = false; initPosView(); }
  if (role === 'kitchen'){ document.getElementById('view-kitchen').hidden = false; initKitchenView(); }
  if (role === 'driver'){ document.getElementById('view-driver').hidden = false; initDriverView(); }
  if (role === 'analytics'){ document.getElementById('view-analytics').hidden = false; initAnalyticsView(); }
  if (role === 'driverroster'){ document.getElementById('view-driverroster').hidden = false; initDriverRosterView(); }
  if (role === 'menu'){ document.getElementById('view-menu').hidden = false; initMenuEditorView(); }
  if (role === 'storesettings'){ document.getElementById('view-storesettings').hidden = false; initStoreSettingsView(); }
  if (role === 'till'){ document.getElementById('view-till').hidden = false; initTillView(); }
  if (role === 'bugreports'){ document.getElementById('view-bugreports').hidden = false; initBugReportsView(); }
  if (role === 'promocodes'){ document.getElementById('view-promocodes').hidden = false; initPromoCodesView(); }
  if (role === 'systemhealth'){ document.getElementById('view-systemhealth').hidden = false; initSystemHealthView(); }
  if (role === 'catering'){ document.getElementById('view-catering').hidden = false; initCateringView(); }
  if (role === 'drivermap'){ document.getElementById('view-drivermap').hidden = false; initDriverMapView(); }
}

document.querySelectorAll('.role-card').forEach(btn => {
  btn.addEventListener('click', () => goToRole(btn.getAttribute('data-role')));
});

/* Staff sign-in gate: nothing in the role picker or app shell is reachable
   until Supabase Auth confirms a signed-in session. This is a genuine
   access boundary, not just hidden UI, real protection comes from the
   database-side RLS policies (see supabase/schema.sql) requiring an
   authenticated session for reading or updating orders; this gate just
   keeps the staff screens from rendering without one. */
async function initAuthGate(){
  const db = await getDb();
  const auth = db && db.auth;
  const loginScreen = document.getElementById('screen-login');
  const roleScreen = document.getElementById('screen-role');
  const loginError = document.getElementById('loginError');

  function showLogin(msg){
    document.getElementById('app-shell').hidden = true;
    roleScreen.hidden = true;
    loginScreen.hidden = false;
    if (msg){ loginError.hidden = false; loginError.textContent = msg; }
  }
  async function showRolePicker(){
    loginScreen.hidden = true;
    roleScreen.hidden = false;
    // Must resolve before auto-resuming a saved role below: Driver
    // Roster's Approve buttons only render for App.isAdmin, so if an
    // admin's saved role is 'driverroster' and this hasn't finished
    // yet, goToRole() would render that screen with isAdmin still at
    // its default false and never re-render once the real value comes
    // back — they'd see no Approve buttons until manually switching
    // screens and back.
    await loadMyStaffRow();
    const saved = localStorage.getItem('cifellis_role');
    if (saved && ROLE_LABELS[saved]) goToRole(saved);
  }

  async function loadMyStaffRow(){
    const { data: sessionData } = await auth.getSession();
    const uid = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    const email = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.email;
    App.myEmail = email || '';
    App.myUid = uid || null;
    if (!uid || !db) return;
    startPresenceHeartbeat();
    try{
      const row = await db.collection('staff').doc(uid).get();
      App.isAdmin = !!(row.data() && row.data().isAdmin);
      App.isDriverStaff = !!(row.data() && row.data().isDriver);
    }catch(e){ App.isAdmin = false; App.isDriverStaff = false; }
    applyRoleVisibility();
  }

  if (!auth){
    showLogin('Not connected to the database yet. See supabase/README.md.');
    return;
  }

  const { data } = await auth.getSession();
  if (data && data.session) showRolePicker(); else showLogin();

  auth.onAuthStateChange((_event, session) => {
    if (session) showRolePicker();
    else { stopAllSubscriptions(); stopPresenceHeartbeat(); showLogin(); }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const passwordEl = document.getElementById('loginPassword');
    const btn = document.getElementById('loginSubmitBtn');
    const formEl = document.getElementById('loginForm');
    loginError.hidden = true;
    formEl.classList.remove('shake');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    let error;
    try{
      ({ error } = await auth.signInWithPassword({ email, password }));
    }catch(networkErr){
      error = networkErr;
    }
    btn.disabled = false;
    btn.textContent = 'Sign In';
    if (error){
      loginError.hidden = false;
      // Supabase's own wording varies by cause -- translate the ones a
      // staff member will actually hit into something that tells them
      // what to do next, not just that something went wrong.
      const raw = (error.message || '').toLowerCase();
      if (raw.includes('invalid login credentials')){
        loginError.textContent = "That email or password isn't right. Double-check for typos, or ask an admin to reset your password.";
      } else if (raw.includes('email not confirmed')){
        loginError.textContent = 'This account still needs email confirmation before it can sign in — check that inbox, or ask an admin to confirm it from the Supabase dashboard.';
      } else if (raw.includes('rate limit') || raw.includes('too many')){
        loginError.textContent = "Too many attempts too quickly — wait a minute before trying again.";
      } else if (error.name === 'TypeError' || raw.includes('fetch') || raw.includes('network')){
        loginError.textContent = "Couldn't reach the server — check the internet connection and try again.";
      } else {
        loginError.textContent = "Couldn't sign in: " + (error.message || 'unknown error') + '.';
      }
      // A brief shake draws the eye to the message instead of leaving
      // it to blend into the rest of the form, and clearing (not
      // hiding) the password field means a mistyped password doesn't
      // linger looking like it should have worked.
      passwordEl.value = '';
      passwordEl.focus();
      formEl.classList.add('shake');
      setTimeout(() => formEl.classList.remove('shake'), 400);
    }
  });
}

/* Install prompt: Chrome/Edge/Android fire beforeinstallprompt; iOS Safari
   never does (there is no programmatic install there), so the button
   simply never appears on iOS and staff use Share > Add to Home Screen. */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').hidden = true;
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = true;
});
</script>

<script>
/* =========================================================================
   ORDERING (shared by Customer Kiosk and Staff POS)
   ========================================================================= */
let orderCtx = { mode:null, cart:[], pizzaSize:'medium', pizzaToppings:new Set(), orderType:null, payMethod:'cash', tip:0, tipPct:null, deliveryInfo:null, editingOrderId:null };

/* resetOrderCtx, addLine, changeQty, buildMenuPaneHTML, buildCartPaneHTML,
   wireCategoryBar, wireItemButtons, renderSpecialtyPizzas,
   wireSpecialtyButtons, renderPizzaBuilder, wireSeg, updateChangeDue,
   renderCart, and renderOrderLayout now live in ordering-core.js (loaded
   above), shared with order/index.html. The dead vestigial copy of the
   customer ordering flow that used to sit here (initCustomerView,
   submitCustomerOrder, showOrderConfirmation -- never called from this
   file) has been removed. */

function initPosView(){
  stopAllSubscriptions();
  resetOrderCtx('pos');
  orderCtx.orderType = 'phone';
  renderOrderLayout('pos');
}

async function submitPosOrder(){
  const name = document.getElementById('custname-pos').value.trim();
  const phone = document.getElementById('custphone-pos').value.trim();
  const addrField = document.getElementById('custaddr-pos');
  const addr = addrField ? addrField.value.trim() : '';
  const notes = document.getElementById('custnotes-pos').value.trim();
  if (!orderCtx.cart.length){ showToast('Add items to the order first'); return; }
  if (orderCtx.orderType === 'delivery' && !addr){ showToast('Delivery address is required'); return; }
  const totals = computeTotals(orderCtx.cart, orderCtx.tip);
  if (orderCtx.payMethod === 'cash' && !orderCtx.editingOrderId){
    const tenderedField = document.getElementById('tendered-pos');
    const tendered = parseFloat((tenderedField && tenderedField.value) || '0');
    if (!tendered || tendered < totals.total){ showToast('Cash tendered must cover the total'); return; }
  }
  const submitBtn = document.getElementById('submit-pos');
  submitBtn.disabled = true;
  const di = orderCtx.deliveryInfo;
  const payload = {
    source: 'pos',
    customerName: name || 'Walk-in',
    phone,
    address: orderCtx.orderType === 'delivery' ? addr : '',
    notes,
    orderType: orderCtx.orderType,
    payMethod: orderCtx.payMethod,
    items: orderCtx.cart.map(l => ({ name:l.name, size:l.size||'', unitPrice:l.unitPrice, qty:l.qty, notes:l.notes||'' })),
    subtotal: totals.subtotal, tax: totals.tax, tip: totals.tip, total: totals.total,
    deliveryMiles: (orderCtx.orderType === 'delivery' && di && di.miles != null) ? di.miles : null,
    deliveryEtaMins: (orderCtx.orderType === 'delivery' && di && di.minutes != null) ? di.minutes : null,
  };
  if (orderCtx.editingOrderId){
    await updateOrder(orderCtx.editingOrderId, payload);
    showToast('Order updated');
    resetOrderCtx('pos');
    orderCtx.orderType = 'phone';
    renderPosQueue();
    return;
  }
  const ticket = await submitOrder(payload);
  if (!ticket){ submitBtn.disabled = false; return; }
  showToast('Order rung up, ticket ' + ticket);
  resetOrderCtx('pos');
  orderCtx.orderType = 'phone';
  renderOrderLayout('pos');
}

/* ---- POS: manage current orders (flat live queue) ---- */
function renderPosQueue(){
  stopAllSubscriptions();
  const view = document.getElementById('view-pos');
  view.innerHTML = `
    <div style="padding:18px 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="btn-ghost" id="backToPosBtn" type="button">&larr; Back to POS</button>
          <h3 style="font-size:22px; margin:0;">Current Orders</h3>
        </div>
        <button class="btn btn-outline" id="newOrderFromQueue" type="button">+ New Order</button>
      </div>
      <div class="me-card" style="margin-bottom:18px; max-width:460px;">
        <div class="me-card-title">Reprint an Order</div>
        <div style="font-size:12px; color:var(--paper-dim); margin-bottom:8px;">Works for any order, not just what's still active below -- yesterday's ticket included.</div>
        <div style="display:flex; gap:8px;">
          <input id="reprint-ticket-input" placeholder="Ticket # (e.g. T004821)" style="flex:1; background:var(--ink-soft); border:1.5px solid var(--line-on-ink); border-radius:8px; color:var(--paper); padding:9px 11px; font-size:13.5px; font-family:inherit;">
          <button class="btn btn-outline" id="reprint-search-btn" type="button">Find</button>
        </div>
        <div id="reprint-result" style="margin-top:10px;"></div>
      </div>
      <div id="pos-queue-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>`;
  document.getElementById('newOrderFromQueue').addEventListener('click', initPosView);
  document.getElementById('backToPosBtn').addEventListener('click', backToPosView);
  document.getElementById('reprint-search-btn').addEventListener('click', reprintLookup);
  document.getElementById('reprint-ticket-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') reprintLookup(); });
  const list = document.getElementById('pos-queue-list');
  if (!App.db){
    list.innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>';
    return;
  }
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      const active = docs.filter(o => o.status !== 'completed' && o.status !== 'cancelled');
      function draw(){
        list.innerHTML = active.length ? active.map(renderQueueRow).join('') : '<div class="cart-empty">No active orders right now.</div>';
        active.forEach(o => {
          const advanceBtn = document.getElementById(`queue-advance-${o.id}`);
          if (advanceBtn) advanceBtn.addEventListener('click', () => {
            const next = nextStatus(o);
            if (next) updateOrder(o.id, { status: next });
          });
          const editBtn = document.getElementById(`queue-edit-${o.id}`);
          if (editBtn) editBtn.addEventListener('click', () => editOrderInPos(o));
          const printBtn = document.getElementById(`queue-print-${o.id}`);
          if (printBtn) printBtn.addEventListener('click', () => requestPrint(o));
          const cancelBtn = document.getElementById(`queue-cancel-${o.id}`);
          if (cancelBtn) cancelBtn.addEventListener('click', () => {
            showConfirmModal({
              title: `Cancel order ${o.ticket || ''}?`,
              body: `This marks the order cancelled for ${o.customerName || 'this customer'} (${money(o.total||0)}). This can't be undone from here.`,
              confirmLabel: 'Cancel Order',
              danger: true,
              withReason: true,
              reasonPlaceholder: 'Why is this being cancelled? (optional, shown in order history)',
              onConfirm: (reason) => {
                updateOrder(o.id, { status:'cancelled', cancelReason: reason || null });
                showToast(`Order ${o.ticket || ''} cancelled`);
              },
            });
          });
        });
      }
      draw();
      // Regulars badges draw once immediately against whatever
      // RegularsIndex already has (usually already warm from a previous
      // tick), then again once this tick's RPC actually resolves --
      // buildRegularsIndex() is fire-and-forget, so without this the
      // very first draw after a fresh sign-in would always show against
      // an empty index and never correct itself until the next order
      // change happened to trigger another snapshot tick.
      buildRegularsIndex().then(draw);
    }, () => { list.innerHTML = '<div class="cart-empty">Could not load live orders.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    list.innerHTML = '<div class="cart-empty">Could not load live orders.</div>';
  }
}

/* Returns to the POS entry screen without discarding whatever order the
   staff member was already building — only initPosView() (the "+ New
   Order" button) resets the cart. This is what "Back to POS" is for:
   peek at the live queue, then pick right back up. */
function backToPosView(){
  stopAllSubscriptions();
  if (!orderCtx || orderCtx.mode !== 'pos'){
    initPosView();
    return;
  }
  renderOrderLayout('pos');
}

/* Loads an existing order's items back into the POS cart so staff can
   change it, then saves over the same order instead of creating a new
   one. Only offered for orders still in 'new' status — once the
   kitchen has started on it, changing the ticket without them knowing
   causes more problems than it solves; cancel and re-ring it instead. */
function editOrderInPos(o){
  stopAllSubscriptions();
  resetOrderCtx('pos');
  orderCtx.editingOrderId = o.id;
  orderCtx.cart = (o.items || []).map(it => ({
    _key: Math.random().toString(36).slice(2),
    name: it.name, size: it.size || '', unitPrice: it.unitPrice, qty: it.qty, notes: it.notes || '',
  }));
  orderCtx.orderType = o.orderType || 'phone';
  orderCtx.payMethod = o.payMethod || 'cash';
  orderCtx.tip = o.tip || 0;
  renderOrderLayout('pos');
  const nameEl = document.getElementById('custname-pos'); if (nameEl) nameEl.value = o.customerName || '';
  const phoneEl = document.getElementById('custphone-pos'); if (phoneEl) phoneEl.value = o.phone || '';
  const addrEl = document.getElementById('custaddr-pos'); if (addrEl) addrEl.value = o.address || '';
  const notesEl = document.getElementById('custnotes-pos'); if (notesEl) notesEl.value = o.notes || '';
  const submitBtn = document.getElementById('submit-pos');
  if (submitBtn) submitBtn.textContent = `Save Changes to ${o.ticket || 'Order'}`;
  showToast(`Editing order ${o.ticket || ''} — changes save to this ticket`);
}

function renderQueueRow(o){
  const next = nextStatus(o);
  return `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span>
    <span class="status-chip status-${o.status}">${escapeHtml(statusName(o.status))}</span>
    <span style="font-size:12.5px; color:var(--paper-dim); text-transform:capitalize;">${escapeHtml(o.orderType||'')}</span>
    <span style="flex:1; min-width:120px; font-size:13px;">${escapeHtml(o.customerName||'')}${regularBadgeHtml(o.phone)}</span>
    <span class="mono" style="font-weight:600;">${money(o.total||0)}${o.tip ? `<span style="color:var(--gold); font-weight:400;"> (+${money(o.tip)} tip)</span>` : ''}</span>
    <span style="font-size:11.5px; color:var(--paper-dim);">${timeAgo(o.createdAt)}</span>
    ${(o.status==='new') ? `<button class="btn-ghost" id="queue-edit-${o.id}" type="button">Edit</button>` : ''}
    <button class="btn-ghost" id="queue-print-${o.id}" type="button">Print</button>
    ${next ? `<button class="btn btn-outline" style="padding:6px 12px; font-size:12px;" id="queue-advance-${o.id}" type="button">${escapeHtml(statusLabel(next))}</button>` : ''}
    ${(o.status!=='out_for_delivery') ? `<button class="btn-ghost" id="queue-cancel-${o.id}" type="button">Cancel</button>` : ''}
  </div>`;
}
</script>

<script>
/* =========================================================================
   KITCHEN BOARD (live current-orders view)
   ========================================================================= */
const KITCHEN_STATUSES = ['new','preparing','ready','out_for_delivery'];
const SCHEDULED_KITCHEN_WINDOW_MS = 45 * 60 * 1000; // a scheduled order joins the live queue 45 min out
const KITCHEN_COL_LABELS = { new:'New', preparing:'Preparing', ready:'Ready', out_for_delivery:'Out for Delivery' };

function statusName(s){
  return ({ new:'New', preparing:'Preparing', ready:'Ready', out_for_delivery:'Out for Delivery', completed:'Completed', cancelled:'Cancelled' })[s] || s;
}
function statusLabel(s){
  return ({ new:'New', preparing:'Start Preparing', ready:'Mark Ready', out_for_delivery:'Send Out for Delivery', completed:'Mark Completed', cancelled:'Cancelled' })[s] || s;
}
/* For a delivery order, "ready" is the last step the kitchen board drives:
   from there, a driver claims it on the Driver App (which sets status to
   out_for_delivery and assigns the driver), so there is no further button
   here. Pickup/phone/walkin orders go straight from ready to completed at
   the counter, with no driver hand-off involved. */
function nextStatus(o){
  if (o.status === 'new') return 'preparing';
  if (o.status === 'preparing') return 'ready';
  if (o.status === 'ready' && o.orderType !== 'delivery') return 'completed';
  return null;
}

let kitchenActiveDrivers = [];

/* New-order sound + badge: a counter person who isn't staring at the
   screen needs to *hear* a new order land, and see a count of what they
   missed. Scoped to however long Kitchen Board is the active screen --
   the live subscription itself (and everything below) already stops on
   any role switch (stopAllSubscriptions()), so this doesn't ring in the
   background from a different Staff Hub screen. */
let kitchenSeenOrderIds = new Set();
let kitchenFirstSnapshot = true;
let kitchenUnseenCount = 0;
let kitchenAudioCtx = null;
const KITCHEN_ORIGINAL_TITLE = document.title;

function getKitchenAudioCtx(){
  if (kitchenAudioCtx) return kitchenAudioCtx;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  try{ kitchenAudioCtx = new AudioCtx(); }catch(e){ kitchenAudioCtx = null; }
  return kitchenAudioCtx;
}

function playNewOrderChime(){
  // Synthesized, not a sourced sound file -- no licensing question, and
  // genuinely enough for a "new order" alert (see ROADMAP.md's research
  // note on this). Two ascending notes, like a soft doorbell.
  const ctx = getKitchenAudioCtx();
  if (!ctx) return;
  try{
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    [[880, 0, 0.16], [1175, 0.13, 0.24]].forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + start);
      gain.gain.exponentialRampToValueAtTime(0.28, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + dur + 0.05);
    });
  }catch(e){ /* badge/title still show the new order either way */ }
}

function updateKitchenBadge(){
  const badge = document.getElementById('kitchen-new-badge');
  if (badge){
    badge.textContent = String(kitchenUnseenCount);
    badge.hidden = kitchenUnseenCount === 0;
  }
  document.title = kitchenUnseenCount > 0 ? `(${kitchenUnseenCount}) ${KITCHEN_ORIGINAL_TITLE}` : KITCHEN_ORIGINAL_TITLE;
}

function clearKitchenBadge(){
  kitchenUnseenCount = 0;
  updateKitchenBadge();
}

// Coming back to the tab is the natural "I've seen it now" signal for
// someone who stepped away -- reset next time Kitchen Board has
// something to reset, harmless no-op otherwise.
window.addEventListener('focus', clearKitchenBadge);

function initKitchenView(){
  stopAllSubscriptions();
  kitchenSeenOrderIds = new Set();
  kitchenFirstSnapshot = true;
  clearKitchenBadge();
  const view = document.getElementById('view-kitchen');
  view.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:10px;">
        <h2 style="font-size:26px;">Current Orders</h2>
        <button type="button" id="kitchen-new-badge" class="kitchen-new-badge" hidden title="New orders since you last looked -- click to clear"></button>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <button type="button" id="kitchen-pause-badge" class="kitchen-pause-badge"></button>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--paper-dim);">Updates live</span>
      </div>
    </div>
    <div id="upcoming-scheduled-root"></div>
    <div class="kanban" id="kanban-root"></div>`;
  document.getElementById('kitchen-new-badge').addEventListener('click', clearKitchenBadge);
  if (App.db) loadStoreSettings(App.db).then(renderKitchenPauseBadge);
  renderKitchenPauseBadge();
  if (!App.db){
    document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Not connected to the live order database.</div>';
    return;
  }
  kitchenActiveDrivers = [];
  if (App.isAdmin){
    // For the "Assign driver" dropdown below -- lets a manager hand a
    // delivery straight to a driver instead of waiting for someone to
    // self-claim it from the Driver App. Fetched once per visit to this
    // screen, not live-subscribed: the roster doesn't change minute to
    // minute, and re-opening Kitchen Board picks up any changes.
    App.db.collection('drivers').get().then(snap => {
      kitchenActiveDrivers = (snap.docs || [])
        .map(d => Object.assign({ id: d.id }, d.data() || {}))
        .filter(d => d.approved && d.active)
        .sort((a,b) => (a.name||'').localeCompare(b.name||''));
      renderKanban(latestOrders); // the orders snapshot may have already
        // rendered once with an empty driver list if this fetch was slower
    }).catch(() => { kitchenActiveDrivers = []; });
  }
  let latestOrders = [];
  let kitchenEligibleAll = []; // unfiltered by the scheduled-order split -- re-split every tick below, not just on a new snapshot
  const isFarOutScheduled = (o) => o.scheduledFor && o.scheduledFor > Date.now() + SCHEDULED_KITCHEN_WINDOW_MS;
  function splitAndRenderKitchen(){
    latestOrders = kitchenEligibleAll.filter(o => !isFarOutScheduled(o));
    renderKanban(latestOrders);
    renderUpcomingScheduled(kitchenEligibleAll.filter(isFarOutScheduled));
  }
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','asc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      // Ding + badge for tickets that just arrived as 'new' since the
      // last snapshot -- not on the first fetch (everything already
      // sitting in 'new' when you open Kitchen Board isn't "new"), and
      // not on every status change (advancing a ticket yourself
      // shouldn't ring the new-order bell). A scheduled order (Phase 8)
      // that's still well out from its requested time doesn't ring the
      // chime the moment it's placed the way a real right-now order
      // does -- see splitAndRenderKitchen above for where it actually
      // joins the live queue.
      const freshlyNew = docs.filter(o => o.status === 'new' && !kitchenSeenOrderIds.has(o.id) && !isFarOutScheduled(o));
      docs.forEach(o => kitchenSeenOrderIds.add(o.id));
      if (!kitchenFirstSnapshot && freshlyNew.length){
        playNewOrderChime();
        kitchenUnseenCount += freshlyNew.length;
        updateKitchenBadge();
      }
      kitchenFirstSnapshot = false;
      kitchenEligibleAll = docs.filter(o => KITCHEN_STATUSES.includes(o.status));
      splitAndRenderKitchen();
      // See the same pattern in renderPosQueue -- buildRegularsIndex()
      // is fire-and-forget, so redraw once it actually resolves rather
      // than only showing Regular badges correctly starting on
      // whichever later snapshot tick happens to come along next.
      buildRegularsIndex().then(() => renderKanban(latestOrders));
    }, () => {
      document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Could not load live orders.</div>';
    });
    App.unsub.push(unsub);
  }catch(e){
    document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Could not load live orders.</div>';
    return;
  }
  // Also re-splits (not just re-renders) on every tick -- a scheduled
  // order crossing the 45-minute threshold needs to move from
  // "Upcoming" into the live queue purely because time passed, which a
  // Realtime subscription (fires only on actual row changes) would
  // never trigger on its own.
  const ageInterval = setInterval(splitAndRenderKitchen, 30000);
  App.unsub.push(() => clearInterval(ageInterval));
}

/* Read-only -- no advance/assign/cancel actions here on purpose. These
   orders don't need kitchen attention yet; they just shouldn't be a
   total surprise when they do. Sorted soonest-first. */
function renderUpcomingScheduled(orders){
  const root = document.getElementById('upcoming-scheduled-root');
  if (!root) return;
  if (!orders.length){ root.innerHTML = ''; return; }
  const sorted = [...orders].sort((a,b) => (a.scheduledFor||0) - (b.scheduledFor||0));
  root.innerHTML = `
    <div class="me-card" style="margin-bottom:18px;">
      <div class="me-card-title">Upcoming Scheduled Orders (${sorted.length})</div>
      <div style="font-size:12px; color:var(--paper-dim); margin-bottom:10px;">Not in the queue yet -- each joins it automatically 45 minutes before its time.</div>
      ${sorted.map(o => `
        <div class="row-between" style="padding:7px 0; border-bottom:1px solid var(--line-on-ink); font-size:13px;">
          <span><span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span> ${escapeHtml(o.customerName||'')}</span>
          <span class="mono" style="color:var(--gold);">${escapeHtml(new Date(o.scheduledFor).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }))}</span>
        </div>`).join('')}
    </div>`;
}

function renderKanban(orders){
  const root = document.getElementById('kanban-root');
  if (!root) return;
  root.innerHTML = KITCHEN_STATUSES.map(status => {
    const col = orders.filter(o => o.status === status);
    return `<div class="kanban-col">
      <h4><span>${KITCHEN_COL_LABELS[status]}</span><span class="mono">${col.length}</span></h4>
      ${col.length ? col.map(renderTicket).join('') : '<div class="kanban-empty">Nothing here.</div>'}
    </div>`;
  }).join('');
  orders.forEach(o => {
    const btn = document.getElementById(`ticket-advance-${o.id}`);
    if (btn) btn.addEventListener('click', () => {
      const next = nextStatus(o);
      if (next) updateOrder(o.id, { status: next });
    });
    const assignBtn = document.getElementById(`assign-driver-btn-${o.id}`);
    if (assignBtn) assignBtn.addEventListener('click', () => {
      const select = document.getElementById(`assign-driver-${o.id}`);
      const driverId = select && select.value;
      const driver = kitchenActiveDrivers.find(d => d.id === driverId);
      if (!driver) return;
      assignBtn.disabled = true;
      updateOrder(o.id, { status: 'out_for_delivery', driver: driver.name, driverId: driver.id })
        .then(() => showToast(`Assigned to ${driver.name}`))
        .catch(() => { assignBtn.disabled = false; showToast('Could not assign — try again'); });
    });
  });
}

function renderTicket(o){
  const ageMin = Math.floor((Date.now() - (o.createdAt||Date.now())) / 60000);
  let ageClass = '';
  if (ageMin >= 25) ageClass = 'age-bad'; else if (ageMin >= 15) ageClass = 'age-warn';
  const next = nextStatus(o);
  const needsDriver = o.status === 'ready' && o.orderType === 'delivery' && !o.driverId;
  let waitingBlock = '';
  if (o.status === 'out_for_delivery' && o.driver){
    waitingBlock = `<div class="age">Out for delivery with <b>${escapeHtml(o.driver)}</b></div>`;
  } else if (!next && needsDriver){
    if (App.isAdmin && kitchenActiveDrivers.length){
      waitingBlock = `<div class="age">Waiting for a driver &mdash; or assign one:</div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <select id="assign-driver-${o.id}" style="flex:1; font-size:12.5px; padding:6px;">
            ${kitchenActiveDrivers.map(d => `<option value="${d.id}">${escapeHtml(d.name||'Unnamed')}</option>`).join('')}
          </select>
          <button class="advance" id="assign-driver-btn-${o.id}" type="button" style="padding:6px 10px;">Assign</button>
        </div>`;
    } else if (App.isAdmin){
      waitingBlock = '<div class="age">Waiting for a driver to claim it (no active drivers on the roster to assign)</div>';
    } else {
      waitingBlock = '<div class="age">Waiting for a driver to claim it</div>';
    }
  }
  return `<div class="ticket ${ageClass}">
    <div class="top">
      <span class="num">${escapeHtml(o.ticket||'')}</span>
      <span class="type type-${o.orderType==='delivery'?'delivery':'pickup'}">${escapeHtml(o.orderType||'')}</span>
      ${o.scheduledFor ? `<span class="type" style="background:var(--gold); color:var(--ink);" title="Scheduled order">${escapeHtml(new Date(o.scheduledFor).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }))}</span>` : ''}
    </div>
    <div class="age">${ageMin} min old</div>
    <ul>${(o.items||[]).map(it => `<li><b>${it.qty}&times;</b> ${escapeHtml(lineLabel(it))}${it.notes ? ` &mdash; <i>${escapeHtml(it.notes)}</i>` : ''}</li>`).join('')}</ul>
    ${o.notes ? `<div class="who">Note: ${escapeHtml(o.notes)}</div>` : ''}
    <div class="who">${escapeHtml(o.customerName||'')}${regularBadgeHtml(o.phone)}${o.address ? ', ' + escapeHtml(o.address) : ''}</div>
    ${o.tip ? `<div class="tip-note">+${money(o.tip)} tip</div>` : ''}
    ${next ? `<button class="advance" id="ticket-advance-${o.id}" type="button">${escapeHtml(statusLabel(next))}</button>` : waitingBlock}
  </div>`;
}
</script>

<script>
/* =========================================================================
   ANALYTICS (today's numbers, top items, regular customers)
   ========================================================================= */
/* Today's stats, the 7-day trend, the timeline, and "top items" are
   computed client-side, but from a query bounded to the last 8 days
   (initAnalyticsView) rather than the whole orders table -- this used
   to fetch with no bound at all, which meant that once lifetime order
   history passed Supabase's default 1000-row select() cap, the oldest
   orders would silently drop out of every one of these numbers with no
   indication anything was wrong. An 8-day window will essentially never
   hit that cap for a single shop's order volume, so this makes the risk
   a non-issue instead of something that quietly got worse over time.
   "Regulars" needs real lifetime history to mean anything (a repeat
   customer's visits are often spread out well past 8 days), so that one
   genuinely can't be derived from this bounded fetch -- it's backed by
   regulars_summary() instead, a real SQL aggregate in
   supabase/schema.sql, called via .rpc(). Everything else here stays a
