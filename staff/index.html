function wireCategoryBar(mode){
  const bar = document.getElementById(`catbar-${mode}`);
  bar.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bar.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      const cat = btn.getAttribute('data-cat');
      document.querySelectorAll(`#menupane-${mode} .menu-section`).forEach(sec=>{
        sec.hidden = !(cat==='all' || sec.getAttribute('data-section')===cat);
      });
    });
  });
}
function wireItemButtons(mode){
  document.querySelectorAll(`#menupane-${mode} [data-add-cat]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = CATEGORIES.find(c=>c.key===btn.getAttribute('data-add-cat'));
      const it = cat.items[+btn.getAttribute('data-add-idx')];
      addLine({ name: it.name, size: it.size||'', unitPrice: it.price, qty:1, notes:'' });
      showToast(it.name+' added');
    });
  });
}
function renderSpecialtyPizzas(mode){
  const el = document.getElementById(`specialty-${mode}`);
  let html='';
  SPECIALTY_PIZZAS.forEach((p,pi)=>{
    p.sizes.forEach((s,si)=>{
      html += `<button type="button" class="item-card" data-sp="${pi}" data-ss="${si}">
        <span><span class="n">${escapeHtml(p.name)}</span><span class="s">${escapeHtml(s.label)}</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span class="p">${money(s.price)}</span><span class="plus">+</span></span>
      </button>`;
    });
  });
  el.innerHTML = html;
}
function wireSpecialtyButtons(mode){
  document.querySelectorAll(`#specialty-${mode} [data-sp]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = SPECIALTY_PIZZAS[+btn.getAttribute('data-sp')];
      const s = p.sizes[+btn.getAttribute('data-ss')];
      addLine({ name:p.name, size:s.label, unitPrice:s.price, qty:1, notes:'' });
      showToast(p.name+' added');
    });
  });
}
function renderPizzaBuilder(mode){
  const sizeRow = document.getElementById(`sizerow-${mode}`);
  sizeRow.innerHTML = PIZZA_SIZES.map(s => `<button type="button" class="size-opt" data-size="${s.key}" aria-pressed="${orderCtx.pizzaSize===s.key}"><div class="n">${s.label}</div><div class="p">${money(s.base)} + ${money(s.perTopping)}/topping</div></button>`).join('');
  sizeRow.querySelectorAll('.size-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{ orderCtx.pizzaSize = btn.getAttribute('data-size'); renderPizzaBuilder(mode); });
  });
  const topRow = document.getElementById(`toppingrow-${mode}`);
  topRow.innerHTML = TOPPINGS.map(t => `<button type="button" class="topping-chip" data-t="${escapeHtml(t)}" aria-pressed="${orderCtx.pizzaToppings.has(t)}">${escapeHtml(t)}</button>`).join('');
  topRow.querySelectorAll('.topping-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.getAttribute('data-t');
      if (orderCtx.pizzaToppings.has(t)) orderCtx.pizzaToppings.delete(t); else orderCtx.pizzaToppings.add(t);
      renderPizzaBuilder(mode);
    });
  });
  const sizeObj = PIZZA_SIZES.find(s=>s.key===orderCtx.pizzaSize);
  const total = sizeObj.base + sizeObj.perTopping*orderCtx.pizzaToppings.size;
  document.getElementById(`buildertotal-${mode}`).textContent = money(total);
  document.getElementById(`addpizza-${mode}`).onclick = () => {
    const toppingsArr = Array.from(orderCtx.pizzaToppings);
    addLine({
      name: sizeObj.label.replace(/\s*\(.+\)$/,'') + ' Pizza',
      size: sizeObj.label,
      unitPrice: total,
      qty: 1,
      notes: toppingsArr.length ? toppingsArr.join(', ') : '',
    });
    orderCtx.pizzaToppings = new Set();
    renderPizzaBuilder(mode);
    showToast('Pizza added');
  };
}

function wireSeg(segId, stateKey, onChange){
  const seg = document.getElementById(segId);
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      orderCtx[stateKey] = btn.getAttribute('data-v');
      if (onChange) onChange(orderCtx[stateKey]);
    });
  });
}

function updateChangeDue(mode, total){
  const row = document.getElementById(`changerow-${mode}`);
  if (!row) return;
  if (orderCtx.payMethod!=='cash'){ row.innerHTML=''; return; }
  const tenderedInput = document.getElementById(`tendered-${mode}`);
  const tendered = tenderedInput ? parseFloat(tenderedInput.value||'0') : 0;
  if (!tendered){ row.innerHTML = ''; return; }
  row.innerHTML = `<span>Change Due</span><span class="mono">${money(Math.max(0,tendered-total))}</span>`;
}

function renderCart(mode){
  if (!mode) return;
  const wrap = document.getElementById(`cartitems-${mode}`);
  if (!wrap) return;
  if (!orderCtx.cart.length){
    wrap.innerHTML = `<div class="cart-empty">Nothing in the order yet.<br>Tap items on the left to add them.</div>`;
  } else {
    wrap.innerHTML = orderCtx.cart.map(l => `
      <div class="cart-line">
        <div style="flex:1;">
          <div class="n">${escapeHtml(lineLabel(l))}</div>
          ${l.notes ? `<div class="meta">${escapeHtml(l.notes)}</div>` : ''}
          <div class="qty" style="margin-top:6px;">
            <button type="button" class="qty-btn" data-key="${escapeHtml(l._key)}" data-d="-1">&minus;</button>
            <span class="mono">${l.qty}</span>
            <button type="button" class="qty-btn" data-key="${escapeHtml(l._key)}" data-d="1">+</button>
          </div>
        </div>
        <div class="p">${money(l.unitPrice*l.qty)}</div>
      </div>`).join('');
    wrap.querySelectorAll('.qty-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> changeQty(btn.getAttribute('data-key'), +btn.getAttribute('data-d')));
    });
  }
  if (orderCtx.tipPct != null){
    const rawSubtotal = orderCtx.cart.reduce((s,it)=> s + it.unitPrice*it.qty, 0);
    orderCtx.tip = Math.round(rawSubtotal * orderCtx.tipPct * 100) / 100;
  }
  const totals = computeTotals(orderCtx.cart, orderCtx.tip);
  document.getElementById(`subtotal-${mode}`).textContent = money(totals.subtotal);
  document.getElementById(`tax-${mode}`).textContent = money(totals.tax);
  const tipRow = document.getElementById(`tiprow-${mode}`);
  const tipAmountEl = document.getElementById(`tipamount-${mode}`);
  if (tipRow && tipAmountEl){
    tipRow.hidden = totals.tip <= 0;
    tipAmountEl.textContent = money(totals.tip);
  }
  document.getElementById(`total-${mode}`).textContent = money(totals.total);
  if (mode==='pos') updateChangeDue(mode, totals.total);
  const submitBtn = document.getElementById(`submit-${mode}`);
  if (submitBtn) submitBtn.disabled = orderCtx.cart.length===0;
}
</script>

<script>
/* =========================================================================
   CUSTOMER KIOSK + STAFF POS: view setup and submit
   ========================================================================= */
function renderOrderLayout(mode){
  const view = document.getElementById(mode==='customer' ? 'view-customer' : 'view-pos');
  view.innerHTML = `
    <div class="order-layout">
      <div class="order-menu-pane" id="menupane-${mode}"></div>
      <div class="order-cart-pane" id="cartpane-${mode}"></div>
    </div>`;
  document.getElementById(`menupane-${mode}`).innerHTML = buildMenuPaneHTML(mode);
  document.getElementById(`cartpane-${mode}`).innerHTML = buildCartPaneHTML(mode);
  wireCategoryBar(mode);
  wireItemButtons(mode);
  renderSpecialtyPizzas(mode);
  wireSpecialtyButtons(mode);
  renderPizzaBuilder(mode);
  wireSeg(`ordertype-${mode}`, 'orderType', (v) => {
    const addrGroup = document.getElementById(`addrgroup-${mode}`);
    if (addrGroup) addrGroup.hidden = (v !== 'delivery');
    const tipLabel = document.getElementById(`tiplabel-${mode}`);
    if (tipLabel) tipLabel.textContent = v === 'delivery' ? 'Add a Tip for Your Driver' : 'Add a Tip for the Counter';
  });
  const addrInput = document.getElementById(`custaddr-${mode}`);
  const addrInfo = document.getElementById(`addrinfo-${mode}`);
  if (addrInput && addrInfo && typeof wireDeliveryLookup === 'function'){
    wireDeliveryLookup(addrInput, addrInfo, (result) => {
      orderCtx.deliveryInfo = result;
    });
  }
  const tipSeg = document.getElementById(`tipseg-${mode}`);
  const tipCustom = document.getElementById(`tipcustom-${mode}`);
  if (tipSeg){
    tipSeg.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', () => {
        tipSeg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
        btn.setAttribute('aria-pressed','true');
        const v = btn.getAttribute('data-v');
        const subtotal = computeTotals(orderCtx.cart, 0).subtotal;
        if (v === 'custom'){
          tipCustom.hidden = false;
          tipCustom.focus();
          orderCtx.tip = Number(tipCustom.value) || 0;
          orderCtx.tipPct = null;
        } else {
          tipCustom.hidden = true;
          orderCtx.tipPct = Number(v);
          orderCtx.tip = Math.round(subtotal * Number(v) * 100) / 100;
        }
        renderCart(mode);
      });
    });
  }
  if (tipCustom){
    tipCustom.addEventListener('input', () => {
      orderCtx.tip = Number(tipCustom.value) || 0;
      orderCtx.tipPct = null;
      renderCart(mode);
    });
  }
  wireSeg(`paymethod-${mode}`, 'payMethod', () => {
    if (mode === 'pos'){
      const cashGroup = document.getElementById(`cashgroup-${mode}`);
      if (cashGroup) cashGroup.hidden = (orderCtx.payMethod !== 'cash');
      renderCart(mode);
    }
  });
  if (mode === 'pos'){
    const tenderedInput = document.getElementById(`tendered-${mode}`);
    if (tenderedInput) tenderedInput.addEventListener('input', () => renderCart(mode));
    const queueBtn = document.getElementById(`viewqueue-${mode}`);
    if (queueBtn) queueBtn.addEventListener('click', () => renderPosQueue());
  }
  const banner = document.getElementById(`todaybanner-${mode}`);
  if (banner){
    banner.addEventListener('click', () => {
      const today = SPECIALS_BY_DAY[new Date().getDay()];
      addLine({ name: today.name, size:'', unitPrice: today.price, qty:1, notes:'Daily special' });
      showToast(today.name + ' added');
    });
  }
  const submitBtn = document.getElementById(`submit-${mode}`);
  submitBtn.addEventListener('click', () => mode === 'customer' ? submitCustomerOrder() : submitPosOrder());
  renderCart(mode);
}

function initCustomerView(){
  stopAllSubscriptions();
  resetOrderCtx('customer');
  orderCtx.orderType = 'pickup';
  renderOrderLayout('customer');
}

async function submitCustomerOrder(){
  const name = document.getElementById('custname-customer').value.trim();
  const phone = document.getElementById('custphone-customer').value.trim();
  const addrField = document.getElementById('custaddr-customer');
  const addr = addrField ? addrField.value.trim() : '';
  const notes = document.getElementById('custnotes-customer').value.trim();
  if (!orderCtx.cart.length){ showToast('Your order is empty'); return; }
  if (!name || !phone){ showToast('Please add your name and phone number'); return; }
  if (orderCtx.orderType === 'delivery' && !addr){ showToast('Please add a delivery address'); return; }
  const totals = computeTotals(orderCtx.cart);
  const submitBtn = document.getElementById('submit-customer');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Placing order...';
  const ticket = await submitOrder({
    source: 'customer',
    customerName: name,
    phone,
    address: orderCtx.orderType === 'delivery' ? addr : '',
    notes,
    orderType: orderCtx.orderType,
    payMethod: orderCtx.payMethod,
    items: orderCtx.cart.map(l => ({ name:l.name, size:l.size||'', unitPrice:l.unitPrice, qty:l.qty, notes:l.notes||'' })),
    subtotal: totals.subtotal, tax: totals.tax, total: totals.total,
  });
  if (!ticket){
    submitBtn.disabled = false;
    submitBtn.textContent = 'Place Order';
    return;
  }
  showOrderConfirmation(ticket, totals.total);
}

function showOrderConfirmation(ticket, total){
  const view = document.getElementById('view-customer');
  view.innerHTML = `
    <div class="confirm-wrap">
      <div class="confirm-card">
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold);">Order Placed</div>
        <div class="confirm-ticket">${escapeHtml(ticket)}</div>
        <div style="font-size:15px; color:var(--paper-dim); margin-top:6px;">Total due: <span class="mono" style="color:var(--paper); font-weight:700;">${money(total)}</span></div>
        <div style="font-size:13px; color:var(--paper-dim); margin-top:16px; line-height:1.5;">Thank you. Your ticket number is on the screen above. Pay in person when your order is ready or delivered.</div>
        <button class="btn btn-sauce" style="margin-top:24px;" id="newOrderBtn" type="button">Start a New Order</button>
      </div>
    </div>`;
  document.getElementById('newOrderBtn').addEventListener('click', initCustomerView);
}

function initPosView(){
  stopAllSubscriptions();
  resetOrderCtx('pos');
  orderCtx.orderType = 'phone';
  renderOrderLayout('pos');
}

async function submitPosOrder(){
  const name = document.getElementById('custname-pos').value.trim();
  const phone = document.getElementById('custphone-pos').value.trim();
  const addrField = document.getElementById('custaddr-pos');
  const addr = addrField ? addrField.value.trim() : '';
  const notes = document.getElementById('custnotes-pos').value.trim();
  if (!orderCtx.cart.length){ showToast('Add items to the order first'); return; }
  if (orderCtx.orderType === 'delivery' && !addr){ showToast('Delivery address is required'); return; }
  const totals = computeTotals(orderCtx.cart, orderCtx.tip);
  if (orderCtx.payMethod === 'cash' && !orderCtx.editingOrderId){
    const tenderedField = document.getElementById('tendered-pos');
    const tendered = parseFloat((tenderedField && tenderedField.value) || '0');
    if (!tendered || tendered < totals.total){ showToast('Cash tendered must cover the total'); return; }
  }
  const submitBtn = document.getElementById('submit-pos');
  submitBtn.disabled = true;
  const di = orderCtx.deliveryInfo;
  const payload = {
    source: 'pos',
    customerName: name || 'Walk-in',
    phone,
    address: orderCtx.orderType === 'delivery' ? addr : '',
    notes,
    orderType: orderCtx.orderType,
    payMethod: orderCtx.payMethod,
    items: orderCtx.cart.map(l => ({ name:l.name, size:l.size||'', unitPrice:l.unitPrice, qty:l.qty, notes:l.notes||'' })),
    subtotal: totals.subtotal, tax: totals.tax, tip: totals.tip, total: totals.total,
    deliveryMiles: (orderCtx.orderType === 'delivery' && di && di.miles != null) ? di.miles : null,
    deliveryEtaMins: (orderCtx.orderType === 'delivery' && di && di.minutes != null) ? di.minutes : null,
  };
  if (orderCtx.editingOrderId){
    await updateOrder(orderCtx.editingOrderId, payload);
    showToast('Order updated');
    resetOrderCtx('pos');
    orderCtx.orderType = 'phone';
    renderPosQueue();
    return;
  }
  const ticket = await submitOrder(payload);
  if (!ticket){ submitBtn.disabled = false; return; }
  showToast('Order rung up, ticket ' + ticket);
  resetOrderCtx('pos');
  orderCtx.orderType = 'phone';
  renderOrderLayout('pos');
}

/* ---- POS: manage current orders (flat live queue) ---- */
function renderPosQueue(){
  stopAllSubscriptions();
  const view = document.getElementById('view-pos');
  view.innerHTML = `
    <div style="padding:18px 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="btn-ghost" id="backToPosBtn" type="button">&larr; Back to POS</button>
          <h3 style="font-size:22px; margin:0;">Current Orders</h3>
        </div>
        <button class="btn btn-outline" id="newOrderFromQueue" type="button">+ New Order</button>
      </div>
      <div id="pos-queue-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>`;
  document.getElementById('newOrderFromQueue').addEventListener('click', initPosView);
  document.getElementById('backToPosBtn').addEventListener('click', backToPosView);
  const list = document.getElementById('pos-queue-list');
  if (!App.db){
    list.innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>';
    return;
  }
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      const active = docs.filter(o => o.status !== 'completed' && o.status !== 'cancelled');
      list.innerHTML = active.length ? active.map(renderQueueRow).join('') : '<div class="cart-empty">No active orders right now.</div>';
      active.forEach(o => {
        const advanceBtn = document.getElementById(`queue-advance-${o.id}`);
        if (advanceBtn) advanceBtn.addEventListener('click', () => {
          const next = nextStatus(o);
          if (next) updateOrder(o.id, { status: next });
        });
        const editBtn = document.getElementById(`queue-edit-${o.id}`);
        if (editBtn) editBtn.addEventListener('click', () => editOrderInPos(o));
        const cancelBtn = document.getElementById(`queue-cancel-${o.id}`);
        if (cancelBtn) cancelBtn.addEventListener('click', () => {
          showConfirmModal({
            title: `Cancel order ${o.ticket || ''}?`,
            body: `This marks the order cancelled for ${o.customerName || 'this customer'} (${money(o.total||0)}). This can't be undone from here.`,
            confirmLabel: 'Cancel Order',
            danger: true,
            withReason: true,
            reasonPlaceholder: 'Why is this being cancelled? (optional, shown in order history)',
            onConfirm: (reason) => {
              updateOrder(o.id, { status:'cancelled', cancelReason: reason || null });
              showToast(`Order ${o.ticket || ''} cancelled`);
            },
          });
        });
      });
    }, () => { list.innerHTML = '<div class="cart-empty">Could not load live orders.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    list.innerHTML = '<div class="cart-empty">Could not load live orders.</div>';
  }
}

/* Returns to the POS entry screen without discarding whatever order the
   staff member was already building — only initPosView() (the "+ New
   Order" button) resets the cart. This is what "Back to POS" is for:
   peek at the live queue, then pick right back up. */
function backToPosView(){
  stopAllSubscriptions();
  if (!orderCtx || orderCtx.mode !== 'pos'){
    initPosView();
    return;
  }
  renderOrderLayout('pos');
}

/* Loads an existing order's items back into the POS cart so staff can
   change it, then saves over the same order instead of creating a new
   one. Only offered for orders still in 'new' status — once the
   kitchen has started on it, changing the ticket without them knowing
   causes more problems than it solves; cancel and re-ring it instead. */
function editOrderInPos(o){
  stopAllSubscriptions();
  resetOrderCtx('pos');
  orderCtx.editingOrderId = o.id;
  orderCtx.cart = (o.items || []).map(it => ({
    _key: Math.random().toString(36).slice(2),
    name: it.name, size: it.size || '', unitPrice: it.unitPrice, qty: it.qty, notes: it.notes || '',
  }));
  orderCtx.orderType = o.orderType || 'phone';
  orderCtx.payMethod = o.payMethod || 'cash';
  orderCtx.tip = o.tip || 0;
  renderOrderLayout('pos');
  const nameEl = document.getElementById('custname-pos'); if (nameEl) nameEl.value = o.customerName || '';
  const phoneEl = document.getElementById('custphone-pos'); if (phoneEl) phoneEl.value = o.phone || '';
  const addrEl = document.getElementById('custaddr-pos'); if (addrEl) addrEl.value = o.address || '';
  const notesEl = document.getElementById('custnotes-pos'); if (notesEl) notesEl.value = o.notes || '';
  const submitBtn = document.getElementById('submit-pos');
  if (submitBtn) submitBtn.textContent = `Save Changes to ${o.ticket || 'Order'}`;
  showToast(`Editing order ${o.ticket || ''} — changes save to this ticket`);
}

function renderQueueRow(o){
  const next = nextStatus(o);
  return `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span>
    <span class="status-chip status-${o.status}">${escapeHtml(statusName(o.status))}</span>
    <span style="font-size:12.5px; color:var(--paper-dim); text-transform:capitalize;">${escapeHtml(o.orderType||'')}</span>
    <span style="flex:1; min-width:120px; font-size:13px;">${escapeHtml(o.customerName||'')}</span>
    <span class="mono" style="font-weight:600;">${money(o.total||0)}${o.tip ? `<span style="color:var(--gold); font-weight:400;"> (+${money(o.tip)} tip)</span>` : ''}</span>
    <span style="font-size:11.5px; color:var(--paper-dim);">${timeAgo(o.createdAt)}</span>
    ${(o.status==='new') ? `<button class="btn-ghost" id="queue-edit-${o.id}" type="button">Edit</button>` : ''}
    ${next ? `<button class="btn btn-outline" style="padding:6px 12px; font-size:12px;" id="queue-advance-${o.id}" type="button">${escapeHtml(statusLabel(next))}</button>` : ''}
    ${(o.status!=='out_for_delivery') ? `<button class="btn-ghost" id="queue-cancel-${o.id}" type="button">Cancel</button>` : ''}
  </div>`;
}
</script>

<script>
/* =========================================================================
   KITCHEN BOARD (live current-orders view)
   ========================================================================= */
const KITCHEN_STATUSES = ['new','preparing','ready','out_for_delivery'];
const KITCHEN_COL_LABELS = { new:'New', preparing:'Preparing', ready:'Ready', out_for_delivery:'Out for Delivery' };

function statusName(s){
  return ({ new:'New', preparing:'Preparing', ready:'Ready', out_for_delivery:'Out for Delivery', completed:'Completed', cancelled:'Cancelled' })[s] || s;
}
function statusLabel(s){
  return ({ new:'New', preparing:'Start Preparing', ready:'Mark Ready', out_for_delivery:'Send Out for Delivery', completed:'Mark Completed', cancelled:'Cancelled' })[s] || s;
}
/* For a delivery order, "ready" is the last step the kitchen board drives:
   from there, a driver claims it on the Driver App (which sets status to
   out_for_delivery and assigns the driver), so there is no further button
   here. Pickup/phone/walkin orders go straight from ready to completed at
   the counter, with no driver hand-off involved. */
function nextStatus(o){
  if (o.status === 'new') return 'preparing';
  if (o.status === 'preparing') return 'ready';
  if (o.status === 'ready' && o.orderType !== 'delivery') return 'completed';
  return null;
}

function initKitchenView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-kitchen');
  view.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;">
      <h2 style="font-size:26px;">Current Orders</h2>
      <span style="font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--paper-dim);">Updates live</span>
    </div>
    <div class="kanban" id="kanban-root"></div>`;
  if (!App.db){
    document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Not connected to the live order database.</div>';
    return;
  }
  let latestOrders = [];
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','asc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      latestOrders = docs.filter(o => KITCHEN_STATUSES.includes(o.status));
      renderKanban(latestOrders);
    }, () => {
      document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Could not load live orders.</div>';
    });
    App.unsub.push(unsub);
  }catch(e){
    document.getElementById('kanban-root').innerHTML = '<div class="kanban-empty">Could not load live orders.</div>';
    return;
  }
  const ageInterval = setInterval(() => renderKanban(latestOrders), 30000);
  App.unsub.push(() => clearInterval(ageInterval));
}

function renderKanban(orders){
  const root = document.getElementById('kanban-root');
  if (!root) return;
  root.innerHTML = KITCHEN_STATUSES.map(status => {
    const col = orders.filter(o => o.status === status);
    return `<div class="kanban-col">
      <h4><span>${KITCHEN_COL_LABELS[status]}</span><span class="mono">${col.length}</span></h4>
      ${col.length ? col.map(renderTicket).join('') : '<div class="kanban-empty">Nothing here.</div>'}
    </div>`;
  }).join('');
  orders.forEach(o => {
    const btn = document.getElementById(`ticket-advance-${o.id}`);
    if (btn) btn.addEventListener('click', () => {
      const next = nextStatus(o);
      if (next) updateOrder(o.id, { status: next });
    });
  });
}

function renderTicket(o){
  const ageMin = Math.floor((Date.now() - (o.createdAt||Date.now())) / 60000);
  let ageClass = '';
  if (ageMin >= 25) ageClass = 'age-bad'; else if (ageMin >= 15) ageClass = 'age-warn';
  const next = nextStatus(o);
  return `<div class="ticket ${ageClass}">
    <div class="top">
      <span class="num">${escapeHtml(o.ticket||'')}</span>
      <span class="type type-${o.orderType==='delivery'?'delivery':'pickup'}">${escapeHtml(o.orderType||'')}</span>
    </div>
    <div class="age">${ageMin} min old</div>
    <ul>${(o.items||[]).map(it => `<li><b>${it.qty}&times;</b> ${escapeHtml(lineLabel(it))}${it.notes ? ` &mdash; <i>${escapeHtml(it.notes)}</i>` : ''}</li>`).join('')}</ul>
    ${o.notes ? `<div class="who">Note: ${escapeHtml(o.notes)}</div>` : ''}
    <div class="who">${escapeHtml(o.customerName||'')}${o.address ? ', ' + escapeHtml(o.address) : ''}</div>
    ${o.tip ? `<div class="tip-note">+${money(o.tip)} tip</div>` : ''}
    ${next ? `<button class="advance" id="ticket-advance-${o.id}" type="button">${escapeHtml(statusLabel(next))}</button>`
      : (o.status === 'ready' && o.orderType === 'delivery' ? '<div class="age">Waiting for a driver to claim it</div>' : '')}
  </div>`;
}
</script>

<script>
/* =========================================================================
   ANALYTICS (today's numbers, top items, regular customers)
   ========================================================================= */
/* Everything here is computed client-side from the same live orders feed
   the other screens use — no separate reporting backend. That's fine at
   the order volumes a single pizza shop generates, but two limits are
   worth knowing:
     1. Supabase caps a plain select() at 1000 rows by default, so once
        lifetime order history passes that, the oldest orders silently
        drop out of these numbers. Today's stats are unaffected (there
        won't be 1000 orders in one day); "top items" and "regulars"
        will start under-counting history at that point.
     2. This recomputes from scratch on every order change, which is
        fine for hundreds of orders but would need a real SQL aggregate
        (a Postgres view, or a scheduled rollup table) if this ever
        needs to report over thousands of orders quickly.
   The fix for both, when it's needed: a Postgres function that does the
   aggregation in the database and returns just the summary numbers,
   called via Supabase's .rpc(). Worth doing once there's real volume;
   not worth the complexity before then. */

function startOfTodayMs(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.getTime();
}

function initAnalyticsView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-analytics');
  view.innerHTML = `
    <div style="padding:18px 20px; max-width:1000px; margin:0 auto;">
      <h2 style="font-size:26px; margin-bottom:4px;">Analytics</h2>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-bottom:18px;">Updates live &middot; based on the most recent orders</div>
      <div id="analytics-root">Loading...</div>
    </div>`;
  const root = document.getElementById('analytics-root');
  if (!App.db){
    root.innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>';
    return;
  }
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      renderAnalytics(docs, root);
    }, () => { root.innerHTML = '<div class="cart-empty">Could not load order history.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    root.innerHTML = '<div class="cart-empty">Could not load order history.</div>';
  }
}

function renderAnalytics(allOrders, root){
  const live = allOrders.filter(o => o.status !== 'cancelled');
  const today0 = startOfTodayMs();
  const todayOrders = live.filter(o => (o.createdAt||0) >= today0);
  const todayRevenue = todayOrders.reduce((s,o) => s + (o.total||0), 0);
  const todayTips = todayOrders.reduce((s,o) => s + (o.tip||0), 0);
  const avgTicket = todayOrders.length ? todayRevenue / todayOrders.length : 0;

  // Top items, by name+size, across whatever history this fetch covers.
  const itemStats = new Map();
  live.forEach(o => (o.items||[]).forEach(it => {
    const key = it.name + (it.size ? ` (${it.size})` : '');
    const cur = itemStats.get(key) || { qty:0, revenue:0 };
    cur.qty += it.qty || 0;
    cur.revenue += (it.unitPrice||0) * (it.qty||0);
    itemStats.set(key, cur);
  }));
  const topItems = [...itemStats.entries()].sort((a,b) => b[1].qty - a[1].qty).slice(0, 8);

  // Regulars: group by phone number, the standard low-friction way small
  // restaurants identify repeat customers (no loyalty signup needed —
  // everyone already gives a phone number to order).
  const byPhone = new Map();
  live.forEach(o => {
    const phone = (o.phone||'').trim();
    if (!phone) return;
    const cur = byPhone.get(phone) || { name:o.customerName||'', visits:0, spent:0, lastOrder:0 };
    cur.visits += 1;
    cur.spent += o.total || 0;
    cur.lastOrder = Math.max(cur.lastOrder, o.createdAt || 0);
    if (o.customerName) cur.name = o.customerName; // keep the most recent name on file
    byPhone.set(phone, cur);
  });
  const regulars = [...byPhone.entries()]
    .filter(([, v]) => v.visits >= 2)
    .sort((a,b) => b[1].visits - a[1].visits)
    .slice(0, 15);

  root.innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:26px;">
      ${statCard('Orders Today', todayOrders.length)}
      ${statCard('Revenue Today', money(todayRevenue))}
      ${statCard('Avg Ticket', money(avgTicket))}
      ${statCard('Tips Today', money(todayTips))}
    </div>

    <h3 style="font-size:17px; margin-bottom:10px;">Top Sellers</h3>
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:6px 16px; margin-bottom:26px;">
      ${topItems.length ? topItems.map(([name, s], i) => `
        <div class="row-between" style="padding:9px 0; ${i<topItems.length-1?'border-bottom:1px solid var(--line-on-ink);':''}">
          <span>${escapeHtml(name)}</span>
          <span class="mono" style="color:var(--paper-dim);">${s.qty} sold &middot; ${money(s.revenue)}</span>
        </div>`).join('') : '<div class="cart-empty">No order history yet.</div>'}
    </div>

    <h3 style="font-size:17px; margin-bottom:4px;">Regulars</h3>
    <div style="font-size:12px; color:var(--paper-dim); margin-bottom:10px;">Customers with 2 or more orders, matched by phone number.</div>
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:6px 16px;">
      ${regulars.length ? regulars.map(([phone, r], i) => `
        <div class="row-between" style="padding:9px 0; flex-wrap:wrap; gap:6px; ${i<regulars.length-1?'border-bottom:1px solid var(--line-on-ink);':''}">
          <span>${escapeHtml(r.name || 'Unnamed')} <span class="mono" style="color:var(--paper-dim); font-size:12px;">${escapeHtml(phone)}</span></span>
          <span class="mono" style="color:var(--paper-dim);">${r.visits} orders &middot; ${money(r.spent)} lifetime &middot; last ${timeAgo(r.lastOrder)}</span>
        </div>`).join('') : '<div class="cart-empty">Not enough repeat orders yet to spot regulars.</div>'}
    </div>`;
}

function statCard(label, value){
  return `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:14px 16px;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--paper-dim);">${escapeHtml(label)}</div>
    <div style="font-size:24px; font-weight:700; margin-top:4px;" class="mono">${value}</div>
  </div>`;
}
</script>

<script>
/* =========================================================================
   DELIVERY DRIVER APP
   ========================================================================= */
function initDriverView(){
  stopAllSubscriptions();
  identifyDriverAndRender();
}

/* Drivers no longer just type a name — that made it trivial for anyone
   to claim to be any driver, and gave no way to attach earnings/miles/
   ratings to a real account. Instead, whoever is signed in (the same
   Supabase Auth session the whole Staff Hub uses) is looked up by
   email against the drivers table (populated from Driver Roster). */
async function identifyDriverAndRender(){
  const view = document.getElementById('view-driver');
  view.innerHTML = '<div style="padding:20px;">Loading your driver profile...</div>';
  const db = await getDb();
  if (!db || !db.auth){ view.innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>'; return; }
  const { data } = await db.auth.getSession();
  const email = data && data.session && data.session.user && data.session.user.email;
  if (!email){ view.innerHTML = '<div class="cart-empty">Could not read your signed-in account.</div>'; return; }
  try{
    const unsub = db.collection('drivers').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id:d.id }, d.data() || {}));
      const mine = docs.find(d => (d.email||'').toLowerCase() === email.toLowerCase());
      if (typeof unsub === 'function') unsub();
      if (!mine){
        view.innerHTML = `<div class="cart-empty">No driver profile found for ${escapeHtml(email)}.<br>Ask a manager to add you under Staff Hub &gt; Driver Roster, using this same email.</div>`;
        return;
      }
      App.driver = mine;
      renderDriverLists();
    }, () => { view.innerHTML = '<div class="cart-empty">Could not load driver profiles.</div>'; });
  }catch(e){
    view.innerHTML = '<div class="cart-empty">Could not load driver profiles.</div>';
  }
}

async function getOpenShift(driverId){
  return new Promise((resolve) => {
    const unsub = App.db.collection('driver_shifts').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id:d.id }, d.data() || {}));
      const open = docs.find(s => s.driverId === driverId && !s.clockOut);
      if (typeof unsub === 'function') unsub();
      resolve(open || null);
    }, () => resolve(null));
  });
}

async function toggleShift(){
  const driver = App.driver;
  if (!driver) return;
  const open = await getOpenShift(driver.id);
  if (open){
    await App.db.collection('driver_shifts').doc(open.id).update({ clockOut: Date.now() });
    showToast('Shift ended');
  } else {
    await App.db.collection('driver_shifts').add({ driverId: driver.id, clockIn: Date.now(), clockOut: null });
    showToast('Shift started');
  }
  renderDriverLists();
}

function renderDriverLists(){
  const view = document.getElementById('view-driver');
  const driver = App.driver;
  view.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:baseline; padding:16px 0 6px; flex-wrap:wrap; gap:8px;">
      <div style="font-size:13px; color:var(--paper-dim);">Driver: <span style="color:var(--paper); font-weight:700;">${escapeHtml(driver.name || driver.email)}</span></div>
      <button class="btn btn-outline" id="driver-shift-btn" type="button" style="padding:6px 14px; font-size:12px;">...</button>
    </div>
    <div id="driver-stats" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; margin-bottom:18px;"></div>
    <div class="section-label">Available Deliveries</div>
    <div id="driver-available"></div>
    <div class="section-label">My Deliveries</div>
    <div id="driver-mine"></div>
    <div class="section-label" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Delivery History</span>
      <button class="btn-ghost" id="driver-history-toggle" type="button" style="font-size:11.5px;">Show</button>
    </div>
    <div id="driver-history" hidden></div>`;
  const shiftBtn = document.getElementById('driver-shift-btn');
  document.getElementById('driver-history-toggle').addEventListener('click', (e) => {
    const el = document.getElementById('driver-history');
    el.hidden = !el.hidden;
    e.target.textContent = el.hidden ? 'Show' : 'Hide';
  });
  getOpenShift(driver.id).then(open => {
    shiftBtn.textContent = open ? 'End Shift' : 'Start Shift';
    shiftBtn.className = open ? 'btn btn-sauce' : 'btn btn-outline';
    shiftBtn.style.padding = '6px 14px'; shiftBtn.style.fontSize = '12px';
  });
  shiftBtn.addEventListener('click', toggleShift);

  if (!App.db){
    document.getElementById('driver-available').innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>';
    return;
  }
  try{
    const unsub = App.db.collection('orders').orderBy('createdAt','asc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data() || {}));
      const deliveries = docs.filter(o => o.orderType === 'delivery');
      const available = deliveries.filter(o => o.status === 'ready' && !o.driverId);
      const mine = deliveries.filter(o => o.status === 'out_for_delivery' && o.driverId === driver.id);
      const myCompleted = deliveries.filter(o => o.status === 'completed' && o.driverId === driver.id);
      renderDriverStats(myCompleted);
      renderDriverHistory(myCompleted);
      document.getElementById('driver-available').innerHTML = available.length ? available.map(o => renderDriverCard(o,false)).join('') : '<div class="cart-empty">No deliveries ready right now.</div>';
      document.getElementById('driver-mine').innerHTML = mine.length ? mine.map(o => renderDriverCard(o,true)).join('') : '<div class="cart-empty">You have no deliveries out.</div>';
      available.forEach(o => {
        const btn = document.getElementById(`claim-${o.id}`);
        if (btn) btn.addEventListener('click', () => updateOrder(o.id, { status:'out_for_delivery', driver: driver.name, driverId: driver.id }));
      });
      mine.forEach(o => {
        const btn = document.getElementById(`complete-${o.id}`);
        if (btn) btn.addEventListener('click', () => updateOrder(o.id, { status:'completed' }));
      });
    }, () => {
      document.getElementById('driver-available').innerHTML = '<div class="cart-empty">Could not load live deliveries.</div>';
    });
    App.unsub.push(unsub);
  }catch(e){
    document.getElementById('driver-available').innerHTML = '<div class="cart-empty">Could not load live deliveries.</div>';
  }
}

function renderDriverStats(completed){
  const today0 = startOfTodayMs();
  const todayDeliveries = completed.filter(o => (o.createdAt||0) >= today0);
  const totalMiles = completed.reduce((s,o) => s + (o.deliveryMiles||0), 0);
  const totalTips = completed.reduce((s,o) => s + (o.tip||0), 0);
  const rated = completed.filter(o => o.driverRating != null);
  const avgRating = rated.length ? (rated.reduce((s,o)=>s+o.driverRating,0)/rated.length).toFixed(1) : '—';
  const el = document.getElementById('driver-stats');
  if (!el) return;
  el.innerHTML = [
    ['Today', todayDeliveries.length],
    ['Lifetime Miles', totalMiles.toFixed(1)],
    ['Lifetime Tips', money(totalTips)],
    ['Avg Rating', avgRating === '—' ? '—' : avgRating + ' \u2605'],
  ].map(([label,val]) => `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:8px 10px; text-align:center;">
    <div style="font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--paper-dim); font-family:'IBM Plex Mono',monospace;">${label}</div>
    <div style="font-size:16px; font-weight:700; margin-top:2px;" class="mono">${val}</div>
  </div>`).join('');
}

function renderDriverHistory(completed){
  const el = document.getElementById('driver-history');
  if (!el) return;
  const sorted = [...completed].sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);
  el.innerHTML = sorted.length ? sorted.map(o => `
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:10px 12px; margin-bottom:6px; font-size:12.5px;">
      <div class="row-between">
        <span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span>
        <span style="color:var(--paper-dim);">${new Date(o.createdAt||0).toLocaleDateString()}</span>
      </div>
      <div style="color:var(--paper-dim); margin-top:2px;">${escapeHtml(o.address||'')}</div>
      <div style="margin-top:4px; display:flex; gap:12px; flex-wrap:wrap;">
        ${o.deliveryMiles != null ? `<span>${o.deliveryMiles} mi</span>` : ''}
        ${o.tip ? `<span style="color:var(--gold);">+${money(o.tip)} tip</span>` : ''}
        ${o.driverRating != null ? `<span>${'\u2605'.repeat(o.driverRating)}${'\u2606'.repeat(5-o.driverRating)}</span>` : '<span style="color:var(--paper-dim);">Not rated</span>'}
      </div>
      ${o.driverRatingComment ? `<div style="color:var(--paper-dim); font-style:italic; margin-top:4px;">"${escapeHtml(o.driverRatingComment)}"</div>` : ''}
    </div>`).join('') : '<div class="cart-empty">No completed deliveries yet.</div>';
}

function renderDriverCard(o, mine){
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address || '');
  return `<div class="driver-card">
    <div class="top">
      <span class="mono" style="font-weight:700;">${escapeHtml(o.ticket||'')}</span>
      <span class="status-chip status-${o.status}">${escapeHtml(statusName(o.status))}</span>
    </div>
    <div class="addr">${escapeHtml(o.address||'')}</div>
    <div class="sub">${escapeHtml(o.customerName||'')}${o.phone ? ', ' + escapeHtml(o.phone) : ''}</div>
    ${o.deliveryMiles != null ? `<div class="sub">~${o.deliveryMiles} mi &middot; about ${o.deliveryEtaMins} min drive</div>` : ''}
    ${o.payMethod === 'cash' ? `<div class="due">Collect ${money(o.total||0)} cash</div>` : `<div class="due">Paid by card</div>`}
    ${o.tip ? `<div class="due" style="color:var(--gold);">+${money(o.tip)} tip</div>` : ''}
    <div class="driver-actions">
      <a href="${mapsUrl}" target="_blank" rel="noopener" class="btn btn-outline">Directions</a>
      ${mine ? `<button class="btn btn-sauce" id="complete-${o.id}" type="button">Mark Delivered</button>` : `<button class="btn btn-sauce" id="claim-${o.id}" type="button">Claim Delivery</button>`}
    </div>
  </div>`;
}
</script>

<script>
/* =========================================================================
   DRIVER ROSTER (staff-side: create/manage driver profiles)
   ========================================================================= */
function initDriverRosterView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-driverroster');
  view.innerHTML = `
    <div style="padding:18px 20px; max-width:900px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="font-size:24px; margin:0;">Driver Roster</h2>
        <button class="btn btn-outline" id="addDriverBtn" type="button">+ Add Driver</button>
      </div>
      <div style="font-size:12.5px; color:var(--paper-dim); margin-bottom:16px;">
        Two ways someone becomes a driver: add them here directly (their Supabase Auth login and <span class="mono">staff</span> row still need creating separately, see supabase/README.md), or send them to <span class="mono">/staff/apply.html</span> to apply themselves — those show up below as pending until approved.
        ${App.isAdmin ? '' : ' Approving applications requires an admin account; ask one to review these.'}
      </div>
      <div id="pending-section" hidden>
        <div class="section-label">Pending Applications</div>
        <div id="driverroster-pending" style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px;"></div>
      </div>
      <div class="section-label">Roster</div>
      <div id="driverroster-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>`;
  document.getElementById('addDriverBtn').addEventListener('click', () => showDriverEditor(null));
  const list = document.getElementById('driverroster-list');
  const pendingSection = document.getElementById('pending-section');
  const pendingList = document.getElementById('driverroster-pending');
  if (!App.db){ list.innerHTML = '<div class="cart-empty">Not connected to the live order database.</div>'; return; }
  try{
    const unsub = App.db.collection('drivers').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id:d.id }, d.data() || {}));
      const pending = docs.filter(d => !d.approved);
      const approved = docs.filter(d => d.approved);
      pendingSection.hidden = pending.length === 0;
      pendingList.innerHTML = pending.map(renderPendingRow).join('');
      list.innerHTML = approved.length ? approved.map(renderDriverRosterRow).join('') : '<div class="cart-empty">No approved drivers yet.</div>';
      approved.forEach(d => {
        const editBtn = document.getElementById(`roster-edit-${d.id}`);
        if (editBtn) editBtn.addEventListener('click', () => showDriverEditor(d));
      });
      pending.forEach(d => {
        const approveBtn = document.getElementById(`pending-approve-${d.id}`);
        if (approveBtn) approveBtn.addEventListener('click', () => approveDriver(d));
        const rejectBtn = document.getElementById(`pending-reject-${d.id}`);
        if (rejectBtn) rejectBtn.addEventListener('click', () => {
          showConfirmModal({
            title: `Reject ${d.name || 'this application'}?`,
            body: 'This removes the application. They can re-apply later if you change your mind.',
            confirmLabel: 'Reject',
            danger: true,
            onConfirm: async () => {
              await App.db.collection('drivers').doc(d.id).delete();
              showToast('Application rejected');
            },
          });
        });
      });
    }, () => { list.innerHTML = '<div class="cart-empty">Could not load drivers.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    list.innerHTML = '<div class="cart-empty">Could not load drivers.</div>';
  }
}

function renderPendingRow(d){
  const car = [d.carColor, d.carMake, d.carModel].filter(Boolean).join(' ') || 'No car info given';
  return `<div style="background:rgba(220,159,52,.08); border:1px solid var(--gold); border-radius:8px; padding:12px 14px;">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div>
        <div style="font-weight:700;">${escapeHtml(d.name||'Unnamed')} <span class="status-chip" style="background:rgba(220,159,52,.25); color:var(--gold);">Pending</span></div>
        <div style="font-size:12px; color:var(--paper-dim); margin-top:2px;">${escapeHtml(d.email||'')} &middot; ${escapeHtml(d.phone||'')}</div>
        <div style="font-size:12px; color:var(--paper-dim);">${escapeHtml(car)}${d.carPlate ? ' &middot; ' + escapeHtml(d.carPlate) : ''}</div>
        ${d.notes ? `<div style="font-size:12px; color:var(--paper-dim); margin-top:4px; font-style:italic;">"${escapeHtml(d.notes)}"</div>` : ''}
      </div>
      ${App.isAdmin ? `<div style="display:flex; gap:8px; align-self:flex-start;">
        <button class="btn-ghost" id="pending-reject-${d.id}" type="button">Reject</button>
        <button class="btn btn-sauce" id="pending-approve-${d.id}" type="button" style="padding:8px 16px; font-size:13px;">Approve</button>
      </div>` : '<div style="font-size:11.5px; color:var(--paper-dim); align-self:center;">Admin review needed</div>'}
    </div>
  </div>`;
}

async function approveDriver(d){
  if (!App.isAdmin){ showToast('Only an admin can approve drivers'); return; }
  if (!d.authUserId){ showToast('This application has no linked sign-in — approve manually in the SQL Editor'); return; }
  await App.db.collection('staff').doc(d.authUserId).set({ isDriver: true, active: true });
  await App.db.collection('drivers').doc(d.id).update({ approved: true, active: true });
  showToast(`${d.name || 'Driver'} approved — they can sign in now`);
}

function renderDriverRosterRow(d){
  const car = [d.carColor, d.carMake, d.carModel].filter(Boolean).join(' ') || 'No car info on file';
  return `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
    <div style="min-width:140px;">
      <div style="font-weight:700;">${escapeHtml(d.name||'Unnamed')}</div>
      <div style="font-size:12px; color:var(--paper-dim);">${escapeHtml(d.email||'')}</div>
    </div>
    <div style="font-size:12.5px; color:var(--paper-dim); flex:1; min-width:160px;">${escapeHtml(car)}${d.carPlate ? ' &middot; ' + escapeHtml(d.carPlate) : ''}</div>
    <span class="status-chip" style="background:${d.active ? 'rgba(60,120,60,.2)' : 'rgba(198,42,47,.2)'};">${d.active ? 'Active' : 'Inactive'}</span>
    <button class="btn-ghost" id="roster-edit-${d.id}" type="button">Edit</button>
  </div>`;
}

function showDriverEditor(driver){
  showConfirmModal({
    title: driver ? `Edit ${driver.name || 'Driver'}` : 'Add a Driver',
    confirmLabel: driver ? 'Save' : 'Add Driver',
    onConfirm: null, // replaced below; showConfirmModal's default body doesn't fit this form, so we build it manually
  });
  // showConfirmModal is built for short confirmations; this form needs
  // more fields, so replace its body with a real form right after it
  // renders rather than teaching that helper a second shape.
  const card = document.querySelector('#confirmModalBackdrop .modal-card');
  if (!card) return;
  const f = (label, key, placeholder) => `<div class="field-group"><label>${label}</label><input id="drv-${key}" placeholder="${placeholder||''}" value="${escapeHtml((driver && driver[key]) || '')}"></div>`;
  card.innerHTML = `
    <h3>${driver ? 'Edit Driver' : 'Add a Driver'}</h3>
    ${f('Name','name')}
    ${f('Phone','phone','(856) 555-0100')}
    ${f('Email (matches their sign-in)','email','driver@example.com')}
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">${f('Car Make','carMake','Honda')}</div>
      <div style="flex:1;">${f('Car Model','carModel','Civic')}</div>
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">${f('Car Color','carColor','Silver')}</div>
      <div style="flex:1;">${f('Plate','carPlate')}</div>
    </div>
    ${f('Notes / Preferences','notes','Prefers pickup-only shifts, etc.')}
    <div class="field-group" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="drv-active" style="width:auto;" ${(!driver || driver.active) ? 'checked' : ''}>
      <label style="margin:0; text-transform:none; font-size:13px;" for="drv-active">Active</label>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="confirmModalCancel" type="button">Cancel</button>
      <button class="btn btn-outline" id="drv-save" type="button">${driver ? 'Save' : 'Add Driver'}</button>
    </div>`;
  document.getElementById('confirmModalCancel').addEventListener('click', () => document.getElementById('confirmModalBackdrop').remove());
  document.getElementById('drv-save').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('drv-name').value.trim(),
      phone: document.getElementById('drv-phone').value.trim(),
      email: document.getElementById('drv-email').value.trim(),
      carMake: document.getElementById('drv-carMake').value.trim(),
      carModel: document.getElementById('drv-carModel').value.trim(),
      carColor: document.getElementById('drv-carColor').value.trim(),
      carPlate: document.getElementById('drv-carPlate').value.trim(),
      notes: document.getElementById('drv-notes').value.trim(),
      active: document.getElementById('drv-active').checked,
    };
    if (!payload.name || !payload.email){ showToast('Name and email are required'); return; }
    if (driver){ await App.db.collection('drivers').doc(driver.id).update(payload); }
    else{ await App.db.collection('drivers').add(payload); }
    document.getElementById('confirmModalBackdrop').remove();
    showToast(driver ? 'Driver updated' : 'Driver added');
  });
}
</script>

<script>
/* =========================================================================
   MENU EDITOR (admin-only edits; visible to all staff, same pattern as
   Driver Roster — App.isAdmin gates the Save button and add/remove
   controls, RLS enforces the same rule server-side either way).

   Working copy lives in MenuEditorState, loaded once from menu_config on
   entry and re-rendered from scratch on every edit (same "rebuild the
   HTML from state" approach as the rest of this file). Nothing is sent
   to Supabase until "Save Menu" is clicked; a version mismatch at save
   time (someone else saved in the meantime) is caught and surfaced
   instead of silently overwriting their change.
   ========================================================================= */
let MenuEditorState = null; // { TAX_RATE, PIZZA_SIZES, TOPPINGS, SPECIALTY_PIZZAS, CATEGORIES, SPECIALS_BY_DAY, version }
const SPECIALTY_SIZE_SLOTS = ['Medium', 'Large', 'Sicilian'];

function menuEditorSnapshotFromLive(){
  // Used when menu_config hasn't been migrated/seeded yet: let the admin
  // start editing from whatever the page is currently using (the live
  // DB values if loadMenuConfig() already applied them, otherwise the
  // hardcoded fallback), rather than showing a dead end.
  return {
    TAX_RATE, PIZZA_SIZES: PIZZA_SIZES.slice(), TOPPINGS: TOPPINGS.slice(),
    SPECIALTY_PIZZAS: JSON.parse(JSON.stringify(SPECIALTY_PIZZAS)),
    CATEGORIES: JSON.parse(JSON.stringify(CATEGORIES)),
    SPECIALS_BY_DAY: JSON.parse(JSON.stringify(SPECIALS_BY_DAY)),
    version: null,
  };
}

async function initMenuEditorView(){
  const view = document.getElementById('view-menu');
  view.innerHTML = '<p style="color:var(--paper-dim);">Loading menu...</p>';
  const db = App.db || await getDb();
  if (!db){ view.innerHTML = '<p style="color:var(--bad);">Not connected to the database.</p>'; return; }

  let migrated = true;
  try{
    const doc = await db.collection('menu_config').doc(1).get();
    if (doc.data()){
      const d = doc.data();
      MenuEditorState = {
        TAX_RATE: d.data.TAX_RATE, PIZZA_SIZES: d.data.PIZZA_SIZES, TOPPINGS: d.data.TOPPINGS,
        SPECIALTY_PIZZAS: d.data.SPECIALTY_PIZZAS, CATEGORIES: d.data.CATEGORIES,
        SPECIALS_BY_DAY: d.data.SPECIALS_BY_DAY, version: d.version,
      };
    } else {
      migrated = false;
      MenuEditorState = menuEditorSnapshotFromLive();
    }
  }catch(e){
    migrated = false;
    MenuEditorState = menuEditorSnapshotFromLive();
  }

  renderMenuEditor(migrated);
}

function renderMenuEditor(migrated){
  const view = document.getElementById('view-menu');
  const s = MenuEditorState;
  const readOnly = !App.isAdmin;

  let html = `<div class="view-header"><h2>Menu Editor</h2></div>`;

  if (!migrated){
    html += `<div style="background:var(--ink-soft); border:1px solid var(--gold); border-radius:10px; padding:14px 16px; margin-bottom:20px; font-size:13.5px; line-height:1.5;">
      The live menu database hasn't been set up yet (see <code>supabase/menu-config-migration.sql</code>).
      Editing works below, but <strong>Save Menu will not work until that migration has been run once</strong> —
      ask whoever manages the site. Showing today's menu so you can preview changes in the meantime.
    </div>`;
  }
  if (readOnly){
    html += `<div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:14px 16px; margin-bottom:20px; font-size:13.5px; color:var(--paper-dim);">
      You can look around, but saving menu changes requires an admin account.
    </div>`;
  }

  // --- Tax rate ---
  html += `<div class="me-card" style="margin-bottom:20px;">
    <div class="me-card-title">Sales Tax</div>
    <label style="display:flex; align-items:center; gap:8px; font-size:13.5px;">Tax rate (e.g. 0.06625 for 6.625%)
      <input type="number" step="0.00001" min="0" max="1" id="me-taxrate" value="${s.TAX_RATE}" ${readOnly?'disabled':''} style="width:120px;">
    </label>
  </div>`;

  // --- Pizza sizes ---
  html += `<div class="me-card" style="margin-bottom:20px;">
    <div class="me-card-title">Pizza Sizes &amp; Topping Price</div>
    <table class="me-table"><thead><tr><th>Size label</th><th>Base price</th><th>Per topping</th><th></th></tr></thead><tbody>`;
  s.PIZZA_SIZES.forEach((sz, i) => {
    html += `<tr>
      <td><input data-me-pizzasize="${i}" data-field="label" value="${escapeHtml(sz.label)}" ${readOnly?'disabled':''}></td>
      <td><input type="number" step="0.01" min="0" data-me-pizzasize="${i}" data-field="base" value="${sz.base}" ${readOnly?'disabled':''}></td>
      <td><input type="number" step="0.01" min="0" data-me-pizzasize="${i}" data-field="perTopping" value="${sz.perTopping}" ${readOnly?'disabled':''}></td>
      <td>${readOnly?'':`<button class="btn-ghost me-del-pizzasize" data-i="${i}" type="button">Remove</button>`}</td>
    </tr>`;
  });
  html += `</tbody></table>
    ${readOnly?'':'<button class="btn-ghost" id="me-add-pizzasize" type="button" style="margin-top:8px;">+ Add size</button>'}
  </div>`;

  // --- Toppings ---
  html += `<div class="me-card" style="margin-bottom:20px;">
    <div class="me-card-title">Available Toppings</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">`;
  s.TOPPINGS.forEach((t, i) => {
    html += `<span class="me-chip">${escapeHtml(t)} ${readOnly?'':`<button class="me-del-topping" data-i="${i}" type="button" aria-label="Remove ${escapeHtml(t)}">&times;</button>`}</span>`;
  });
  html += `</div>
    ${readOnly?'':`<div style="display:flex; gap:8px; margin-top:10px;"><input id="me-new-topping" placeholder="New topping name" style="max-width:220px;"><button class="btn-ghost" id="me-add-topping" type="button">+ Add</button></div>`}
  </div>`;

  // --- Specialty pizzas ---
  html += `<div class="me-card" style="margin-bottom:20px;">
    <div class="me-card-title">Specialty Pizzas</div>`;
  s.SPECIALTY_PIZZAS.forEach((sp, i) => {
    const priceFor = (label) => { const m = (sp.sizes||[]).find(x => x.label === label); return m ? m.price : ''; };
    html += `<div class="me-row" style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px dotted var(--line-on-ink);">
      <input data-me-specialty="${i}" data-field="name" value="${escapeHtml(sp.name)}" placeholder="Name" ${readOnly?'disabled':''} style="min-width:220px;">
      ${SPECIALTY_SIZE_SLOTS.map(label => `
        <label style="font-size:12px; color:var(--paper-dim); display:flex; align-items:center; gap:4px;">${label}
          <input type="number" step="0.01" min="0" data-me-specialty="${i}" data-size-label="${label}" value="${priceFor(label)}" placeholder="off" ${readOnly?'disabled':''} style="width:80px;">
        </label>`).join('')}
      ${readOnly?'':`<button class="btn-ghost me-del-specialty" data-i="${i}" type="button">Remove</button>`}
    </div>`;
  });
  html += `${readOnly?'':'<button class="btn-ghost" id="me-add-specialty" type="button">+ Add specialty pizza</button>'}</div>`;

  // --- Categories & items ---
  html += `<div class="me-section-title">Menu Categories</div>`;
  s.CATEGORIES.forEach((cat, ci) => {
    html += `<details class="card me-category" style="margin-bottom:14px;" open>
      <summary style="cursor:pointer; display:flex; align-items:center; gap:10px;">
        <input data-me-cat="${ci}" data-field="label" value="${escapeHtml(cat.label)}" ${readOnly?'disabled':''} style="font-weight:700; flex:1; min-width:140px;" onclick="event.stopPropagation()">
        <span style="font-size:12px; color:var(--paper-dim);">${cat.items.length} item${cat.items.length===1?'':'s'}</span>
        ${readOnly?'':`<button class="btn-ghost me-del-cat" data-ci="${ci}" type="button" onclick="event.stopPropagation()">Remove category</button>`}
      </summary>
      <div style="margin-top:10px;">
        <input data-me-cat="${ci}" data-field="note" value="${escapeHtml(cat.note||'')}" placeholder="Optional note shown under the category heading" ${readOnly?'disabled':''} style="width:100%; margin-bottom:10px;">
        <table class="me-table"><thead><tr><th>Item name</th><th>Size / variant</th><th>Price</th><th>Description</th><th></th></tr></thead><tbody>`;
    cat.items.forEach((it, ii) => {
      html += `<tr>
        <td><input data-me-item="${ci}.${ii}" data-field="name" value="${escapeHtml(it.name)}" ${readOnly?'disabled':''}></td>
        <td><input data-me-item="${ci}.${ii}" data-field="size" value="${escapeHtml(it.size||'')}" ${readOnly?'disabled':''} style="width:110px;"></td>
        <td><input type="number" step="0.01" min="0" data-me-item="${ci}.${ii}" data-field="price" value="${it.price}" ${readOnly?'disabled':''} style="width:90px;"></td>
        <td><input data-me-item="${ci}.${ii}" data-field="desc" value="${escapeHtml(it.desc||'')}" ${readOnly?'disabled':''}></td>
        <td>${readOnly?'':`<button class="btn-ghost me-del-item" data-ci="${ci}" data-ii="${ii}" type="button">Remove</button>`}</td>
      </tr>`;
    });
    html += `</tbody></table>
        ${readOnly?'':`<button class="btn-ghost me-add-item" data-ci="${ci}" type="button" style="margin-top:8px;">+ Add item to ${escapeHtml(cat.label)}</button>`}
      </div>
    </details>`;
  });
  html += readOnly ? '' : `<div style="display:flex; gap:8px; align-items:flex-end; margin:14px 0 24px;">
    <label style="font-size:13px;">New category key<br><input id="me-new-cat-key" placeholder="e.g. desserts" style="width:160px;"></label>
    <label style="font-size:13px;">Label<br><input id="me-new-cat-label" placeholder="e.g. Desserts" style="width:200px;"></label>
    <button class="btn-ghost" id="me-add-cat" type="button">+ Add category</button>
  </div>`;

  // --- Daily specials ---
  html += `<div class="me-card" style="margin-bottom:24px;">
    <div class="me-card-title">Daily Specials</div>
    <table class="me-table"><thead><tr><th>Day</th><th>Special</th><th>Price</th></tr></thead><tbody>`;
  DAY_NAMES.forEach((dayName, di) => {
    const sp = s.SPECIALS_BY_DAY[di] || { name: '', price: 0 };
    html += `<tr>
      <td>${dayName}</td>
      <td><input data-me-special="${di}" data-field="name" value="${escapeHtml(sp.name||'')}" ${readOnly?'disabled':''}></td>
      <td><input type="number" step="0.01" min="0" data-me-special="${di}" data-field="price" value="${sp.price||0}" ${readOnly?'disabled':''} style="width:90px;"></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  if (!readOnly){
    html += `<div style="display:flex; align-items:center; gap:14px; margin-bottom:40px;">
      <button class="btn btn-sauce" id="me-save" type="button">Save Menu</button>
      <span id="me-save-status" style="font-size:13px; color:var(--paper-dim);"></span>
    </div>`;
  }

  view.innerHTML = html;
  wireMenuEditorEvents(migrated);
}

function wireMenuEditorEvents(migrated){
  const view = document.getElementById('view-menu');
  const s = MenuEditorState;

  // Simple field edits: update state in place, no full re-render needed
  // (re-rendering on every keystroke would fight the user's cursor).
  view.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'me-taxrate'){ s.TAX_RATE = Number(t.value) || 0; return; }
    if (t.hasAttribute('data-me-pizzasize')){
      const i = Number(t.getAttribute('data-me-pizzasize')), f = t.getAttribute('data-field');
      s.PIZZA_SIZES[i][f] = (f === 'label') ? t.value : (Number(t.value) || 0);
      return;
    }
    if (t.hasAttribute('data-me-specialty')){
      const i = Number(t.getAttribute('data-me-specialty'));
      const sizeLabel = t.getAttribute('data-size-label');
      if (sizeLabel){
        const sizes = s.SPECIALTY_PIZZAS[i].sizes = s.SPECIALTY_PIZZAS[i].sizes || [];
        const existing = sizes.find(x => x.label === sizeLabel);
        const val = t.value === '' ? null : (Number(t.value) || 0);
        if (val === null){ s.SPECIALTY_PIZZAS[i].sizes = sizes.filter(x => x.label !== sizeLabel); }
        else if (existing){ existing.price = val; }
        else { sizes.push({ label: sizeLabel, price: val }); }
      } else {
        s.SPECIALTY_PIZZAS[i].name = t.value;
      }
      return;
    }
    if (t.hasAttribute('data-me-cat')){
      const ci = Number(t.getAttribute('data-me-cat')), f = t.getAttribute('data-field');
      s.CATEGORIES[ci][f] = t.value;
      return;
    }
    if (t.hasAttribute('data-me-item')){
      const [ci, ii] = t.getAttribute('data-me-item').split('.').map(Number);
      const f = t.getAttribute('data-field');
      s.CATEGORIES[ci].items[ii][f] = (f === 'price') ? (Number(t.value) || 0) : t.value;
      return;
    }
    if (t.hasAttribute('data-me-special')){
      const di = Number(t.getAttribute('data-me-special')), f = t.getAttribute('data-field');
      if (!s.SPECIALS_BY_DAY[di]) s.SPECIALS_BY_DAY[di] = { name:'', price:0 };
      s.SPECIALS_BY_DAY[di][f] = (f === 'price') ? (Number(t.value) || 0) : t.value;
      return;
    }
  });

  // Structural edits (add/remove rows) need a full re-render.
  view.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.id === 'me-add-pizzasize'){ s.PIZZA_SIZES.push({ key:'size'+Date.now(), label:'New Size', base:0, perTopping:0 }); renderMenuEditor(migrated); }
    else if (btn.classList.contains('me-del-pizzasize')){ s.PIZZA_SIZES.splice(Number(btn.dataset.i), 1); renderMenuEditor(migrated); }
    else if (btn.id === 'me-add-topping'){
      const input = document.getElementById('me-new-topping');
      const v = input.value.trim();
      if (v){ s.TOPPINGS.push(v); renderMenuEditor(migrated); }
    }
    else if (btn.classList.contains('me-del-topping')){ s.TOPPINGS.splice(Number(btn.dataset.i), 1); renderMenuEditor(migrated); }
    else if (btn.id === 'me-add-specialty'){ s.SPECIALTY_PIZZAS.push({ name:'New Specialty Pizza', sizes:[{label:'Large', price:0}] }); renderMenuEditor(migrated); }
    else if (btn.classList.contains('me-del-specialty')){ s.SPECIALTY_PIZZAS.splice(Number(btn.dataset.i), 1); renderMenuEditor(migrated); }
    else if (btn.classList.contains('me-add-item')){
      const ci = Number(btn.dataset.ci);
      s.CATEGORIES[ci].items.push({ name:'New Item', price:0 });
      renderMenuEditor(migrated);
    }
    else if (btn.classList.contains('me-del-item')){
      const ci = Number(btn.dataset.ci), ii = Number(btn.dataset.ii);
      s.CATEGORIES[ci].items.splice(ii, 1);
      renderMenuEditor(migrated);
    }
    else if (btn.classList.contains('me-del-cat')){
      const ci = Number(btn.dataset.ci);
      showConfirmModal({
        title: 'Remove this category?',
        body: `This removes "${s.CATEGORIES[ci].label}" and all ${s.CATEGORIES[ci].items.length} of its items. This only takes effect once you hit Save Menu.`,
        danger: true,
        confirmLabel: 'Remove category',
        onConfirm: () => { s.CATEGORIES.splice(ci, 1); renderMenuEditor(migrated); },
      });
    }
    else if (btn.id === 'me-add-cat'){
      const key = document.getElementById('me-new-cat-key').value.trim();
      const label = document.getElementById('me-new-cat-label').value.trim();
      if (!key || !label){ showToast('Category key and label are both required'); return; }
      if (s.CATEGORIES.some(c => c.key === key)){ showToast('That category key is already used'); return; }
      s.CATEGORIES.push({ key, label, items: [] });
      renderMenuEditor(migrated);
    }
    else if (btn.id === 'me-save'){
      await saveMenuEditor();
    }
  });
}

async function saveMenuEditor(){
  const statusEl = document.getElementById('me-save-status');
  const btn = document.getElementById('me-save');
  const db = App.db || await getDb();
  if (!db){ statusEl.textContent = 'Not connected to the database.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Saving...';
  try{
    // Optimistic concurrency: refuse to blindly overwrite if someone
    // else saved since this admin loaded the page.
    const current = await db.collection('menu_config').doc(1).get();
    if (!current.data()){
      statusEl.textContent = 'Could not save: the menu database has not been set up yet (see supabase/menu-config-migration.sql).';
      btn.disabled = false;
      return;
    }
    if (MenuEditorState.version !== null && current.data().version !== MenuEditorState.version){
      statusEl.textContent = 'Someone else saved menu changes since you opened this page. Reload the Menu Editor to see their changes, then re-apply yours.';
      btn.disabled = false;
      return;
    }
    const s = MenuEditorState;
    await db.collection('menu_config').doc(1).update({
      data: {
        TAX_RATE: s.TAX_RATE, PIZZA_SIZES: s.PIZZA_SIZES, TOPPINGS: s.TOPPINGS,
        SPECIALTY_PIZZAS: s.SPECIALTY_PIZZAS, CATEGORIES: s.CATEGORIES, SPECIALS_BY_DAY: s.SPECIALS_BY_DAY,
      },
    });
    applyMenuConfig(s); // reflect immediately in this tab's own POS view too
    statusEl.textContent = 'Saved — live on the kiosk now.';
  }catch(e){
    statusEl.textContent = 'Could not save: ' + (e && e.message ? e.message : 'unknown error');
  }
  btn.disabled = false;
}
</script>

/* Runs last, after every view's init function above is defined, so an
   auto-resumed saved role (from a previous visit) never calls a
   not-yet-defined initXView function. */
(async function boot(){
  await loadMenuConfig(await getDb());
  await initAuthGate();
})();
</script>

    });
  }
