<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff Hub | Cifelli's Pizza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Staff-only: POS, kitchen board and driver app for Cifelli's Pizza. Sign-in required.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Staff Hub">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f4ead6'/%3E%3Cpath d='M50 22 L78 68 A32 32 0 0 1 22 68 Z' fill='%23c22a2f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../order/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1c1712; --ink-soft:#2a231d; --ink-softer:#382f27;
    --paper:#f4ead6; --paper-dim:#e9dcbf;
    --sauce:#c22a2f; --sauce-deep:#821e21;
    --gold:#dc9f34; --basil:#4c6b3a;
    --line-on-ink: rgba(244,234,214,.16);
    --line-on-paper: rgba(28,23,18,.18);
    --ok:#4c8c5a; --warn:#dc9f34; --bad:#c22a2f;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:"Rye", Georgia, serif; font-weight:400; margin:0; line-height:1.1; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-on-ink); border-radius:4px; }

  /* ---------- role picker ---------- */
  #screen-role, #screen-login{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; gap:28px; text-align:center;
  }
  #screen-role .badge, #screen-login .badge{ width:64px; height:64px; }
  #screen-role h1, #screen-login h1{ font-size:clamp(32px,6vw,48px); }
  #screen-role .sub, #screen-login .sub{ color:var(--paper-dim); font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
  #screen-login .field-group{ text-align:left; }
  .role-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; max-width:900px; width:100%; }
  .role-card{
    background:var(--ink-soft); border:1.5px solid var(--line-on-ink); border-radius:8px;
    padding:26px 20px; color:var(--paper); text-align:left; transition:border-color .15s ease, transform .15s ease;
  }
  .role-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .role-card svg{ width:30px; height:30px; color:var(--gold); margin-bottom:14px; }
  .role-card .t{ font-family:"Rye",serif; font-size:22px; }
  .role-card .d{ font-size:12.5px; color:var(--paper-dim); margin-top:6px; line-height:1.4; }

  /* ---------- app shell ---------- */
  #app-shell{ min-height:100vh; display:flex; flex-direction:column; }
  #app-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px; background:var(--ink-soft); border-bottom:1px solid var(--line-on-ink);
    position:sticky; top:0; z-index:40;
  }
  #app-header .brand{ display:flex; align-items:center; gap:10px; }
  #app-header .brand svg{ width:30px; height:30px; }
  #app-header .brand .name{ font-family:"Rye",serif; font-size:18px; }
  #app-header .role-tag{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  #app-header .right{ display:flex; align-items:center; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; border-radius:999px; padding:10px 18px; font-weight:700; font-size:13.5px; }
  .btn-sauce{ background:var(--sauce); color:var(--paper); }
  .btn-sauce:hover{ background:var(--sauce-deep); }
  .btn-outline{ background:transparent; color:var(--paper); border:1.5px solid var(--line-on-ink); }
  .btn-outline:hover{ border-color:var(--paper-dim); }
  .btn-ghost{ background:transparent; color:var(--paper-dim); border:none; font-size:12.5px; text-decoration:underline; padding:6px 4px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  main{ flex:1; min-height:0; }
  .view{ height:100%; }

  /* generic pieces reused across views */
  .pill{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; padding:8px 14px;
    border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); white-space:nowrap;
  }
  .pill[aria-pressed="true"]{ background:var(--sauce); border-color:var(--sauce); color:var(--paper); }
  .status-chip{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }

  /* ---- generic confirm modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(13,9,6,.72); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:12px;
    max-width:380px; width:100%; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .modal-card h3{ font-size:18px; margin:0 0 8px; color:var(--paper); }
  .modal-card p{ font-size:13.5px; color:var(--paper-dim); line-height:1.5; margin:0 0 14px; }
  .modal-card textarea, .modal-card input{
    width:100%; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:8px;
    color:var(--paper); padding:10px 12px; font-size:13.5px; font-family:inherit; margin-bottom:14px;
  }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .status-new{ background:rgba(220,159,52,.18); color:var(--gold); }
  .status-preparing{ background:rgba(220,159,52,.28); color:var(--gold); }
  .status-ready{ background:rgba(76,140,90,.25); color:#7fc98f; }
  .status-out_for_delivery{ background:rgba(76,108,140,.25); color:#8fb8d9; }
  .status-completed{ background:rgba(244,234,214,.12); color:var(--paper-dim); }
  .status-cancelled{ background:rgba(194,42,47,.2); color:#e59a9c; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--paper); color:var(--ink); font-weight:700; font-size:14px; padding:12px 22px;
    border-radius:999px; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); transition:opacity .2s ease, transform .2s ease; z-index:100; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= CUSTOMER / POS shared ordering layout ================= */
  .order-layout{ display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 57px); }
  .order-menu-pane{ overflow-y:auto; padding:18px 20px 40px; background:var(--ink); }
  .order-cart-pane{ background:var(--ink-soft); border-left:1px solid var(--line-on-ink); display:flex; flex-direction:column; height:100%; }
  @media (max-width:860px){
    .order-layout{ grid-template-columns:1fr; height:auto; }
    .order-cart-pane{ border-left:none; border-top:1px solid var(--line-on-ink); }
  }

  .cat-bar{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:14px; position:sticky; top:0; background:var(--ink); z-index:5; }

  .today-banner{
    display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, rgba(220,159,52,.16), transparent);
    border:1px solid rgba(220,159,52,.4); border-radius:8px; padding:12px 16px; margin-bottom:16px; cursor:pointer;
  }
  .today-banner .t{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); }
  .today-banner .n{ font-family:"Rye",serif; font-size:17px; color:var(--paper); }
  .today-banner .p{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); }

  .menu-section{ margin-bottom:26px; }
  .menu-section h3{ font-size:19px; color:var(--paper); border-bottom:2px solid var(--line-on-ink); padding-bottom:8px; margin-bottom:10px; display:flex; align-items:baseline; gap:10px; }
  .menu-section .note{ font-family:"Work Sans"; font-size:11.5px; font-style:italic; color:var(--gold); font-weight:500; }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .item-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; text-align:left; color:var(--paper);
  }
  .item-card:hover{ border-color:var(--gold); }
  .item-card .n{ font-weight:600; font-size:13.5px; }
  .item-card .s{ font-size:11px; color:var(--paper-dim); display:block; margin-top:2px; }
  .item-card .p{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); white-space:nowrap; }
  .item-card .plus{ width:26px; height:26px; border-radius:50%; background:var(--sauce); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }

  /* pizza builder */
  .builder{ background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:18px; }
  .size-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .size-opt{ flex:1; min-width:130px; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:8px; padding:10px 12px; text-align:left; color:var(--paper); }
  .size-opt[aria-pressed="true"]{ border-color:var(--sauce); background:rgba(194,42,47,.12); }
  .size-opt .n{ font-weight:700; font-size:13px; }
  .size-opt .p{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gold); margin-top:2px; }
  .topping-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .topping-chip{ font-size:12.5px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line-on-ink); background:transparent; color:var(--paper-dim); }
  .topping-chip[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700; }
  .builder-total{ display:flex; align-items:center; justify-content:space-between; }

  /* cart */
  .cart-head{ padding:16px 18px; border-bottom:1px solid var(--line-on-ink); }
  .cart-head h3{ font-size:18px; }
  .cart-items{ flex:1; overflow-y:auto; padding:10px 18px; }
  .cart-line{ display:flex; gap:8px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line-on-ink); }
  .cart-line .n{ font-weight:600; font-size:13px; flex:1; }
  .cart-line .meta{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  .cart-line .qty{ display:flex; align-items:center; gap:6px; }
  .qty-btn{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line-on-ink); background:transparent; color:var(--paper); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .cart-line .p{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; white-space:nowrap; }
  .cart-empty{ text-align:center; color:var(--paper-dim); font-size:13px; padding:30px 10px; }
  .cart-foot{ padding:14px 18px 18px; border-top:1px solid var(--line-on-ink); }
  .row-between{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin:4px 0; }
  .row-between.total{ font-size:18px; font-weight:700; font-family:"IBM Plex Mono",monospace; margin-top:8px; }

  .field-group{ margin-top:10px; }
  .field-group label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--paper-dim); margin-bottom:5px; font-family:"IBM Plex Mono",monospace; }
  .field-group input, .field-group textarea{
    width:100%; background:var(--ink); border:1.5px solid var(--line-on-ink); border-radius:6px; color:var(--paper);
    padding:9px 11px; font-size:13.5px;
  }
  .field-group input:focus, .field-group textarea:focus{ outline:none; border-color:var(--gold); }
  .seg{ display:flex; border:1.5px solid var(--line-on-ink); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; background:transparent; border:none; color:var(--paper-dim); padding:9px 8px; font-size:12.5px; font-weight:600; }
  .seg button[aria-pressed="true"]{ background:var(--sauce); color:var(--paper); }

  /* order confirmation */
  .confirm-wrap{ height:calc(100vh - 57px); display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; }
  .confirm-card{ max-width:420px; }
  .confirm-ticket{ font-family:"Rye",serif; font-size:56px; color:var(--gold); }

  /* ================= KITCHEN BOARD ================= */
  #view-kitchen{ padding:16px 20px; height:calc(100vh - 57px); overflow-y:auto; }
  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start; }
  @media (max-width:1000px){ .kanban{ grid-template-columns:1fr 1fr; } }
  .kanban-col{ background:var(--ink-soft); border-radius:10px; padding:12px; min-height:120px; }
  .kanban-col h4{ font-size:13px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.1em; color:var(--paper-dim); padding:4px 6px 10px; display:flex; justify-content:space-between; }
  .ticket{
    background:var(--paper); color:var(--ink); border-radius:8px; padding:12px 13px; margin-bottom:10px;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.5); border-left:5px solid var(--ok);
  }
  .ticket.age-warn{ border-left-color:var(--warn); }
  .ticket.age-bad{ border-left-color:var(--bad); animation:ticketPulse 2s ease-in-out infinite; }
  @keyframes ticketPulse{ 0%,100%{ box-shadow:0 0 0 rgba(198,42,47,0); } 50%{ box-shadow:0 0 0 3px rgba(198,42,47,.18); } }
  .ticket .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .ticket .num{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px; }
  .ticket .type{ font-size:10px; font-family:"IBM Plex Mono",monospace; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:rgba(28,23,18,.1); }
  .ticket .type.type-delivery{ background:rgba(198,42,47,.15); color:var(--sauce-deep); }
  .ticket .type.type-pickup{ background:rgba(60,120,60,.15); color:#2d5a2d; }
  .ticket .age{ font-size:11px; color:var(--sauce-deep); font-weight:700; margin-top:2px; }
  .ticket ul{ list-style:none; margin:8px 0; padding:0; font-size:12.5px; }
  .ticket li{ padding:2px 0; }
  .ticket li b{ font-family:"IBM Plex Mono",monospace; }
  .ticket .who{ font-size:11.5px; color:rgba(28,23,18,.65); margin-top:4px; }
  .ticket .tip-note{ font-size:11px; color:var(--sauce-deep); font-weight:700; margin-top:4px; }
  .ticket .advance{ width:100%; margin-top:10px; background:var(--ink); color:var(--paper); border:none; border-radius:6px; padding:12px; font-weight:700; font-size:13px; }
  .ticket .advance:hover{ background:var(--sauce); }
  .kanban-empty{ font-size:12px; color:var(--paper-dim); padding:10px 6px; }

  /* ================= DRIVER APP ================= */
  #view-driver{ max-width:520px; margin:0 auto; padding:16px 16px 60px; }
  .driver-setup{ text-align:center; padding:60px 20px; }
  .driver-card{
    background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; margin-bottom:14px;
  }
  .driver-card .top{ display:flex; justify-content:space-between; align-items:center; }
  .driver-card .addr{ font-weight:700; font-size:15px; margin-top:8px; }
  .driver-card .sub{ font-size:12.5px; color:var(--paper-dim); margin-top:2px; }
  .driver-card .due{ font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--gold); font-size:16px; margin-top:10px; }
  .driver-actions{ display:flex; gap:8px; margin-top:12px; }
  .driver-actions a, .driver-actions button{ flex:1; text-align:center; text-decoration:none; }
  .section-label{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; }
  .db-banner{ position:relative; background:var(--sauce); color:var(--paper); font-size:12.5px; font-weight:700; text-align:center; padding:8px 14px; z-index:200; }
  .db-banner a{ color:var(--paper); text-decoration:underline; }

  /* ================= MENU EDITOR ================= */
  #view-menu{ max-width:920px; margin:0 auto; padding:18px 20px 60px; }
  #view-menu .view-header{ margin-bottom:16px; }
  #view-menu .view-header h2{ font-size:24px; margin:0; }
  .me-card{ background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:16px; }
  .me-card-title{ font-weight:700; font-size:15px; }
  .me-section-title{ font-family:"Rye",serif; font-size:19px; color:var(--paper); }
  .me-table{ width:100%; border-collapse:collapse; }
  .me-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--paper-dim); padding:4px 6px; }
  .me-table td{ padding:4px 6px; }
  .me-table input{ width:100%; box-sizing:border-box; }
  .me-category summary{ list-style:none; }
  .me-category summary::-webkit-details-marker{ display:none; }
  .me-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--ink); border:1px solid var(--line-on-ink); border-radius:999px; padding:4px 6px 4px 12px; font-size:12.5px; }
  .me-chip button{ background:none; border:none; color:var(--paper-dim); font-size:16px; line-height:1; cursor:pointer; padding:0 4px; }
  .me-chip button:hover{ color:var(--sauce); }
  .me-row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
</style>
</head>
<body>

<div class="db-banner" id="db-banner" hidden></div>

<!-- ============== STAFF SIGN-IN ============== -->
<div id="screen-login">
  <svg class="badge" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="#f4ead6"/>
    <circle cx="50" cy="50" r="48" fill="none" stroke="#c22a2f" stroke-width="5"/>
    <path d="M50 22 L78 68 A32 32 0 0 1 22 68 Z" fill="#c22a2f"/>
    <circle cx="50" cy="46" r="4.2" fill="#f4ead6"/><circle cx="40" cy="58" r="4.2" fill="#f4ead6"/><circle cx="60" cy="58" r="4.2" fill="#f4ead6"/>
  </svg>
  <div>
    <h1>Staff Sign-In</h1>
    <div class="sub">Cifelli's Staff Hub</div>
  </div>
  <form id="loginForm" style="display:flex; flex-direction:column; gap:14px; max-width:300px; width:100%;">
    <div class="field-group" style="text-align:left;">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
    </div>
    <div class="field-group" style="text-align:left;">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-sauce" type="submit" id="loginSubmitBtn">Sign In</button>
    <div id="loginError" style="color:var(--bad); font-size:13px;" hidden></div>
  </form>
</div>

<!-- ============== ROLE PICKER ============== -->
<div id="screen-role" hidden>
  <svg class="badge" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="#f4ead6"/>
    <circle cx="50" cy="50" r="48" fill="none" stroke="#c22a2f" stroke-width="5"/>
    <path d="M50 22 L78 68 A32 32 0 0 1 22 68 Z" fill="#c22a2f"/>
    <circle cx="50" cy="46" r="4.2" fill="#f4ead6"/><circle cx="40" cy="58" r="4.2" fill="#f4ead6"/><circle cx="60" cy="58" r="4.2" fill="#f4ead6"/>
  </svg>
  <div>
    <h1>Cifelli's Staff Hub</h1>
    <div class="sub">One live order queue &middot; three screens</div>
  </div>
  <div class="role-grid">
    <button class="role-card" data-role="pos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/><path d="M2 13h20"/></svg>
      <div class="t">Staff POS</div>
      <div class="d">Ring up phone and walk-in orders, take cash, manage what's in progress.</div>
    </button>
    <button class="role-card" data-role="kitchen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>
      <div class="t">Kitchen Board</div>

function applyMenuConfig(cfg){

  return true;
}

<script>
/* =========================================================================
   UTILITIES
   ========================================================================= */
function money(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function newTicket(){ return 'T' + String(Date.now()).slice(-6); }
function newId(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));
  if (mins < 1) return 'just in';
  if (mins === 1) return '1 min';
  return mins + ' min';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Generic confirm modal. opts: { title, body, confirmLabel, cancelLabel,
   danger (bool, styles confirm button red), withReason (bool, shows a
   text field and passes its value to onConfirm), onConfirm(reason) }. */
function showConfirmModal(opts){
  const existing = document.getElementById('confirmModalBackdrop');
  if (existing) existing.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'confirmModalBackdrop';
  backdrop.innerHTML = `
    <div class="modal-card">
      <h3>${escapeHtml(opts.title || 'Are you sure?')}</h3>
      ${opts.body ? `<p>${escapeHtml(opts.body)}</p>` : ''}
      ${opts.withReason ? `<textarea id="confirmModalReason" rows="2" placeholder="${escapeHtml(opts.reasonPlaceholder || 'Reason (optional)')}"></textarea>` : ''}
      <div class="modal-actions">
        <button class="btn-ghost" id="confirmModalCancel" type="button">${escapeHtml(opts.cancelLabel || 'Never mind')}</button>
        <button class="btn ${opts.danger ? 'btn-sauce' : 'btn-outline'}" id="confirmModalOk" type="button">${escapeHtml(opts.confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  document.getElementById('confirmModalCancel').addEventListener('click', close);
  document.getElementById('confirmModalOk').addEventListener('click', () => {
    const reason = opts.withReason ? document.getElementById('confirmModalReason').value.trim() : undefined;
    close();
    if (opts.onConfirm) opts.onConfirm(reason);
  });
}

function computeTotals(items, tip){
  const subtotal = items.reduce((s,it)=> s + it.unitPrice*it.qty, 0);
  const tax = subtotal * TAX_RATE;
  const tipAmt = tip || 0;
  return { subtotal, tax, tip: tipAmt, total: subtotal+tax+tipAmt };
}
function lineLabel(it){
  return it.name + (it.size ? ' (' + it.size + ')' : '');
}

/* =========================================================================
   STATE
   ========================================================================= */
const App = {
  role: null,
  db: null,
  dbReady: false,
  unsub: [],
  cart: [],
  driverName: null,
  driver: null,
  isAdmin: false,
};

function showDbBanner(msg){
  const banner = document.getElementById('db-banner');
  if (!banner) return;
  if (!msg){ banner.hidden = true; banner.textContent = ''; return; }
  banner.hidden = false;
  banner.innerHTML = msg;
}

async function getDb(){
  if (App.db || App.dbReady) return App.db;
  App.dbReady = true;
  try{
    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if (!url || !key){
      showDbBanner('Not connected to a database yet. See ../supabase/README.md to finish setup (edit order/supabase-config.js).');
      App.db = null;
      return App.db;
    }
    if (typeof window.supabase === 'undefined' || typeof window.createSupabaseDb === 'undefined'){
      showDbBanner('Database scripts failed to load. Check your internet connection and reload.');
      App.db = null;
      return App.db;
    }
    const client = window.supabase.createClient(url, key);
    App.db = window.createSupabaseDb(client);
  }catch(e){
    showDbBanner('Could not connect to the database: ' + (e && e.message ? e.message : 'unknown error'));
    App.db = null;
  }
  return App.db;
}

function ordersCol(){
  return App.db ? App.db.collection('orders') : null;
}

/* Create an order document. Returns the ticket number, or null if the
   order could not be saved (caller must check for null and not proceed
   as though the order went through). */
async function submitOrder(order){
  const ticket = newTicket();
  const body = Object.assign({
    ticket,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    status: 'new',
    driver: null,
  }, order);
  const db = await getDb();
  if (!db){
    showToast('Offline: order not saved (no database connection)');
    return null;
  }
  try{
    await db.collection('orders').add(body);
  }catch(e){
    showToast('Could not save order: ' + (e && e.message ? e.message : 'unknown error'));
    return null;
  }
  return ticket;
}

async function updateOrder(docId, patch){
  const db = await getDb();
  if (!db) return;
  patch = Object.assign({ updatedAt: Date.now() }, patch);
  try{ await db.collection('orders').doc(docId).update(patch); }
  catch(e){ /* last-writer-wins; ignore transient errors */ }
}
</script>

<script>
/* =========================================================================
   AUTH GATE + BOOT + ROLE SWITCHING
   ========================================================================= */
const ROLE_LABELS = { pos:'Staff POS', kitchen:'Kitchen Board', driver:'Driver App', analytics:'Analytics', driverroster:'Driver Roster', menu:'Menu Editor' };

function stopAllSubscriptions(){
  App.unsub.forEach(fn => { try{ fn(); }catch(e){} });
  App.unsub = [];
}

function goToRole(role){
  App.role = role;
  localStorage.setItem('cifellis_role', role);
  document.getElementById('screen-role').hidden = true;
  document.getElementById('app-shell').hidden = false;
  document.getElementById('role-label').textContent = ROLE_LABELS[role];
  document.querySelectorAll('.view').forEach(v => v.hidden = true);
  stopAllSubscriptions();

  const right = document.getElementById('header-right');
  right.innerHTML = '<button class="btn-ghost" id="switch-role-btn">Switch screen</button><button class="btn-ghost" id="signout-btn">Sign Out</button>';
  document.getElementById('switch-role-btn').addEventListener('click', () => {
    localStorage.removeItem('cifellis_role');
    stopAllSubscriptions();
    document.getElementById('app-shell').hidden = true;
    document.getElementById('screen-role').hidden = false;
  });
  document.getElementById('signout-btn').addEventListener('click', async () => {
    const db = await getDb();
    if (db && db.auth) await db.auth.signOut();
  });

  if (role === 'pos'){ document.getElementById('view-pos').hidden = false; initPosView(); }
  if (role === 'kitchen'){ document.getElementById('view-kitchen').hidden = false; initKitchenView(); }
  if (role === 'driver'){ document.getElementById('view-driver').hidden = false; initDriverView(); }
  if (role === 'analytics'){ document.getElementById('view-analytics').hidden = false; initAnalyticsView(); }
  if (role === 'driverroster'){ document.getElementById('view-driverroster').hidden = false; initDriverRosterView(); }
  if (role === 'menu'){ document.getElementById('view-menu').hidden = false; initMenuEditorView(); }
}

document.querySelectorAll('.role-card').forEach(btn => {
  btn.addEventListener('click', () => goToRole(btn.getAttribute('data-role')));
});

/* Staff sign-in gate: nothing in the role picker or app shell is reachable
   until Supabase Auth confirms a signed-in session. This is a genuine
   access boundary, not just hidden UI, real protection comes from the
   database-side RLS policies (see supabase/schema.sql) requiring an
   authenticated session for reading or updating orders; this gate just
   keeps the staff screens from rendering without one. */
async function initAuthGate(){
  const db = await getDb();
  const auth = db && db.auth;
  const loginScreen = document.getElementById('screen-login');
  const roleScreen = document.getElementById('screen-role');
  const loginError = document.getElementById('loginError');

  function showLogin(msg){
    document.getElementById('app-shell').hidden = true;
    roleScreen.hidden = true;
    loginScreen.hidden = false;
    if (msg){ loginError.hidden = false; loginError.textContent = msg; }
  }
  async function showRolePicker(){
    loginScreen.hidden = true;
    roleScreen.hidden = false;
    // Must resolve before auto-resuming a saved role below: Driver
    // Roster's Approve buttons only render for App.isAdmin, so if an
    // admin's saved role is 'driverroster' and this hasn't finished
    // yet, goToRole() would render that screen with isAdmin still at
    // its default false and never re-render once the real value comes
    // back — they'd see no Approve buttons until manually switching
    // screens and back.
    await loadMyStaffRow();
    const saved = localStorage.getItem('cifellis_role');
    if (saved && ROLE_LABELS[saved]) goToRole(saved);
  }

  async function loadMyStaffRow(){
    const { data: sessionData } = await auth.getSession();
    const uid = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    if (!uid || !db) return;
    try{
      const row = await db.collection('staff').doc(uid).get();
      App.isAdmin = !!(row.data() && row.data().isAdmin);
    }catch(e){ App.isAdmin = false; }
  }

  if (!auth){
    showLogin('Not connected to the database yet. See supabase/README.md.');
    return;
  }

  const { data } = await auth.getSession();
  if (data && data.session) showRolePicker(); else showLogin();

  auth.onAuthStateChange((_event, session) => {
    if (session) showRolePicker();
    else { stopAllSubscriptions(); showLogin(); }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginSubmitBtn');
    loginError.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    const { error } = await auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Sign In';
    if (error){
      loginError.hidden = false;
      loginError.textContent = 'Incorrect email or password.';
    }
  });
}

/* Install prompt: Chrome/Edge/Android fire beforeinstallprompt; iOS Safari
   never does (there is no programmatic install there), so the button
   simply never appears on iOS and staff use Share > Add to Home Screen. */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').hidden = true;
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = true;
});
</script>

<script>
/* =========================================================================

let orderCtx = { mode:null, cart:[], pizzaSize:'medium', pizzaToppings:new Set(), orderType:null, payMethod:'cash', tip:0, tipPct:null, deliveryInfo:null, editingOrderId:null };

function resetOrderCtx(mode){
  orderCtx = { mode, cart:[], pizzaSize:'medium', pizzaToppings:new Set(), orderType:null, payMethod:'cash', tip:0, tipPct:null, deliveryInfo:null, editingOrderId:null };
}

function addLine(line){
  const key = line.name+'|'+(line.size||'')+'|'+(line.notes||'');
  const existing = orderCtx.cart.find(l => l._key===key);
  if (existing){ existing.qty += line.qty||1; }
  else { orderCtx.cart.push(Object.assign({_key:key, qty:line.qty||1}, line)); }
  renderCart(orderCtx.mode);
}
function changeQty(key, delta){
  const l = orderCtx.cart.find(x=>x._key===key);
  if (!l) return;
  l.qty += delta;
  if (l.qty<=0) orderCtx.cart = orderCtx.cart.filter(x=>x._key!==key);
  renderCart(orderCtx.mode);
}

    });
    html += `</div></div>`;
  });
  return html;
}
