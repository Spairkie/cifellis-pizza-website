async function saveStoreSettings(){
  const statusEl = document.getElementById('ss-save-status');
  const btn = document.getElementById('ss-save');
  const db = App.db || await getDb();
  if (!db){ statusEl.textContent = 'Not connected to the database.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Saving...';
  try{
    // Optimistic concurrency, same as Menu Editor: refuse to blindly
    // overwrite if someone else saved since this admin loaded the page.
    const current = await db.collection('store_settings').doc(1).get();
    if (!current.data()){
      statusEl.textContent = 'Could not save: the store_settings table has not been set up yet (see supabase/schema.sql).';
      btn.disabled = false;
      return;
    }
    if (StoreSettingsState.version !== null && current.data().version !== StoreSettingsState.version){
      statusEl.textContent = 'Someone else saved store settings since you opened this page. Reload Store Settings to see their changes, then re-apply yours.';
      btn.disabled = false;
      return;
    }
    const patch = {
      ordersPaused: document.getElementById('ss-paused').checked,
      pauseMessage: document.getElementById('ss-pause-message').value.trim() || StoreSettingsState.pauseMessage,
      hoursOverrideActive: document.getElementById('ss-hours-active').checked,
      hoursOverrideNote: document.getElementById('ss-hours-note').value.trim(),
      receiptMessage: document.getElementById('ss-receipt-message').value.trim() || StoreSettingsState.receiptMessage,
    };
    await db.collection('store_settings').doc(1).update(patch);
    applyStoreSettings(Object.assign({}, StoreSettingsState, patch, { version: (StoreSettingsState.version || 1) + 1 }));
    renderKitchenPauseBadge(); // reflect immediately in this tab's own Kitchen Board header
    statusEl.textContent = 'Saved.';
  }catch(e){
    statusEl.textContent = 'Could not save: ' + (e && e.message ? e.message : 'unknown error');
  }
  btn.disabled = false;
}

/* Kitchen Board's one-tap pause badge: visible to any staff on Kitchen
   Board (they need to know orders are paused even if they can't change
   it), clickable only for admins. Same underlying store_settings row
   Store Settings edits -- toggling here or there shows up in both. */
function renderKitchenPauseBadge(){
  const badge = document.getElementById('kitchen-pause-badge');
  if (!badge) return; // not on Kitchen Board right now
  const paused = StoreSettingsState.ordersPaused;
  badge.textContent = paused ? 'Online Orders: Paused' : 'Online Orders: On';
  badge.classList.toggle('is-paused', paused);
  badge.classList.toggle('is-clickable', !!App.isAdmin);
  badge.title = App.isAdmin ? 'Tap to ' + (paused ? 'resume' : 'pause') + ' online ordering' : '';
  badge.onclick = App.isAdmin ? toggleOrdersPaused : null;
}

async function toggleOrdersPaused(){
  const badge = document.getElementById('kitchen-pause-badge');
  const db = App.db || await getDb();
  if (!db || !badge) return;
  badge.disabled = true;
  try{
    const current = await db.collection('store_settings').doc(1).get();
    if (!current.data()){ showToast('Store settings not set up yet (see supabase/schema.sql).'); badge.disabled = false; return; }
    const next = !current.data().ordersPaused;
    await db.collection('store_settings').doc(1).update({ ordersPaused: next });
    applyStoreSettings(Object.assign({}, current.data(), { ordersPaused: next, version: current.data().version + 1 }));
    showToast(next ? 'Online ordering paused' : 'Online ordering resumed');
  }catch(e){
    showToast('Could not update: ' + (e && e.message ? e.message : 'unknown error'));
  }
  badge.disabled = false;
  renderKitchenPauseBadge();
}
</script>

<script>
/* =========================================================================
   TILL (Till / End-of-day management) -- register_shifts table + orders
   ========================================================================= */
let TillState = { openShift: null, history: [] };

// Counter orders (pickup/phone/walk-in) are cash actually sitting in the
// drawer; delivery orders are cash the driver is holding until they
// settle up back at the shop, so kept separate rather than folded into
// "expected drawer cash" -- see ROADMAP.md's till research note. Only
// counts orders actually completed (paid) inside the window, by when
// they were last updated (a reasonable stand-in for "completed at",
// since there's no dedicated timestamp for it) -- an order placed
// during a previous shift but paid for during this one counts as this
// shift's cash, not the shift it was merely placed during.
function computeTillReport(allOrders, openedAt, windowEnd){
  const inWindow = allOrders.filter(o =>
    o.status === 'completed' && (o.updatedAt||0) >= openedAt && (o.updatedAt||0) <= windowEnd
  );
  const counter = inWindow.filter(o => o.orderType !== 'delivery');
  const delivery = inWindow.filter(o => o.orderType === 'delivery');
  const sum = (arr, field) => arr.reduce((s,o) => s + (o[field]||0), 0);
  const byMethod = (arr, method) => arr.filter(o => o.payMethod === method);

  const counterCash = sum(byMethod(counter,'cash'), 'total');
  const counterCard = sum(byMethod(counter,'card'), 'total');
  const deliveryCash = sum(byMethod(delivery,'cash'), 'total');
  const deliveryCard = sum(byMethod(delivery,'card'), 'total');
  const tipsTotal = sum(inWindow, 'tip');
  const orderCount = inWindow.length;
  const revenueTotal = sum(inWindow, 'total');
  const stillOpenCount = allOrders.filter(o =>
    o.status !== 'completed' && o.status !== 'cancelled' && (o.createdAt||0) >= openedAt
  ).length;

  return {
    counterCash, counterCard, deliveryCash, deliveryCard,
    tipsTotal, orderCount, revenueTotal,
    avgTicket: orderCount ? revenueTotal / orderCount : 0,
    stillOpenCount,
  };
}

async function initTillView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-till');
  view.innerHTML = '<p style="color:var(--paper-dim);">Loading till...</p>';
  const db = App.db || await getDb();
  if (!db){ view.innerHTML = '<p style="color:var(--bad);">Not connected to the database.</p>'; return; }
  await loadTillShifts(db);
}

async function loadTillShifts(db){
  try{
    const snap = await db.collection('register_shifts').orderBy('openedAt','desc').get();
    const rows = (snap.docs || []).map(d => d.data());
    TillState.openShift = rows.find(r => r.status === 'open') || null;
    TillState.history = rows.filter(r => r.status === 'closed').slice(0, 15);
  }catch(e){
    TillState.openShift = null;
    TillState.history = [];
  }
  renderTillView();
}

function renderTillView(){
  const view = document.getElementById('view-till');
  const shift = TillState.openShift;
  const who = (email) => escapeHtml((email || '').split('@')[0] || 'unknown');

  let html = `<div class="view-header"><h2>Till</h2></div>`;

  if (!shift){
    html += `
      <div class="me-card" style="max-width:420px; margin-bottom:28px;">
        <div class="me-card-title">Open the Register</div>
        <label style="display:block; font-size:13.5px;">Starting cash count
          <input type="number" step="0.01" min="0" id="till-starting-cash" placeholder="0.00" style="width:100%; margin-top:6px;">
        </label>
        <button class="btn btn-sauce" id="till-open-btn" type="button" style="margin-top:14px;">Open Register</button>
        <div id="till-open-status" style="margin-top:8px; font-size:13px; color:var(--paper-dim);"></div>
      </div>`;
  } else {
    html += `
      <div class="me-card" style="margin-bottom:20px;">
        <div class="me-card-title">Register Open</div>
        <div style="font-size:13.5px; color:var(--paper-dim); line-height:1.6;">
          Opened by ${who(shift.openedByEmail)} at ${new Date(shift.openedAt).toLocaleString()}<br>
          Starting cash: ${money(shift.startingCash)}
        </div>
        <button class="btn-ghost" id="till-open-drawer-btn" type="button" style="margin-top:10px;">Open Drawer (No Sale)</button>
      </div>
      <div class="me-card" style="margin-bottom:20px;">
        <div class="me-card-title">So Far This Shift</div>
        <div id="till-report-root">Loading...</div>
      </div>
      <div class="me-card" style="max-width:420px; margin-bottom:28px;">
        <div class="me-card-title">Close the Register</div>
        <label style="display:block; font-size:13.5px;">Counted cash in drawer
          <input type="number" step="0.01" min="0" id="till-counted-cash" placeholder="0.00" style="width:100%; margin-top:6px;">
        </label>
        <label style="display:block; font-size:13.5px; margin-top:10px;">Notes (optional)
          <textarea id="till-close-notes" rows="2" style="width:100%; margin-top:6px;"></textarea>
        </label>
        <button class="btn btn-sauce" id="till-close-btn" type="button" style="margin-top:14px;">Close Register</button>
        <div id="till-close-status" style="margin-top:8px; font-size:13px; color:var(--paper-dim);"></div>
      </div>`;
  }

  html += `
    <h3 style="font-size:17px; margin-bottom:10px;">Recent Shifts</h3>
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:6px 16px;">
      ${TillState.history.length ? TillState.history.map((s,i) => `
        <div class="row-between" style="padding:9px 0; flex-wrap:wrap; gap:6px; ${i<TillState.history.length-1?'border-bottom:1px solid var(--line-on-ink);':''}">
          <span>${new Date(s.openedAt).toLocaleDateString()} &middot; ${who(s.openedByEmail)} &rarr; ${who(s.closedByEmail)}</span>
          <span class="mono" style="color:${(s.overShort||0) < 0 ? 'var(--bad)' : 'var(--ok)'};">
            Start ${money(s.startingCash)} &middot; Counted ${money(s.countedCash)} &middot; ${(s.overShort||0) < 0 ? 'Short' : 'Over'} ${money(Math.abs(s.overShort||0))}
          </span>
        </div>`).join('') : '<div class="cart-empty">No closed shifts yet.</div>'}
    </div>`;

  view.innerHTML = html;

  if (!shift){
    document.getElementById('till-open-btn').addEventListener('click', openRegisterShift);
  } else {
    document.getElementById('till-close-btn').addEventListener('click', closeRegisterShift);
    document.getElementById('till-open-drawer-btn').addEventListener('click', () => requestPrint(null, { drawerOnly: true }));
    subscribeTillReport(shift);
  }
}

function subscribeTillReport(shift){
  const root = document.getElementById('till-report-root');
  if (!App.db || !root) return;
  try{
    // Bounded to this shift's own window -- same reasoning as
    // Analytics' 8-day bound (see initAnalyticsView): a register shift
    // is realistically hours, not days, so this was never as exposed to
    // the 1000-row cap as Analytics' old unbounded lifetime fetch was,
    // but there's no reason to leave the same pattern sitting here now
    // that .where() exists for exactly this.
    const unsub = App.db.collection('orders').orderBy('createdAt','desc').where('createdAt', '>=', shift.openedAt).onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => d.data());
      const report = computeTillReport(docs, shift.openedAt, Date.now());
      const el = document.getElementById('till-report-root');
      if (!el) return; // navigated away since this fired
      el.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;">
          ${statCard('Counter Cash', money(report.counterCash))}
          ${statCard('Counter Card', money(report.counterCard))}
          ${statCard('Tips', money(report.tipsTotal))}
          ${statCard('Orders', report.orderCount)}
          ${statCard('Avg Ticket', money(report.avgTicket))}
          ${statCard('Expected Drawer', money(shift.startingCash + report.counterCash))}
        </div>
        ${(report.deliveryCash || report.deliveryCard) ? `<div style="font-size:12.5px; color:var(--paper-dim); margin-top:12px;">Delivery orders this shift: ${money(report.deliveryCash)} cash, ${money(report.deliveryCard)} card &mdash; with drivers, not the drawer.</div>` : ''}
        ${report.stillOpenCount ? `<div style="font-size:12.5px; color:var(--warn); margin-top:6px;">${report.stillOpenCount} order(s) from this shift still in progress -- not counted above yet.</div>` : ''}
      `;
    }, () => {
      const el = document.getElementById('till-report-root');
      if (el) el.innerHTML = '<div class="cart-empty">Could not load live orders.</div>';
    });
    App.unsub.push(unsub);
  }catch(e){
    root.innerHTML = '<div class="cart-empty">Could not load live orders.</div>';
  }
}

async function openRegisterShift(){
  const input = document.getElementById('till-starting-cash');
  const statusEl = document.getElementById('till-open-status');
  const btn = document.getElementById('till-open-btn');
  const startingCash = Number(input.value) || 0;
  const db = App.db || await getDb();
  if (!db){ statusEl.textContent = 'Not connected to the database.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Opening...';
  try{
    const { data: sessionData } = await db.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    await db.collection('register_shifts').add({
      openedBy: user ? user.id : null,
      openedByEmail: user ? user.email : '',
      startingCash,
      status: 'open',
    });
    await loadTillShifts(db);
  }catch(e){
    statusEl.textContent = 'Could not open register: ' + (e && e.message ? e.message : 'the register may already be open -- reload Till to check.');
    btn.disabled = false;
  }
}

async function closeRegisterShift(){
  const shift = TillState.openShift;
  if (!shift) return;
  const input = document.getElementById('till-counted-cash');
  const notesEl = document.getElementById('till-close-notes');
  const statusEl = document.getElementById('till-close-status');
  const btn = document.getElementById('till-close-btn');
  if (!input.value){ statusEl.textContent = 'Enter the counted cash amount first.'; return; }
  const countedCash = Number(input.value) || 0;
  const db = App.db || await getDb();
  if (!db){ statusEl.textContent = 'Not connected to the database.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Closing...';
  try{
    const { data: sessionData } = await db.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    // Final snapshot: recompute fresh right at close time rather than
    // trusting whatever the last live tick happened to render, so the
    // stored report can never be stale relative to what's saved.
    const snap = await db.collection('orders').get();
    const docs = (snap.docs || []).map(d => d.data());
    const closedAt = Date.now();
    const report = computeTillReport(docs, shift.openedAt, closedAt);
    const expectedCash = shift.startingCash + report.counterCash;
    const overShort = countedCash - expectedCash;
    await db.collection('register_shifts').doc(shift.id).update({
      closedBy: user ? user.id : null,
      closedByEmail: user ? user.email : '',
      countedCash,
      overShort,
      closedAt,
      report,
      notes: notesEl.value.trim(),
      status: 'closed',
    });
    await loadTillShifts(db);
  }catch(e){
    statusEl.textContent = 'Could not close register: ' + (e && e.message ? e.message : 'unknown error');
    btn.disabled = false;
  }
}
</script>

<script>
/* =========================================================================
   LIVE BUG REPORTING -- bug_reports table
   ========================================================================= */
// Available to every staff member (the header button), not just admins --
// anyone might spot something broken mid-shift. Only an admin can see
// the list and resolve them (Bug Reports role, admin-only).
function openBugReportModal(){
  showConfirmModal({
    title: 'Report a Bug',
    body: "Describe what's broken or not working right — this goes straight to the admin, along with which screen you were on.",
    withReason: true,
    reasonPlaceholder: 'What happened? Be as specific as you can.',
    confirmLabel: 'Send Report',
    onConfirm: (message) => submitBugReport(message),
  });
}

async function submitBugReport(message){
  const msg = (message || '').trim();
  if (!msg){ showToast('No description entered — nothing sent.'); return; }
  const db = App.db || await getDb();
  if (!db){ showToast('Not connected to the database.'); return; }
  try{
    const { data: sessionData } = await db.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    await db.collection('bug_reports').add({
      reportedBy: user ? user.id : null,
      reportedByEmail: user ? user.email : '',
      role: App.role || null,
      message: msg,
      status: 'open',
    });
    showToast('Thanks — sent to the admin.');
  }catch(e){
    showToast('Could not send report: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

async function initBugReportsView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-bugreports');
  view.innerHTML = '<p style="color:var(--paper-dim);">Loading bug reports...</p>';
  const db = App.db || await getDb();
  if (!db){ view.innerHTML = '<p style="color:var(--bad);">Not connected to the database.</p>'; return; }
  try{
    const unsub = db.collection('bug_reports').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => d.data());
      renderBugReports(docs);
    }, () => { view.innerHTML = '<div class="cart-empty">Could not load bug reports.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    view.innerHTML = '<div class="cart-empty">Could not load bug reports.</div>';
  }
}

function renderBugReports(reports){
  const view = document.getElementById('view-bugreports');
  const who = (email) => escapeHtml((email || '').split('@')[0] || 'unknown');
  const open = reports.filter(r => r.status === 'open');
  const resolved = reports.filter(r => r.status === 'resolved').slice(0, 20);

  const row = (r) => `
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; margin-bottom:8px;">
      <div class="row-between" style="align-items:flex-start; gap:12px;">
        <div style="flex:1; min-width:200px;">
          <div style="font-size:13.5px;">${escapeHtml(r.message)}</div>
          <div style="font-size:11.5px; color:var(--paper-dim); margin-top:6px;">${who(r.reportedByEmail)} &middot; ${escapeHtml(ROLE_LABELS[r.role] || '—')} &middot; ${new Date(r.createdAt).toLocaleString()}</div>
          ${r.status === 'resolved' ? `<div style="font-size:11.5px; color:var(--ok); margin-top:4px;">Resolved by ${who(r.resolvedByEmail)} &middot; ${new Date(r.resolvedAt).toLocaleString()}</div>` : ''}
        </div>
        ${r.status === 'open' ? `<button class="btn-ghost" data-resolve="${r.id}" type="button">Mark Resolved</button>` : ''}
      </div>
    </div>`;

  view.innerHTML = `
    <div class="view-header"><h2>Bug Reports</h2></div>
    <h3 style="font-size:17px; margin-bottom:10px;">Open (${open.length})</h3>
    ${open.length ? open.map(row).join('') : '<div class="cart-empty">Nothing open right now.</div>'}
    <h3 style="font-size:17px; margin:24px 0 10px;">Recently Resolved</h3>
    ${resolved.length ? resolved.map(row).join('') : '<div class="cart-empty">Nothing resolved yet.</div>'}`;

  view.querySelectorAll('[data-resolve]').forEach(btn => {
    btn.addEventListener('click', () => resolveBugReport(btn.getAttribute('data-resolve')));
  });
}

async function resolveBugReport(id){
  const db = App.db || await getDb();
  if (!db) return;
  try{
    const { data: sessionData } = await db.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    await db.collection('bug_reports').doc(id).update({
      status: 'resolved',
      resolvedBy: user ? user.id : null,
      resolvedByEmail: user ? user.email : '',
      resolvedAt: Date.now(),
    });
  }catch(e){
    showToast('Could not mark resolved: ' + (e && e.message ? e.message : 'unknown error'));
  }
}
</script>

<script>
/* =========================================================================
   CATERING INQUIRIES (Phase 8: Growth Features), admin-only
   ========================================================================= */
/* Fed by the public inquiry form (order/catering.html) -- catering_
   inquiries is deliberately its own table, never orders, so nothing
   submitted here can ever land in the kitchen queue by accident. Status
   is a simple manual workflow (new -> contacted -> quoted -> confirmed/
   declined); nothing here creates a real order automatically -- staff
   still ring one up through POS once terms are actually agreed. */
const CATERING_STATUS_LABELS = { new:'New', contacted:'Contacted', quoted:'Quoted', confirmed:'Confirmed', declined:'Declined' };

async function initCateringView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-catering');
  view.innerHTML = '<p style="color:var(--paper-dim);">Loading catering inquiries...</p>';
  const db = App.db || await getDb();
  if (!db){ view.innerHTML = '<p style="color:var(--bad);">Not connected to the database.</p>'; return; }
  try{
    const unsub = db.collection('catering_inquiries').orderBy('createdAt','desc').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => Object.assign({ id: d.id }, d.data()));
      renderCateringInquiries(docs);
    }, () => { view.innerHTML = '<div class="cart-empty">Could not load catering inquiries.</div>'; });
    App.unsub.push(unsub);
  }catch(e){
    view.innerHTML = '<div class="cart-empty">Could not load catering inquiries.</div>';
  }
}

function renderCateringInquiries(inquiries){
  const view = document.getElementById('view-catering');
  const active = inquiries.filter(i => i.status !== 'confirmed' && i.status !== 'declined');
  const closed = inquiries.filter(i => i.status === 'confirmed' || i.status === 'declined').slice(0, 20);

  const row = (i) => `
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:8px; padding:12px 14px; margin-bottom:8px;">
      <div class="row-between" style="align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div style="flex:1; min-width:220px;">
          <div style="font-weight:700; font-size:14px;">${escapeHtml(i.name)} <span class="mono" style="color:var(--paper-dim); font-weight:400; font-size:12px;">${escapeHtml(i.phone)}</span></div>
          ${i.email ? `<div style="font-size:12px; color:var(--paper-dim);">${escapeHtml(i.email)}</div>` : ''}
          <div style="font-size:12.5px; margin-top:6px;">${escapeHtml(i.details || '')}</div>
          <div style="font-size:11.5px; color:var(--paper-dim); margin-top:6px;">${i.eventDate ? 'Event: ' + escapeHtml(i.eventDate) + ' &middot; ' : ''}${i.guestCount ? i.guestCount + ' guests &middot; ' : ''}Received ${new Date(i.createdAt).toLocaleString()}</div>
        </div>
        <select data-status-select="${i.id}" style="font-size:12.5px; padding:6px;">
          ${Object.entries(CATERING_STATUS_LABELS).map(([v,label]) => `<option value="${v}" ${i.status===v?'selected':''}>${label}</option>`).join('')}
        </select>
      </div>
    </div>`;

  view.innerHTML = `
    <div class="view-header"><h2>Catering Inquiries</h2></div>
    <h3 style="font-size:17px; margin-bottom:10px;">Active (${active.length})</h3>
    ${active.length ? active.map(row).join('') : '<div class="cart-empty">Nothing open right now.</div>'}
    <h3 style="font-size:17px; margin:24px 0 10px;">Recently Closed</h3>
    ${closed.length ? closed.map(row).join('') : '<div class="cart-empty">Nothing closed yet.</div>'}`;

  view.querySelectorAll('[data-status-select]').forEach(sel => {
    sel.addEventListener('change', () => updateCateringStatus(sel.getAttribute('data-status-select'), sel.value));
  });
}

async function updateCateringStatus(id, status){
  const db = App.db || await getDb();
  if (!db) return;
  try{
    await db.collection('catering_inquiries').doc(id).update({ status });
  }catch(e){
    showToast('Could not update status: ' + (e && e.message ? e.message : 'unknown error'));
  }
}
</script>

<script>
/* =========================================================================
   PROMO CODES (admin-only) -- promo_codes + promo_redemptions tables
   ========================================================================= */
// Policy decision (owner, 2026-09-07): one redemption per phone number
// per code. Enforced server-side in redeem_promo_code() (see
// supabase/schema.sql), not here -- this screen only creates/deactivates
// codes and shows how many times each has been redeemed.
async function initPromoCodesView(){
  const view = document.getElementById('view-promocodes');
  view.innerHTML = '<p style="color:var(--paper-dim);">Loading promo codes...</p>';
  const db = App.db || await getDb();

  let codes = [];

    codes = (snap.docs || []).map(d => d.data());

    </div>

    <h3 style="font-size:17px; margin-bottom:10px;">Existing Codes</h3>
    <div style="background:var(--ink-soft); border:1px solid var(--line-on-ink); border-radius:10px; padding:6px 16px;">
      ${codes.length ? codes.map((c,i) => `
        <div class="row-between" style="padding:10px 0; flex-wrap:wrap; gap:8px; ${i<codes.length-1?'border-bottom:1px solid var(--line-on-ink);':''}">
          <div>
            <span class="mono" style="font-weight:700;">${escapeHtml(c.code)}</span>
            ${c.label ? ` — ${escapeHtml(c.label)}` : ''}
            <div style="font-size:11.5px; color:var(--paper-dim); margin-top:2px;">
              ${c.discountType === 'percent' ? `${c.amount}% off` : `${money(c.amount)} off`}
              ${c.expiresAt ? ` &middot; expires ${new Date(c.expiresAt).toLocaleDateString()}` : ''}
              &middot; ${redemptionCounts.get(c.code) || 0} redeemed
              &middot; <span style="color:${c.active ? 'var(--ok)' : 'var(--bad)'};">${c.active ? 'Active' : 'Inactive'}</span>
            </div>
          </div>
          <button class="btn-ghost" data-toggle-active="${c.id}" data-next="${!c.active}" type="button">${c.active ? 'Deactivate' : 'Reactivate'}</button>
        </div>`).join('') : '<div class="cart-empty">No promo codes yet.</div>'}
    </div>`;

  document.getElementById('pc-create-btn').addEventListener('click', createPromoCode);
  view.querySelectorAll('[data-toggle-active]').forEach(btn => {
    btn.addEventListener('click', () => togglePromoCodeActive(btn.getAttribute('data-toggle-active'), btn.getAttribute('data-next') === 'true'));
  });
}

async function createPromoCode(){
  const statusEl = document.getElementById('pc-create-status');
  const btn = document.getElementById('pc-create-btn');
  const code = document.getElementById('pc-new-code').value.trim().toUpperCase();
  const label = document.getElementById('pc-new-label').value.trim();
  const discountType = document.getElementById('pc-new-type').value;
  const amount = Number(document.getElementById('pc-new-amount').value);
  const expiresStr = document.getElementById('pc-new-expires').value;
  const expiresAt = expiresStr ? new Date(expiresStr + 'T23:59:59').getTime() : null;
  if (!code){ statusEl.textContent = 'Enter a code.'; return; }
  if (!amount || amount <= 0){ statusEl.textContent = 'Enter an amount greater than 0.'; return; }
  if (discountType === 'percent' && amount > 100){ statusEl.textContent = 'A percent-off code can\'t exceed 100.'; return; }
  const db = App.db || await getDb();
  if (!db){ statusEl.textContent = 'Not connected to the database.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Creating...';
  try{
    const { data: sessionData } = await db.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    await db.collection('promo_codes').add({
      code, label, discountType, amount, active: true, expiresAt,
      createdBy: user ? user.id : null,
    });
    // A toast, not the inline status line -- loadPromoCodes() below
    // replaces this whole view (to show the new code in the list right
    // away), which would wipe an inline message before anyone saw it.
    showToast(`Promo code ${code} created`);
    await loadPromoCodes(db);
  }catch(e){
    statusEl.textContent = 'Could not create: ' + (e && e.message ? e.message : (e && e.code === '23505' ? 'That code already exists.' : 'unknown error'));
    btn.disabled = false;
  }
}

async function togglePromoCodeActive(id, next){
  const db = App.db || await getDb();
  if (!db) return;
  try{
    await db.collection('promo_codes').doc(id).update({ active: next });
    await loadPromoCodes(db);
  }catch(e){
    showToast('Could not update: ' + (e && e.message ? e.message : 'unknown error'));
  }
}
</script>

<script>
/* =========================================================================
   SYSTEM HEALTH (Phase 4: Operational Monitoring), admin-only
   ========================================================================= */
/* A snapshot, not a live subscription -- this is a diagnostic screen an
   admin checks in on, not something that needs to update itself while
   sitting open. Fetched fresh on entry and on demand (Refresh button).
   The one thing checked live in the browser, not through system_health(),
   is Realtime connectivity -- that's inherently a property of *this*
   browser tab's own WebSocket connection, not something a database
   query could ever answer. Monitoring failure must never block
   ordering: every read here is read-only, and a failure to load this
   screen has no effect on anything else in the app. */

function healthStatusBadge(status){
  const map = {
    healthy: { label: 'Healthy', color: 'var(--ok)' },
    degraded: { label: 'Degraded', color: 'var(--warn)' },
    down: { label: 'Down', color: 'var(--bad)' },
    paused: { label: 'Paused', color: 'var(--warn)' },
    notconfigured: { label: 'Not Configured', color: 'var(--paper-dim)' },
    unknown: { label: 'Unknown', color: 'var(--paper-dim)' },
  };
  const m = map[status] || map.unknown;
  return `<span class="mono" style="color:${m.color}; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.06em;">${m.label}</span>`;
}

function healthCard(title, status, detailHtml){
  return `<div class="me-card" style="margin-bottom:14px;">
    <div class="row-between" style="align-items:flex-start;">
      <div class="me-card-title" style="margin-bottom:0;">${escapeHtml(title)}</div>
      ${healthStatusBadge(status)}
    </div>
    <div style="font-size:13px; color:var(--paper-dim); margin-top:6px; line-height:1.5;">${detailHtml}</div>
  </div>`;
}

async function initSystemHealthView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-systemhealth');
  view.innerHTML = `
    <div class="view-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h2>System Health</h2>
      <button class="btn-ghost" id="health-refresh-btn" type="button">Refresh</button>
    </div>
    <div id="health-root" style="max-width:720px;">Loading...</div>`;
  document.getElementById('health-refresh-btn').addEventListener('click', loadSystemHealth);
  await loadSystemHealth();
}

async function loadSystemHealth(){
  const root = document.getElementById('health-root');
  if (!root) return;
  const db = App.db || await getDb();
  if (!db){
    root.innerHTML = healthCard('Database', 'down', 'Not connected to Supabase at all -- check order/supabase-config.js and network connectivity.');
    return;
  }
  let health;
  try{
    health = await db.rpc('system_health', {});
  }catch(e){
    root.innerHTML = healthCard('Database', 'down', 'system_health() failed: ' + escapeHtml((e && e.message) || 'unknown error') + '. If this persists, the database itself may be unreachable, not just this one call.');
    return;
  }
  renderSystemHealth(health, root);
  checkRealtimeHealth(db); // async, patches its own card in once it resolves -- see below
}

function timeAgoOrNever(ts){
  return ts ? timeAgo(ts) + ' ago' : 'never';
}

function renderSystemHealth(h, root){
  const now = Date.now();

  // Database: got this far, so the RPC round-trip itself succeeded.
  const dbCard = healthCard('Database', 'healthy', `Reachable -- responded just now.`);

  // Realtime: placeholder until checkRealtimeHealth's own async check
  // resolves and patches #health-realtime-detail in place below.
  const realtimeCard = `<div class="me-card" style="margin-bottom:14px;" id="health-realtime-card">
    <div class="row-between" style="align-items:flex-start;">
      <div class="me-card-title" style="margin-bottom:0;">Realtime</div>
      <span id="health-realtime-badge">${healthStatusBadge('unknown')}</span>
    </div>
    <div style="font-size:13px; color:var(--paper-dim); margin-top:6px;" id="health-realtime-detail">Checking this tab's live connection...</div>
  </div>`;

  const orderingStatus = h.ordersPaused ? 'paused' : 'healthy';
  const orderingCard = healthCard('Online Ordering', orderingStatus,
    h.ordersPaused
      ? `Paused${h.pauseMessage ? ': "' + escapeHtml(h.pauseMessage) + '"' : ''}. Toggle from Kitchen Board or Store Settings.`
      : 'Accepting online orders normally.');

  const menuOk = h.menuConfigVersion != null;
  const menuCard = healthCard('Menu Config', menuOk ? 'healthy' : 'down',
    menuOk ? `Version ${h.menuConfigVersion}, last updated ${timeAgoOrNever(h.menuConfigUpdatedAt)}.` : 'No menu_config row found -- the kiosk is running on its hardcoded fallback menu.');

  const settingsOk = h.storeSettingsVersion != null;
  const settingsCard = healthCard('Store Settings', settingsOk ? 'healthy' : 'down',
    settingsOk ? `Version ${h.storeSettingsVersion}, last updated ${timeAgoOrNever(h.storeSettingsUpdatedAt)}.` : 'No store_settings row found.');

  const lastOrderCard = healthCard('Last Customer Order', 'unknown',
    h.lastCustomerOrderAt ? `${timeAgoOrNever(h.lastCustomerOrderAt)} (${new Date(h.lastCustomerOrderAt).toLocaleString()}).` : 'No customer orders on record yet.');

  const errorRows = h.recentErrors || [];
  const errorsCard = healthCard('Recent App Errors', errorRows.length ? 'degraded' : 'healthy',
    errorRows.length
      ? errorRows.slice(0, 8).map(e => `<div style="margin-bottom:4px;"><span class="mono" style="color:var(--paper-dim);">[${escapeHtml(e.source)}]</span> ${escapeHtml(e.message)} <span style="color:var(--paper-dim);">&times;${e.occurrenceCount}, last ${timeAgo(e.lastSeenAt)} ago</span></div>`).join('')
      : 'None reported.');

  const staleCard = healthCard('Driver Locations', h.staleDriverCount > 0 ? 'degraded' : 'healthy',
    `${h.activeDriverLocationCount} active location row(s)${h.staleDriverCount ? `, ${h.staleDriverCount} stale (no update in 5+ min)` : ''}.`);

  // Payments: derived from real order data (see system_health()'s own
  // comment) -- always "Not Configured" until a real processor is
  // wired up and has actually processed at least one order.
  const paymentsConfiguredClientSide = (typeof paymentsConfigured === 'function') && paymentsConfigured();
  const paymentsStatus = h.paymentOrderCount > 0 ? 'healthy' : 'notconfigured';
  const paymentsCard = healthCard('Payments', paymentsStatus,
    h.paymentOrderCount > 0
      ? `${h.paymentOrderCount} order(s) on record with a payment provider set.`
      : `No processor wired up yet${paymentsConfiguredClientSide ? ' (a publishable key is set client-side, but no order has gone through it yet)' : ''} -- see order/payments.js and OWNER-TODO.md.`);

  // SMS: same reasoning -- derived from smsStatus on real orders.
  let smsStatus = 'notconfigured';
  if (h.smsSentCount > 0 && h.smsFailedCount === 0) smsStatus = 'healthy';
  else if (h.smsSentCount > 0 && h.smsFailedCount > 0) smsStatus = 'degraded';
  else if (h.smsFailedCount > 0 && h.smsSentCount === 0) smsStatus = 'down';
  const smsCard = healthCard('SMS Notifications', smsStatus,
    (h.smsSentCount > 0 || h.smsFailedCount > 0)
      ? `${h.smsSentCount} sent, ${h.smsFailedCount} failed. ${h.smsOptInRecentCount} opt-in(s) in the last 7 days.`
      : `Not sending yet (${h.smsOptInRecentCount} customer(s) opted in over the last 7 days, waiting) -- see supabase/functions/send-order-sms and OWNER-TODO.md.`);

  // Print bridge: from service_heartbeats. No row at all means it's
  // never once reported in; a stale row (10+ min) means it was running
  // and stopped.
  const printHb = (h.serviceHeartbeats || []).find(s => s.service === 'print-bridge');
  let printStatus = 'notconfigured';
  let printDetail = 'Not set up yet -- see print-bridge/ and OWNER-TODO.md.';
  if (printHb){
    const staleMs = now - printHb.lastSeenAt;
    if (staleMs > 10*60*1000){
      printStatus = 'down';
      printDetail = `Last heard from ${timeAgo(printHb.lastSeenAt)} ago (${escapeHtml(printHb.detail || '')}) -- assume it's not running right now.`;
    } else {
      printStatus = printHb.status === 'healthy' ? 'healthy' : 'degraded';
      printDetail = `${escapeHtml(printHb.detail || printHb.status)} -- last heard from ${timeAgo(printHb.lastSeenAt)} ago.`;
    }
  }
  const printCard = healthCard('Receipt Printer Bridge', printStatus, printDetail);

  const scheduledCard = healthCard('Scheduled Orders', 'notconfigured', 'Feature not built yet -- see ROADMAP.md Phase 8.');

  const externalRows = h.externalChecks || [];
  const externalCard = healthCard('External Site Checks', externalRows.length ? (externalRows.every(r => r.ok) ? 'healthy' : 'degraded') : 'notconfigured',
    externalRows.length
      ? externalRows.map(r => `<div style="margin-bottom:4px;">${r.ok ? healthStatusBadge('healthy') : healthStatusBadge('down')} <span class="mono">${escapeHtml(r.target)}</span> ${r.statusCode ? '(' + r.statusCode + ')' : ''} <span style="color:var(--paper-dim);">checked ${timeAgo(r.checkedAt)} ago</span>${r.detail ? ' -- ' + escapeHtml(r.detail) : ''}</div>`).join('')
      : 'Not set up yet -- see .github/workflows/health-check.yml.');

  root.innerHTML = `
    <div style="font-size:12px; color:var(--paper-dim); margin-bottom:14px;">Checked ${new Date(h.checkedAt).toLocaleString()}</div>
    ${dbCard}${realtimeCard}${orderingCard}${menuCard}${settingsCard}${lastOrderCard}${errorsCard}${staleCard}${paymentsCard}${smsCard}${printCard}${scheduledCard}${externalCard}
  `;
}

// A dedicated client, created once and reused across every health check
// (not one per load/refresh) purely to reach .channel() -- the
// Firestore-shaped adapter (order/db-supabase.js) deliberately doesn't
// expose that. Creating a fresh Supabase client per call worked, but
// each one spins up its own GoTrueClient sharing the same localStorage
// auth-token key as the page's real client and every previous check's
// client -- harmless once, real waste (and a logged warning) on every
// repeat visit to this screen.
let healthCheckClient = null;

async function checkRealtimeHealth(db){
  const badgeEl = document.getElementById('health-realtime-badge');
  const detailEl = document.getElementById('health-realtime-detail');
  if (!badgeEl || !detailEl || !db || !db.rpc) return; // db here is the Firestore-shaped wrapper; need the raw client for a channel
  try{
    if (!healthCheckClient) healthCheckClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    const client = healthCheckClient;
    let settled = false;
    const timeout = setTimeout(() => {
      if (settled) return;
      settled = true;
      badgeEl.innerHTML = healthStatusBadge('down');
      detailEl.textContent = 'No response within 5s -- Realtime may be unreachable from this browser/network.';
      try{ client.realtime.disconnect(); }catch(e){}
    }, 5000);
    const channel = client.channel('health-check-' + Math.random().toString(36).slice(2));
    channel.subscribe((status) => {
      if (settled) return;
      if (status === 'SUBSCRIBED'){
        settled = true;
        clearTimeout(timeout);
        badgeEl.innerHTML = healthStatusBadge('healthy');
        detailEl.textContent = 'Connected just now.';
        client.removeChannel(channel);
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
        settled = true;
        clearTimeout(timeout);
        badgeEl.innerHTML = healthStatusBadge('down');
        detailEl.textContent = 'Connection status: ' + status + '.';
        try{ client.removeChannel(channel); }catch(e){}
      }
    });
  }catch(e){
    badgeEl.innerHTML = healthStatusBadge('unknown');
    detailEl.textContent = 'Could not run the check: ' + ((e && e.message) || 'unknown error');
  }
}
</script>

<script>
/* =========================================================================
   DRIVER MAP -- driver_locations table, rendered with Leaflet + OSM tiles
   (both free, no API key -- same reasoning as the Nominatim/OSRM geocoder
   already used for delivery distance in order/geo.js)
   ========================================================================= */
// SHOP_LOCATION itself comes from order/geo.js (loaded above -- note its
// field is .lon, not .lng, matching that file's own convention).
const DRIVER_LOCATION_STALE_MS = 2 * 60 * 1000; // older than this: may be offline

let driverMapInstance = null;
let driverMapMarkers = new Map(); // driverId -> L.marker
let driverMapDriversById = new Map(); // driverId -> drivers row, for name lookups
let driverMapLastDocs = [];
let driverMapStaleTimer = null;

async function initDriverMapView(){
  stopAllSubscriptions();
  const view = document.getElementById('view-drivermap');
  view.innerHTML = `
    <div class="view-header"><h2>Driver Map</h2></div>
    <div id="driver-map"></div>
    <div style="font-size:12px; color:var(--paper-dim); margin-top:10px;">Shows drivers currently out on a delivery. A grayed-out pin means that driver's phone hasn't reported in over 2 minutes — they may be offline or between deliveries.</div>`;
  if (typeof L === 'undefined'){
    document.getElementById('driver-map').outerHTML = '<div class="cart-empty">Map library failed to load. Check your internet connection and reload.</div>';
    return;
  }
  const db = App.db || await getDb();
  if (!db){ document.getElementById('driver-map').outerHTML = '<div class="cart-empty">Not connected to the database.</div>'; return; }

  driverMapMarkers = new Map();
  driverMapLastDocs = [];
  driverMapInstance = L.map('driver-map').setView([SHOP_LOCATION.lat, SHOP_LOCATION.lon], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(driverMapInstance);
  L.marker([SHOP_LOCATION.lat, SHOP_LOCATION.lon], {
    icon: L.divIcon({ className:'', html:'<div class="driver-map-shop-pin">🍕</div>', iconSize:[22,22], iconAnchor:[11,11] }),
  }).addTo(driverMapInstance).bindPopup("Cifelli's Pizza");

  App.unsub.push(() => {
    if (driverMapInstance){ driverMapInstance.remove(); driverMapInstance = null; }
    clearInterval(driverMapStaleTimer);
  });

  try{
    const driversSnap = await db.collection('drivers').get();
    driverMapDriversById = new Map((driversSnap.docs || []).map(d => [d.id, d.data()]));
  }catch(e){ driverMapDriversById = new Map(); }

  try{
    const unsub = db.collection('driver_locations').onSnapshot(snap => {
      renderDriverMapMarkers((snap.docs || []).map(d => d.data()));
    }, () => { /* map just stops updating -- not worth a full error state for a live-position feed */ });
    App.unsub.push(unsub);
  }catch(e){ /* map still shows the shop pin even if this fails */ }

  // Re-check staleness on a timer independent of new data arriving -- a
  // driver whose phone died should visibly gray out even if nothing
  // else ever changes again.
  driverMapStaleTimer = setInterval(() => renderDriverMapMarkers(), 30000);
}

function driverMapPinHtml(name, stale){
  const initial = escapeHtml((name || '?').charAt(0).toUpperCase());
  return `<div class="driver-map-pin${stale ? ' is-stale' : ''}"><span>${initial}</span></div>`;
}

function renderDriverMapMarkers(docs){
  if (!driverMapInstance) return;
  if (docs) driverMapLastDocs = docs;
  const now = Date.now();
  const seenIds = new Set();

  driverMapLastDocs.forEach(row => {
    seenIds.add(row.id);
    const driver = driverMapDriversById.get(row.id);
    const name = (driver && driver.name) || 'Driver';
    const stale = (now - (row.updatedAt || 0)) > DRIVER_LOCATION_STALE_MS;
    const popupHtml = `<b>${escapeHtml(name)}</b><br>${stale ? 'Last seen' : 'Updated'} ${timeAgo(row.updatedAt || 0)}`;
    const icon = L.divIcon({ className:'', html: driverMapPinHtml(name, stale), iconSize:[26,26], iconAnchor:[13,26] });
    let marker = driverMapMarkers.get(row.id);
    if (!marker){
      marker = L.marker([row.lat, row.lng], { icon }).addTo(driverMapInstance).bindPopup(popupHtml);
      driverMapMarkers.set(row.id, marker);
    } else {
      marker.setLatLng([row.lat, row.lng]);
      marker.setIcon(icon);
      marker.setPopupContent(popupHtml);
    }
  });

  // Drop markers for drivers no longer reporting a location at all
  // (their delivery finished and the row was deleted).
  [...driverMapMarkers.keys()].forEach(id => {
    if (!seenIds.has(id)){
      driverMapInstance.removeLayer(driverMapMarkers.get(id));
      driverMapMarkers.delete(id);
    }
  });
}
</script>

<script>
/* Runs last, after every view's init function above is defined, so an
   auto-resumed saved role (from a previous visit) never calls a
   not-yet-defined initXView function. */
(async function boot(){
  const db = await getDb();
  await loadMenuConfig(db);
  await loadStoreSettings(db);
  await initAuthGate();
  document.getElementById('brandHomeBtn').addEventListener('click', () => {
    if (document.getElementById('app-shell').hidden) return; // not signed in yet -- nothing to go back to
    localStorage.removeItem('cifellis_role');
    stopAllSubscriptions();
    document.getElementById('app-shell').hidden = true;
    document.getElementById('screen-role').hidden = false;
  });
})();
</script>

<script>
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
