<style>
  :root{
    --ink:#1c1712; --paper:#f4ead6; --paper-dim:#e9dcbf;
    --sauce:#c22a2f; --sauce-deep:#821e21; --gold:#dc9f34;
    --line-on-ink: rgba(244,234,214,.16);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:"Work Sans",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px 20px;
  }
  .wrap{ max-width:440px; }
  .badge{ width:76px; height:76px; margin:0 auto 22px; display:block; }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px;
  }
  h1{
    font-family:"Rye",serif; font-weight:400; font-size:clamp(34px,7vw,48px);
    margin:0 0 14px; line-height:1.05;
  }
  p{ color:var(--paper-dim); font-size:15.5px; line-height:1.6; margin:0 0 30px; }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 16px; border-radius:999px; font-weight:700; font-size:14px;
    text-decoration:none; border:1px solid var(--line-on-ink);
  }
  .btn--sauce{ background:var(--sauce); color:var(--paper); border-color:var(--sauce); grid-column:1 / -1; }
  .btn--sauce:hover{ background:var(--sauce-deep); }
  .btn--outline{ color:var(--paper); }
  .btn--outline:hover{ border-color:var(--gold); color:var(--gold); }
</style>
</head>
<body>
  <div class="wrap">

    <p>The page you're looking for doesn't exist, or the link's out of date. Here's how to get back to something real.</p>
    <div class="actions">
      <a class="btn btn--sauce" href="/cifellis/order/">Order Online &rarr;</a>
      <a class="btn btn--outline" href="/cifellis/">Home</a>
      <a class="btn btn--outline" href="/cifellis/#menu">Menu</a>
      <a class="btn btn--outline" href="tel:+18564358799" style="grid-column:1 / -1;">Call (856) 435-8799</a>
    </div>
  </div>
</body>
